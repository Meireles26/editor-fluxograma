<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Fluxogramas de Processos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --ink:#0B4A44; --ink-deep:#062E2A; --steel:#2F6E67; --amber:#00A29B; --moss:#3F7A56; --rust:#A8402E;
    --paper:#EEF1EC; --panel:#FBFCFA; --line:#D7DBD1;
    --font-display:'IBM Plex Sans Condensed',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:13px;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}

  /* ===== TOPBAR ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--ink-deep);color:#fff;border-bottom:3px solid var(--amber);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;background:var(--amber);color:#1D1204;padding:3px 7px;border-radius:3px;font-weight:600;}
  .title-input{
    font-family:var(--font-display);font-weight:700;font-size:17px;background:transparent;border:none;color:#fff;
    border-bottom:1px dashed transparent;padding:2px 4px;min-width:220px;
  }
  .title-input:hover, .title-input:focus{border-bottom:1px dashed rgba(255,255,255,.5);outline:none;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  button{font-family:var(--font-body);cursor:pointer;border:none;border-radius:3px;font-weight:600;transition:transform .06s ease, background .15s ease;}
  button:active{transform:translateY(1px);}
  .btn-ghost{background:transparent;color:#E7ECF1;border:1px solid rgba(255,255,255,.28);padding:7px 12px;font-size:12.5px;}
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .btn-primary{background:var(--amber);color:#1D1204;padding:7px 14px;font-size:12.5px;}
  .btn-primary:hover{background:#c8862f;}
  .dropdown{position:relative;display:inline-block;}
  .dropdown-menu{
    display:none;position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.15);min-width:170px;z-index:40;overflow:hidden;
  }
  .dropdown.open .dropdown-menu{display:block;}
  .dropdown-menu button{
    display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:none;padding:9px 12px;font-size:12.5px;border-radius:0;
  }
  .dropdown-menu button:hover{background:var(--paper);}

  /* ===== TOOLBAR ===== */
  .toolbar{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tool-group{display:flex;gap:4px;padding:0 10px;border-right:1px solid var(--line);}
  .tool-group:last-child{border-right:none;}
  .tbtn{
    display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);
    color:var(--ink);padding:6px 10px;border-radius:3px;font-size:10px;font-family:var(--font-mono);min-width:56px;
  }
  .tbtn svg{width:18px;height:18px;}
  .tbtn:hover{border-color:var(--steel);}
  .tbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tbtn:disabled{opacity:.35;cursor:default;}
  .sel-info{font-family:var(--font-mono);font-size:11px;color:var(--ink);background:var(--paper);padding:6px 10px;border-radius:3px;border:1px solid var(--line);}

  /* ===== CANVAS AREA ===== */
  .canvas-wrap{position:relative;overflow:auto;background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, #E4E7E0 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, #E4E7E0 28px), var(--paper);
  }
  svg#board{display:block;background:transparent;cursor:default;}
  svg#board.mode-place{cursor:copy;}
  svg#board.mode-connect{cursor:crosshair;}

  .inline-editor{
    position:fixed;z-index:60;font-family:var(--font-body);font-size:13px;color:var(--ink);text-align:center;
    border:2px solid var(--amber);border-radius:4px;background:#fff;resize:none;padding:4px;outline:none;
  }

  .hint-bar{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:8px 16px;border-radius:20px;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:30;display:none;
  }
  .hint-bar.show{display:block;}

  input[type=file]{display:none;}

  .app-modal-backdrop{
    position:fixed;inset:0;background:rgba(6,46,42,.45);display:none;align-items:center;justify-content:center;z-index:100;
  }
  .app-modal-backdrop.show{display:flex;}
  .app-modal-box{background:#fff;border-radius:6px;padding:22px 24px;width:380px;max-width:90vw;box-shadow:0 12px 32px rgba(0,0,0,.25);}
  .app-modal-msg{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:18px;}
  .app-modal-actions{display:flex;justify-content:flex-end;gap:10px;}
  .app-modal-actions button{padding:8px 16px;font-size:13px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="mark">SGQ</span>
      <input class="title-input" id="diagramTitle" value="Novo Fluxo de Processo">
    </div>
    <div class="topbar-actions">
      <button class="btn-ghost" id="btnExample">Carregar exemplo</button>
      <button class="btn-ghost" id="btnNewDiagram">Novo</button>
      <button class="btn-ghost" id="btnImport">Importar</button>
      <input type="file" id="fileImport" accept="application/json">
      <div class="dropdown" id="refDropdown">
        <button class="btn-ghost" id="btnRefToggle">🖼 Imagem de referência</button>
        <div class="dropdown-menu" id="refPanel" style="min-width:260px;padding:14px;">
          <div style="font-size:12px;color:var(--ink);margin-bottom:10px;line-height:1.4;">Importe o print do fluxo antigo para desenhar por cima dele, como um guia. Ela não entra nas exportações.</div>
          <button class="btn-outline" id="btnRefImport" style="width:100%;margin-bottom:8px;background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px;">Importar imagem</button>
          <input type="file" id="fileRefImage" accept="image/*">
          <div id="refControls" style="display:none;">
            <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">Opacidade</label>
            <input type="range" id="refOpacity" min="5" max="90" value="30" style="width:100%;margin-bottom:10px;">
            <div style="display:flex;gap:6px;margin-bottom:8px;">
              <button class="btn-primary" id="btnRefLockToggle" style="flex:1;padding:6px;font-size:12px;">Mover / redimensionar</button>
              <button class="btn-ghost" id="btnRefRemove" style="flex:1;padding:6px;font-size:12px;background:#fff;color:var(--rust);border:1px solid var(--rust);">Remover</button>
            </div>
            <button class="btn-outline" id="btnRefOcr" style="width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px;">📝 Detectar textos (OCR) e criar caixas</button>
            <div style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;line-height:1.3;">Cria uma caixa com o texto encontrado em cada posição. Você ainda precisa ajustar o formato (oval/losango) e desenhar as setas.</div>
          </div>
        </div>
      </div>
      <div class="dropdown" id="exportDropdown">
        <button class="btn-ghost" id="btnExportToggle">Exportar ▾</button>
        <div class="dropdown-menu">
          <button id="expPng">Imagem PNG</button>
          <button id="expJpg">Imagem JPG</button>
          <button id="expSvg">Vetor SVG</button>
          <button id="expJson">Arquivo do fluxo (.json)</button>
          <button id="expPrint">Imprimir / PDF</button>
        </div>
      </div>
      <button class="btn-primary" id="btnSave">Salvar (.json)</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="tool-group">
      <button class="tbtn active" data-mode="select" title="Selecionar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 8-6 2-2 6-6-16z"/></svg>
        Selecionar
      </button>
      <button class="tbtn" data-mode="connect" title="Conectar duas caixas com seta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h13M13 7l5 5-5 5"/></svg>
        Conectar
      </button>
    </div>
    <div class="tool-group">
      <button class="tbtn" data-place="oval" title="Início / Fim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
        Início/Fim
      </button>
      <button class="tbtn" data-place="rect" title="Etapa do processo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="1.5"/></svg>
        Processo
      </button>
      <button class="tbtn" data-place="diamond" title="Decisão">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 9-9 9-9-9z"/></svg>
        Decisão
      </button>
      <button class="tbtn" data-place="text" title="Texto livre / nota">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v12"/></svg>
        Texto
      </button>
    </div>
    <div class="tool-group">
      <button class="tbtn" id="btnAddLane" title="Adicionar coluna (papel / responsável)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM10 4v16M16 4v16"/></svg>
        + Coluna
      </button>
    </div>
    <div class="tool-group">
      <button class="tbtn" id="btnEditText" title="Editar texto do item selecionado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L18 6l-4-4L4 16z"/></svg>
        Editar
      </button>
      <button class="tbtn" id="btnDuplicate" title="Duplicar item selecionado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="12" height="12" rx="1"/><rect x="9" y="9" width="12" height="12" rx="1"/></svg>
        Duplicar
      </button>
      <button class="tbtn" id="btnDelete" title="Excluir item selecionado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        Excluir
      </button>
    </div>
    <div class="tool-group" id="shapeTypeGroup" style="display:none;">
      <button class="tbtn" id="btnTypeOval" title="Trocar para Início/Fim (oval)" data-shapetype="oval">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
        Oval
      </button>
      <button class="tbtn" id="btnTypeRect" title="Trocar para Processo (retângulo)" data-shapetype="rect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="1.5"/></svg>
        Retângulo
      </button>
      <button class="tbtn" id="btnTypeDiamond" title="Trocar para Decisão (losango)" data-shapetype="diamond">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 9-9 9-9-9z"/></svg>
        Losango
      </button>
    </div>
    <div class="tool-group">
      <button class="tbtn" id="btnUndo" title="Desfazer (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-1"/></svg>
        Desfazer
      </button>
      <button class="tbtn" id="btnRedo" title="Refazer (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h1"/></svg>
        Refazer
      </button>
    </div>
    <div class="tool-group">
      <button class="tbtn" id="btnZoomOut" title="Diminuir zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6"/></svg>
        Zoom −
      </button>
      <button class="tbtn" id="btnZoomReset" title="Redefinir zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        100%
      </button>
      <button class="tbtn" id="btnZoomIn" title="Aumentar zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M11 8v6M8 11h6"/></svg>
        Zoom +
      </button>
    </div>
    <div class="tool-group">
      <button class="tbtn active" id="btnAutoLink" title="Ao criar uma nova caixa, liga automaticamente a partir da caixa selecionada">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 15l6-6M7 12L4.5 9.5a3 3 0 114.24-4.24L11 7.5M13 16.5l2.26 2.26a3 3 0 104.24-4.24L17 12"/></svg>
        Auto-ligar
      </button>
      <button class="tbtn active" id="btnSnap" title="Encaixar caixas na grade ao mover/redimensionar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h6v6h-6z"/></svg>
        Grade
      </button>
    </div>
    <div class="tool-group" style="border-right:none;">
      <div class="sel-info" id="selInfo">Nada selecionado</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#2F6E67"/>
        </marker>
        <marker id="arrow-sel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#00A29B"/>
        </marker>
        <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M0,0 L0,20 M0,0 L20,0" stroke="#D8E4E1" stroke-width="1"/>
        </pattern>
      </defs>
    </svg>
  </div>
</div>

<div class="hint-bar" id="hintBar"></div>

<div class="app-modal-backdrop" id="appModalBackdrop">
  <div class="app-modal-box">
    <div class="app-modal-msg" id="appModalMsg"></div>
    <div class="app-modal-actions" id="appModalActions"></div>
  </div>
</div>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const COLORS = {
  ink:'#0B4A44', steel:'#2F6E67', amber:'#00A29B', moss:'#3F7A56', rust:'#A8402E',
  laneA:'#F4F8F7', laneB:'#E8F1F0', laneHeader:'#062E2A', line:'#BFD0CD',
  ovalFill:'#E3F5F3', diamondFill:'#DFF4F2', rectFill:'#FFFFFF'
};

let diagram = null;
let mode = 'select'; // select | place-<type> | connect
let selection = null; // {type:'element'|'connector', id} — the "primary" item
let selectedIds = new Set(); // ids of elements included in a multi-selection (always includes selection.id when it's an element)
let suppressNextClick = false;
let pendingConnectFrom = null;
let autoLinkEnabled = true;
let lastCreatedId = null;
let refImage = null; // {dataUrl, x, y, w, h, opacity, unlocked}
let snapEnabled = true;
const GRID = 20;
let nodeMap = {};
let zoom = 1;
let undoStack = [], redoStack = [];
let lastSavedJson = null;
let lastTap = {key:null, time:0};
const board = document.getElementById('board');
const canvasWrap = document.getElementById('canvasWrap');
const VBW = 1500, VBH = 1200;

function snap(v){ return snapEnabled ? Math.round(v/GRID)*GRID : v; }
function isDoubleTap(key){
  const now = Date.now();
  const wasDouble = (lastTap.key===key) && (now-lastTap.time < 400);
  lastTap = {key, time: wasDouble ? 0 : now};
  return wasDouble;
}
function markSaved(){ lastSavedJson = JSON.stringify(diagram); }

function blankDiagram(){
  return {
    lanes: [ {id:'l'+Date.now(), title:'RESPONSÁVEL', width:1400} ],
    elements: [],
    connectors: []
  };
}

function uid(p){ return p+Math.random().toString(36).slice(2,8); }

/* ---------- history ---------- */
function snapshot(){
  undoStack.push(JSON.stringify(diagram));
  if(undoStack.length>60) undoStack.shift();
  redoStack = [];
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(diagram));
  diagram = JSON.parse(undoStack.pop());
  selection = null; selectedIds = new Set();
  render();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(diagram));
  diagram = JSON.parse(redoStack.pop());
  selection = null; selectedIds = new Set();
  render();
}

/* ---------- geometry ---------- */
function laneX(index){
  let x = 30;
  for(let i=0;i<index;i++) x += diagram.lanes[i].width;
  return x;
}
function totalLaneWidth(){ return diagram.lanes.reduce((a,l)=>a+l.width,0)+60; }

function boundaryPoint(shape, dx, dy){
  const cx = shape.x+shape.w/2, cy = shape.y+shape.h/2;
  if(dx===0 && dy===0) return {x:cx,y:cy};
  let t;
  if(shape.type==='oval'){
    const rx=shape.w/2, ry=shape.h/2;
    t = 1/Math.sqrt((dx/rx)*(dx/rx)+(dy/ry)*(dy/ry));
  } else if(shape.type==='diamond'){
    const hw=shape.w/2, hh=shape.h/2;
    t = 1/((Math.abs(dx)/hw)+(Math.abs(dy)/hh));
  } else {
    const hw=shape.w/2, hh=shape.h/2;
    const tx = dx!==0 ? hw/Math.abs(dx) : Infinity;
    const ty = dy!==0 ? hh/Math.abs(dy) : Infinity;
    t = Math.min(tx,ty);
  }
  return {x:cx+dx*t, y:cy+dy*t};
}

function getElement(id){ return diagram.elements.find(e=>e.id===id); }
function getConnector(id){ return diagram.connectors.find(c=>c.id===id); }

function orthogonalPath(from, to){
  const sx=from.x+from.w/2, sy=from.y+from.h/2;
  const tx=to.x+to.w/2, ty=to.y+to.h/2;
  const dx = tx-sx, dy = ty-sy;
  const ALIGN_TOL = 24;
  let exit, entry, mid1, mid2;
  if(Math.abs(dy) >= Math.abs(dx)){
    const dir = dy>=0 ? 1 : -1;
    exit = boundaryPoint(from, 0, dir);
    entry = boundaryPoint(to, 0, -dir);
    if(Math.abs(exit.x-entry.x) < ALIGN_TOL) entry.x = exit.x;
    const midY = (exit.y+entry.y)/2;
    mid1 = {x:exit.x, y:midY};
    mid2 = {x:entry.x, y:midY};
  } else {
    const dir = dx>=0 ? 1 : -1;
    exit = boundaryPoint(from, dir, 0);
    entry = boundaryPoint(to, -dir, 0);
    if(Math.abs(exit.y-entry.y) < ALIGN_TOL) entry.y = exit.y;
    const midX = (exit.x+entry.x)/2;
    mid1 = {x:midX, y:exit.y};
    mid2 = {x:midX, y:entry.y};
  }
  return [exit, mid1, mid2, entry];
}

/* ---------- coordinate helpers (mouse + touch) ---------- */
function clientXY(evt){
  if(evt.touches && evt.touches.length) return {clientX:evt.touches[0].clientX, clientY:evt.touches[0].clientY};
  if(evt.changedTouches && evt.changedTouches.length) return {clientX:evt.changedTouches[0].clientX, clientY:evt.changedTouches[0].clientY};
  return {clientX:evt.clientX, clientY:evt.clientY};
}
function toSvgPoint(evt){
  const c = clientXY(evt);
  const pt = board.createSVGPoint();
  pt.x = c.clientX; pt.y = c.clientY;
  return pt.matrixTransform(board.getScreenCTM().inverse());
}
function svgToScreen(x,y){
  const pt = board.createSVGPoint();
  pt.x=x; pt.y=y;
  return pt.matrixTransform(board.getScreenCTM());
}
function bindDragStart(el, handler){
  el.addEventListener('mousedown', handler);
  el.addEventListener('touchstart', (e)=>{ if(e.cancelable) e.preventDefault(); handler(e); }, {passive:false});
}
function bindMove(handler){
  window.addEventListener('mousemove', handler);
  window.addEventListener('touchmove', handler, {passive:false});
}
function unbindMove(handler){
  window.removeEventListener('mousemove', handler);
  window.removeEventListener('touchmove', handler);
}
function bindUp(handler){
  window.addEventListener('mouseup', handler);
  window.addEventListener('touchend', handler);
  window.addEventListener('touchcancel', handler);
}
function unbindUp(handler){
  window.removeEventListener('mouseup', handler);
  window.removeEventListener('touchend', handler);
  window.removeEventListener('touchcancel', handler);
}

/* ---------- SVG element factory ---------- */
function el(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function wrapText(text, maxCharsPerLine){
  const words = (text||'').split(/\s+/);
  const lines = []; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length > maxCharsPerLine && cur){ lines.push(cur.trim()); cur=w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur);
  return lines;
}

/* ---------- render ---------- */
function reportRuntimeError(err){
  console.error('Erro interno:', err);
}
function render(){
  try{
    while(board.childNodes.length>1) board.removeChild(board.lastChild); // keep defs
    nodeMap = {};

    const w = Math.max(VBW, totalLaneWidth()+40);
    let maxY = VBH;
    diagram.elements.forEach(e=>{ maxY = Math.max(maxY, e.y+e.h+80); });
    board.setAttribute('viewBox', `0 0 ${w} ${maxY}`);
    board.style.width = (w*zoom)+'px';
    board.style.height = (maxY*zoom)+'px';

    renderGrid(w, maxY);
    renderLanes();
    renderRefImage();
    renderConnectors();
    renderElements();
    updateSelInfo();
    board.className = mode.startsWith('place') ? 'mode-place' : mode==='connect' ? 'mode-connect' : '';
    document.querySelectorAll('.tbtn[data-mode]').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
    document.querySelectorAll('.tbtn[data-place]').forEach(b=>b.classList.toggle('active', mode==='place-'+b.dataset.place));
  }catch(err){
    reportRuntimeError(err);
  }
}

function renderRefImage(){
  if(!refImage) return;
  const img = el('image', {
    id:'refImageNode', x:refImage.x, y:refImage.y, width:refImage.w, height:refImage.h,
    href:refImage.dataUrl, opacity:refImage.opacity, preserveAspectRatio:'none'
  });
  img.setAttributeNS('http://www.w3.org/1999/xlink','href', refImage.dataUrl);
  board.appendChild(img);
  if(refImage.unlocked){
    const border = el('rect', {x:refImage.x, y:refImage.y, width:refImage.w, height:refImage.h, fill:'none', stroke:COLORS.amber, 'stroke-width':2, 'stroke-dasharray':'8,5'});
    board.appendChild(border);
    bindDragStart(img, startRefDrag);
    bindDragStart(border, startRefDrag);
    const handle = el('rect', {x:refImage.x+refImage.w-10, y:refImage.y+refImage.h-10, width:18, height:18, fill:COLORS.amber, stroke:'#fff', 'stroke-width':1.5, style:'cursor:nwse-resize; touch-action:none;'});
    bindDragStart(handle, startRefResize);
    board.appendChild(handle);
  } else {
    img.setAttribute('style','pointer-events:none;');
  }
}

function startRefDrag(ev){
  ev.stopPropagation();
  const start = toSvgPoint(ev);
  const x0 = refImage.x, y0 = refImage.y;
  function move(e2){
    const p = toSvgPoint(e2);
    refImage.x = x0 + (p.x-start.x);
    refImage.y = y0 + (p.y-start.y);
    render();
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}
function startRefResize(ev){
  ev.stopPropagation();
  const start = toSvgPoint(ev);
  const w0=refImage.w, h0=refImage.h;
  function move(e2){
    const p = toSvgPoint(e2);
    refImage.w = Math.max(60, w0+(p.x-start.x));
    refImage.h = Math.max(60, h0+(p.y-start.y));
    render();
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}

function renderGrid(w, maxY){
  if(!snapEnabled) return;
  board.appendChild(el('rect', {id:'gridBgNode', x:0, y:0, width:w, height:maxY, fill:'url(#gridPattern)', style:'pointer-events:none;'}));
}

function renderLanes(){
  let x = 30;

  diagram.lanes.forEach((lane, i)=>{
    const g = el('g', {});
    const bg = el('rect', {x, y:20, width:lane.width, height:maxY-40, fill: i%2? COLORS.laneB : COLORS.laneA, stroke:COLORS.line, class:'lane-bg'});

    const header = el('rect', {x, y:20, width:lane.width, height:46, fill:COLORS.laneHeader, class:'lane-bg', style:'cursor:text;'});
    header.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); editLaneTitle(lane); });
    header.addEventListener('mousedown', (ev)=>{ if(isDoubleTap('lane:'+lane.id)){ ev.stopPropagation(); editLaneTitle(lane); } });
    header.addEventListener('touchstart', (ev)=>{ if(isDoubleTap('lane:'+lane.id)){ ev.stopPropagation(); editLaneTitle(lane); } });
    g.appendChild(header);
    const label = el('text', {x:x+lane.width/2, y:48, 'text-anchor':'middle', fill:'#fff', 'font-family':"'IBM Plex Sans Condensed', sans-serif", 'font-weight':'700', 'font-size':'14', style:'letter-spacing:.03em; cursor:text; pointer-events:none;'});
    label.textContent = lane.title;
    g.appendChild(label);

    const editX = diagram.lanes.length>1 ? x+lane.width-34 : x+lane.width-16;
    const editIcon = el('text', {x:editX, y:34, 'text-anchor':'middle', fill:'#E7ECF1', 'font-family':'IBM Plex Mono, monospace', 'font-size':'13', style:'cursor:pointer;', class:'lane-ui-control'});
    editIcon.textContent = '✏';
    editIcon.addEventListener('click', (ev)=>{ ev.stopPropagation(); editLaneTitle(lane); });
    g.appendChild(editIcon);

    if(diagram.lanes.length>1){
      const rm = el('text', {x:x+lane.width-14, y:34, 'text-anchor':'middle', fill:'#E7ECF1', 'font-family':'IBM Plex Mono, monospace', 'font-size':'13', style:'cursor:pointer;', class:'lane-ui-control'});
      rm.textContent = '✕';
      rm.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        showConfirm('Remover a coluna "'+lane.title+'"?', ()=>{
          snapshot();
          diagram.lanes = diagram.lanes.filter(l=>l.id!==lane.id);
          render();
        });
      });
      g.appendChild(rm);
    }

    const handle = el('rect', {x:x+lane.width-5, y:20, width:10, height:maxY-40, fill:'transparent', style:'cursor:col-resize; touch-action:none;'});
    bindDragStart(handle, (ev)=>startLaneResize(ev, lane));
    g.appendChild(handle);
    const grip = el('rect', {x:x+lane.width-2, y:20, width:2, height:46, fill:'rgba(255,255,255,.35)', style:'pointer-events:none;', class:'lane-ui-control'});
    g.appendChild(grip);

    board.appendChild(g);
    x += lane.width;
  });
}

function startLaneResize(ev, lane){
  ev.stopPropagation();
  snapshot();
  const startX = toSvgPoint(ev).x;
  const w0 = lane.width;
  function move(e2){
    try{
      const p = toSvgPoint(e2);
      lane.width = Math.max(140, w0 + (p.x-startX));
      render();
    }catch(err){ reportRuntimeError(err); }
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}

function renderConnectors(){
  diagram.connectors.forEach(c=>{
    const from = getElement(c.from), to = getElement(c.to);
    if(!from || !to) return;
    const pts = orthogonalPath(from, to);
    const ptStr = pts.map(p=>p.x+','+p.y).join(' ');
    const isSel = selection && selection.type==='connector' && selection.id===c.id;

    const hit = el('polyline', {points:ptStr, fill:'none', stroke:'transparent', 'stroke-width':16, style:'cursor:pointer; touch-action:none;'});
    const connClick = (ev)=>{
      ev.stopPropagation();
      if(mode!=='select') return;
      if(isDoubleTap('c:'+c.id)){ editConnectorLabel(c); return; }
      selection={type:'connector', id:c.id}; selectedIds = new Set(); render();
    };
    hit.addEventListener('mousedown', connClick);
    hit.addEventListener('touchstart', connClick);
    hit.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); editConnectorLabel(c); });
    board.appendChild(hit);

    const line = el('polyline', {points:ptStr, fill:'none', stroke:isSel?COLORS.amber:COLORS.steel, 'stroke-width':isSel?2.6:1.8, 'stroke-linejoin':'round', 'marker-end':isSel?'url(#arrow-sel)':'url(#arrow)'});
    board.appendChild(line);

    if(c.label){
      const p1=pts[1], p2=pts[2];
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      const padW = Math.max(30, c.label.length*7+12);
      board.appendChild(el('rect', {x:mx-padW/2, y:my-11, width:padW, height:22, fill:'#fff', stroke:COLORS.line, rx:3}));
      const t = el('text', {x:mx, y:my+4, 'text-anchor':'middle', 'font-family':'IBM Plex Mono, monospace', 'font-size':'11', 'font-weight':'600',
        fill: c.label.toUpperCase()==='SIM' ? COLORS.moss : c.label.toUpperCase()==='NÃO'||c.label.toUpperCase()==='NAO' ? COLORS.rust : COLORS.ink});
      t.textContent = c.label;
      board.appendChild(t);
    }
  });
}

function renderElements(){
  diagram.elements.forEach(shape=>{
    const g = el('g', {});
    const isSel = selectedIds.has(shape.id);
    const isPendingSource = pendingConnectFrom===shape.id;
    const strokeColor = isPendingSource ? COLORS.amber : isSel ? COLORS.amber : COLORS.ink;
    const strokeW = isPendingSource ? 3 : isSel ? 2.6 : 1.6;
    const dash = isPendingSource ? '6,3' : null;

    let shapeNode;
    if(shape.type==='oval'){
      shapeNode = el('ellipse', {cx:shape.x+shape.w/2, cy:shape.y+shape.h/2, rx:shape.w/2, ry:shape.h/2, fill:COLORS.ovalFill, stroke:strokeColor, 'stroke-width':strokeW});
    } else if(shape.type==='diamond'){
      const {x,y,w,h} = shape;
      const pts = `${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`;
      shapeNode = el('polygon', {points:pts, fill:COLORS.diamondFill, stroke:strokeColor, 'stroke-width':strokeW});
    } else if(shape.type==='text'){
      shapeNode = el('rect', {x:shape.x, y:shape.y, width:shape.w, height:shape.h, fill:'transparent', stroke: (isSel||isPendingSource) ? COLORS.amber : 'transparent', 'stroke-dasharray':'4,3', 'stroke-width':strokeW});
    } else {
      shapeNode = el('rect', {x:shape.x, y:shape.y, width:shape.w, height:shape.h, rx:3, fill:COLORS.rectFill, stroke:strokeColor, 'stroke-width':strokeW});
    }
    if(dash) shapeNode.setAttribute('stroke-dasharray', dash);
    g.appendChild(shapeNode);

    const lines = wrapText(shape.text, shape.type==='diamond'?22:26);
    const lineH = 15;
    const startY = shape.y+shape.h/2 - (lines.length-1)*lineH/2 + 4;
    lines.forEach((ln,i)=>{
      const t = el('text', {x:shape.x+shape.w/2, y:startY+i*lineH, 'text-anchor':'middle', 'font-family':'IBM Plex Sans, sans-serif', 'font-size':'12.5', 'font-weight': shape.type==='text'?'600':'500', fill:COLORS.ink});
      t.textContent = ln;
      g.appendChild(t);
    });

    g.style.cursor='pointer';
    g.style.touchAction='none';
    bindDragStart(g, (ev)=>onShapeMouseDown(ev, shape));
    g.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); openShapeEditor(shape); });
    board.appendChild(g);
    nodeMap[shape.id] = g;

    if(isSel && mode==='select' && selectedIds.size===1){
      const handle = el('rect', {x:shape.x+shape.w-8, y:shape.y+shape.h-8, width:14, height:14, fill:COLORS.amber, stroke:'#fff', 'stroke-width':1.5, style:'cursor:nwse-resize; touch-action:none;'});
      bindDragStart(handle, (ev)=>startResize(ev, shape));
      board.appendChild(handle);
    }
  });
}

/* ---------- interactions ---------- */
function onShapeMouseDown(ev, shape){
 try{
  ev.stopPropagation();
  if(mode==='connect'){
    if(!pendingConnectFrom){
      pendingConnectFrom = shape.id;
      showHint('Origem selecionada. Agora clique na caixa de destino da seta (Esc para cancelar).');
      render();
    } else if(pendingConnectFrom!==shape.id){
      snapshot();
      diagram.connectors.push({id:uid('c'), from:pendingConnectFrom, to:shape.id, label:''});
      pendingConnectFrom = null; mode='select'; hideHint();
      render();
    } else {
      showHint('Escolha uma caixa diferente da origem, ou pressione Esc para cancelar.');
    }
    return;
  }
  if(isDoubleTap('el:'+shape.id)){
    selection = {type:'element', id:shape.id};
    selectedIds = new Set([shape.id]);
    lastCreatedId = shape.id;
    render();
    openShapeEditor(shape);
    return;
  }

  if(ev.shiftKey){
    if(selectedIds.has(shape.id)){
      selectedIds.delete(shape.id);
      selection = selectedIds.size ? {type:'element', id:[...selectedIds][selectedIds.size-1]} : null;
    } else {
      selectedIds.add(shape.id);
      selection = {type:'element', id:shape.id};
    }
    lastCreatedId = shape.id;
    render();
    return;
  }

  if(!selectedIds.has(shape.id)){
    selectedIds = new Set([shape.id]);
  }
  selection = {type:'element', id:shape.id};
  lastCreatedId = shape.id;
  render();
  snapshot();
  const groupIds = [...selectedIds];
  const startPos = {};
  groupIds.forEach(id=>{ const s = getElement(id); if(s) startPos[id] = {x:s.x, y:s.y}; });
  const start = toSvgPoint(ev);
  function move(e2){
    try{
      const p = toSvgPoint(e2);
      const dx = p.x-start.x, dy = p.y-start.y;
      groupIds.forEach(id=>{
        const s = getElement(id);
        if(s && startPos[id]){ s.x = snap(startPos[id].x+dx); s.y = snap(startPos[id].y+dy); }
      });
      render();
    }catch(err){ reportRuntimeError(err); }
  }
  function up(){
    unbindMove(move);
    unbindUp(up);
    const moved = groupIds.some(id=>{ const s=getElement(id); return s && startPos[id] && (s.x!==startPos[id].x || s.y!==startPos[id].y); });
    if(!moved) undoStack.pop(); // no actual move, drop useless snapshot
  }
  bindMove(move);
  bindUp(up);
 }catch(err){ reportRuntimeError(err); }
}

function startResize(ev, shape){
  ev.stopPropagation();
  snapshot();
  const start = toSvgPoint(ev);
  const w0=shape.w, h0=shape.h;
  function move(e2){
    try{
      const p = toSvgPoint(e2);
      shape.w = snap(Math.max(70, w0+(p.x-start.x)));
      shape.h = snap(Math.max(36, h0+(p.y-start.y)));
      render();
    }catch(err){ reportRuntimeError(err); }
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}

function drawMarquee(x,y,w,h){
  let rect = document.getElementById('marqueeRect');
  if(!rect){
    rect = el('rect', {id:'marqueeRect', fill:'rgba(0,162,155,.12)', stroke:COLORS.amber, 'stroke-width':1.5, 'stroke-dasharray':'5,3'});
    board.appendChild(rect);
  }
  rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',w); rect.setAttribute('height',h);
}
function removeMarquee(){
  const rect = document.getElementById('marqueeRect');
  if(rect) rect.remove();
}

function boardPointerDown(ev){
  const isEmptyArea = ev.target===board || (ev.target.classList && ev.target.classList.contains('lane-bg'));
  if(!isEmptyArea || mode!=='select') return;
  const marqueeStart = toSvgPoint(ev);
  const c0 = clientXY(ev);
  let dragged = false;
  function move(e2){
    const p2 = toSvgPoint(e2);
    const c2 = clientXY(e2);
    if(!dragged && (Math.abs(c2.clientX-c0.clientX)>4 || Math.abs(c2.clientY-c0.clientY)>4)) dragged = true;
    if(!dragged) return;
    const x = Math.min(marqueeStart.x, p2.x), y = Math.min(marqueeStart.y, p2.y);
    drawMarquee(x, y, Math.abs(p2.x-marqueeStart.x), Math.abs(p2.y-marqueeStart.y));
  }
  function up(e2){
    unbindMove(move); unbindUp(up);
    removeMarquee();
    if(dragged){
      const p2 = toSvgPoint(e2);
      const rx1=Math.min(marqueeStart.x,p2.x), ry1=Math.min(marqueeStart.y,p2.y);
      const rx2=Math.max(marqueeStart.x,p2.x), ry2=Math.max(marqueeStart.y,p2.y);
      const hit = diagram.elements.filter(el2 => el2.x < rx2 && el2.x+el2.w > rx1 && el2.y < ry2 && el2.y+el2.h > ry1).map(el2=>el2.id);
      if(hit.length){
        if(ev.shiftKey){ hit.forEach(id=>selectedIds.add(id)); } else { selectedIds = new Set(hit); }
        selection = {type:'element', id: hit[hit.length-1]};
      } else if(!ev.shiftKey){
        selectedIds = new Set(); selection = null;
      }
      suppressNextClick = true;
      render();
    }
  }
  bindMove(move);
  bindUp(up);
}
board.addEventListener('mousedown', boardPointerDown);
board.addEventListener('touchstart', (e)=>{ if(e.target===board || (e.target.classList && e.target.classList.contains('lane-bg'))){ if(e.cancelable) e.preventDefault(); } boardPointerDown(e); }, {passive:false});

board.addEventListener('click', (ev)=>{
  if(suppressNextClick){ suppressNextClick=false; return; }
  const isEmptyArea = ev.target===board || (ev.target.classList && ev.target.classList.contains('lane-bg'));
  if(!isEmptyArea) return;
  if(mode.startsWith('place-')){
    const type = mode.slice(6);
    const p = toSvgPoint(ev);
    const defaults = {
      oval:{w:180,h:64}, rect:{w:200,h:64}, diamond:{w:200,h:100}, text:{w:160,h:30}
    };
    const d = defaults[type];
    const linkFromId = (autoLinkEnabled && lastCreatedId && getElement(lastCreatedId)) ? lastCreatedId : null;
    snapshot();
    const shape = {id:uid('e'), type, x:snap(p.x-d.w/2), y:snap(p.y-d.h/2), w:d.w, h:d.h, text: type==='text' ? 'Texto' : 'Nova etapa'};
    diagram.elements.push(shape);
    if(linkFromId){
      diagram.connectors.push({id:uid('c'), from:linkFromId, to:shape.id, label:''});
    }
    mode='select';
    selection = {type:'element', id:shape.id};
    selectedIds = new Set([shape.id]);
    lastCreatedId = shape.id;

    if(type==='diamond'){
      const simBox = {id:uid('e'), type:'rect', x: snap(shape.x + shape.w + 90), y: snap(shape.y + shape.h/2 - 32), w:190, h:64, text:'Nova etapa'};
      const naoBox = {id:uid('e'), type:'rect', x: snap(shape.x + shape.w/2 - 100), y: snap(shape.y + shape.h + 90), w:200, h:64, text:'Nova etapa'};
      diagram.elements.push(simBox, naoBox);
      diagram.connectors.push({id:uid('c'), from:shape.id, to:simBox.id, label:'SIM'});
      diagram.connectors.push({id:uid('c'), from:shape.id, to:naoBox.id, label:'NÃO'});
      selection = {type:'element', id:naoBox.id};
      selectedIds = new Set([naoBox.id]);
      lastCreatedId = naoBox.id;
      showHint('Decisão criada com os ramos SIM e NÃO. Dê duplo clique em cada caixa para escrever o texto.');
    } else {
      showHint('Caixa criada. Dê duplo clique (ou duplo toque) nela para escrever o texto.');
    }
    render();
    setTimeout(hideHint, 3500);
  } else if(mode==='connect'){
    pendingConnectFrom = null; mode='select'; hideHint(); render();
  } else {
    selection = null; selectedIds = new Set(); render();
  }
});

/* ---------- text editors ---------- */
function openShapeEditor(shape){
  const node = nodeMap[shape.id];
  if(!node) return;
  const rect = node.getBoundingClientRect();
  openInlineEditor(rect, shape.text, (val)=>{ shape.text = val; render(); });
}
function editLaneTitle(lane){
  // approximate header rect via current viewBox scale
  const x = laneX(diagram.lanes.indexOf(lane));
  const p1 = svgToScreen(x, 20), p2 = svgToScreen(x+lane.width, 66);
  openInlineEditor({left:p1.x, top:p1.y, width:p2.x-p1.x, height:p2.y-p1.y}, lane.title, (val)=>{ lane.title = val || 'RESPONSÁVEL'; render(); }, true);
}
function editConnectorLabel(c){
  const from=getElement(c.from), to=getElement(c.to);
  const pts = orthogonalPath(from, to);
  const mx=(pts[1].x+pts[2].x)/2, my=(pts[1].y+pts[2].y)/2;
  const p = svgToScreen(mx,my);
  snapshot();
  openInlineEditor({left:p.x-60, top:p.y-14, width:120, height:28}, c.label, (val)=>{ c.label = val; render(); });
}
function openInlineEditor(rect, value, onCommit, dark){
  const existing = document.querySelector('.inline-editor');
  if(existing) existing.remove();
  const ta = document.createElement('textarea');
  ta.className='inline-editor';
  ta.value = value||'';
  ta.style.left = rect.left+'px';
  ta.style.top = rect.top+'px';
  ta.style.width = Math.max(60,rect.width)+'px';
  ta.style.height = Math.max(24,rect.height)+'px';
  if(dark){ ta.style.background='#062E2A'; ta.style.color='#fff'; ta.style.fontWeight='700'; }
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let done=false;
  function commit(){
    if(done) return; done=true;
    onCommit(ta.value.trim());
    ta.remove();
  }
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ta.blur(); }
    if(e.key==='Escape'){ done=true; ta.remove(); }
  });
}

document.getElementById('btnDuplicate').addEventListener('click', ()=>{
  if(selectedIds.size===0) return;
  snapshot();
  const idMap = {};
  const newIds = [];
  selectedIds.forEach(id=>{
    const s = getElement(id);
    if(!s) return;
    const copy = Object.assign({}, s, {id:uid('e'), x:s.x+24, y:s.y+24});
    diagram.elements.push(copy);
    idMap[id] = copy.id;
    newIds.push(copy.id);
  });
  // duplicate connectors that go between two duplicated shapes, so the copy keeps its internal links
  diagram.connectors.forEach(c=>{
    if(idMap[c.from] && idMap[c.to]){
      diagram.connectors.push({id:uid('c'), from:idMap[c.from], to:idMap[c.to], label:c.label});
    }
  });
  selectedIds = new Set(newIds);
  selection = newIds.length ? {type:'element', id:newIds[newIds.length-1]} : null;
  render();
});
document.getElementById('btnDelete').addEventListener('click', deleteSelection);
function deleteSelection(){
  if(selectedIds.size>0){
    snapshot();
    diagram.elements = diagram.elements.filter(e=>!selectedIds.has(e.id));
    diagram.connectors = diagram.connectors.filter(c=>!selectedIds.has(c.from) && !selectedIds.has(c.to));
    if(selectedIds.has(lastCreatedId)) lastCreatedId = null;
    selectedIds = new Set();
    selection = null;
    render();
    return;
  }
  if(!selection) return;
  snapshot();
  if(selection.type==='element'){
    diagram.elements = diagram.elements.filter(e=>e.id!==selection.id);
    diagram.connectors = diagram.connectors.filter(c=>c.from!==selection.id && c.to!==selection.id);
    if(lastCreatedId===selection.id) lastCreatedId = null;
  } else {
    diagram.connectors = diagram.connectors.filter(c=>c.id!==selection.id);
  }
  selection = null;
  render();
}

window.addEventListener('keydown', (e)=>{
  const tag = document.activeElement.tagName;
  if(tag==='TEXTAREA' || tag==='INPUT') return;
  if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSelection(); }
  if(e.key==='Escape'){ mode='select'; pendingConnectFrom=null; hideHint(); render(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); redo(); }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    if(selectedIds.size===0) return;
    e.preventDefault();
    const step = (snapEnabled ? GRID : 1) * (e.shiftKey ? 5 : 1);
    if(!e.repeat) snapshot();
    let dx=0, dy=0;
    if(e.key==='ArrowUp') dy=-step;
    if(e.key==='ArrowDown') dy=step;
    if(e.key==='ArrowLeft') dx=-step;
    if(e.key==='ArrowRight') dx=step;
    selectedIds.forEach(id=>{
      const shape = getElement(id);
      if(shape){ shape.x += dx; shape.y += dy; }
    });
    render();
  }
});

window.addEventListener('beforeunload', (e)=>{
  if(lastSavedJson !== JSON.stringify(diagram)){
    e.preventDefault();
    e.returnValue = 'Existem alterações não salvas neste fluxo. Deseja realmente sair sem salvar?';
    return e.returnValue;
  }
});

function closeAppModal(){ document.getElementById('appModalBackdrop').classList.remove('show'); }
function showConfirm(message, onYes){
  const backdrop = document.getElementById('appModalBackdrop');
  document.getElementById('appModalMsg').textContent = message;
  const actions = document.getElementById('appModalActions');
  actions.innerHTML = '';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-outline'; cancelBtn.textContent = 'Cancelar';
  cancelBtn.style.background = '#fff'; cancelBtn.style.border = '1px solid var(--line)'; cancelBtn.style.color = 'var(--ink)';
  cancelBtn.onclick = closeAppModal;
  const okBtn = document.createElement('button');
  okBtn.className = 'btn-primary'; okBtn.textContent = 'Confirmar';
  okBtn.onclick = ()=>{ closeAppModal(); onYes(); };
  actions.appendChild(cancelBtn); actions.appendChild(okBtn);
  backdrop.classList.add('show');
}
function showAlert(message){
  const backdrop = document.getElementById('appModalBackdrop');
  document.getElementById('appModalMsg').textContent = message;
  const actions = document.getElementById('appModalActions');
  actions.innerHTML = '';
  const okBtn = document.createElement('button');

function showHint(msg){ const h=document.getElementById('hintBar'); h.textContent=msg; h.classList.add('show'); }

function updateSelInfo(){
  const box = document.getElementById('selInfo');
  const typeGroup = document.getElementById('shapeTypeGroup');
  if(selectedIds.size>1){
    box.textContent = selectedIds.size+' caixas selecionadas';
    typeGroup.style.display='none';
    return;
  }
  if(!selection){ box.textContent='Nada selecionado'; typeGroup.style.display='none'; return; }
  if(selection.type==='element'){
    const s = getElement(selection.id);
    box.textContent = (s?('Selecionado: '+(s.text||'(sem texto)').slice(0,28)):'—');
    if(s && s.type!=='text'){
      typeGroup.style.display='flex';
      document.querySelectorAll('#shapeTypeGroup .tbtn').forEach(b=>b.classList.toggle('active', b.dataset.shapetype===s.type));
    } else {
      typeGroup.style.display='none';
    }
  } else {
    const c = getConnector(selection.id);
    box.textContent = 'Seta selecionada'+(c&&c.label?' · rótulo: '+c.label:'');
    typeGroup.style.display='none';
  }
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function currentTitleSlug(){ return (document.getElementById('diagramTitle').value||'fluxo').trim().replace(/[^\w\-]+/g,'_').slice(0,60); }

function saveJson(){
  const payload = {title: document.getElementById('diagramTitle').value, diagram};
  downloadBlob(new Blob([JSON.stringify(payload,null,2)], {type:'application/json'}), currentTitleSlug()+'.json');
  markSaved();
}
document.getElementById('btnSave').addEventListener('click', saveJson);
document.getElementById('expJson').addEventListener('click', ()=>{ saveJson(); closeDropdown(); });

function stripEditorUiFromClone(clone){
  const refNode = clone.querySelector('#refImageNode');
  if(refNode) refNode.remove();
  const gridNode = clone.querySelector('#gridBgNode');
  if(gridNode) gridNode.remove();
  clone.querySelectorAll('.lane-ui-control').forEach(n=>n.remove());
}

document.getElementById('expSvg').addEventListener('click', ()=>{
  const clone = board.cloneNode(true);
  clone.setAttribute('xmlns', SVGNS);
  const size = computeExportSize();
  clone.setAttribute('viewBox', `0 0 ${size.w} ${size.h}`);
  clone.setAttribute('width', size.w); clone.setAttribute('height', size.h);
  stripEditorUiFromClone(clone);
  const xml = new XMLSerializer().serializeToString(clone);
  downloadBlob(new Blob([xml], {type:'image/svg+xml'}), currentTitleSlug()+'.svg');
  closeDropdown();
});

function computeExportSize(){
  const totalLaneW = diagram.lanes.reduce((a,l)=>a+l.width,0);
  let w = diagram.lanes.length ? 30+totalLaneW+30 : 400;
  let h = diagram.lanes.length ? 86 : 300;
  diagram.elements.forEach(e=>{
    w = Math.max(w, e.x+e.w+30);
    h = Math.max(h, e.y+e.h+40);
  });
  return {w: Math.ceil(w), h: Math.ceil(h)};
}

function exportRaster(format){
  const clone = board.cloneNode(true);
  clone.setAttribute('xmlns', SVGNS);
  const size = computeExportSize();
  clone.setAttribute('viewBox', `0 0 ${size.w} ${size.h}`);
  clone.setAttribute('width', size.w); clone.setAttribute('height', size.h);
  stripEditorUiFromClone(clone);
  if(format==='jpg'){
    const bg = document.createElementNS(SVGNS,'rect');
    bg.setAttribute('x',0); bg.setAttribute('y',0); bg.setAttribute('width',size.w); bg.setAttribute('height',size.h); bg.setAttribute('fill','#ffffff');
    clone.insertBefore(bg, clone.firstChild.nextSibling);
  }
  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = ()=>{
    const scale = 4;
    const canvas = document.createElement('canvas');
    canvas.width = size.w*scale; canvas.height = size.h*scale;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(format==='jpg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
    ctx.scale(scale,scale);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img,0,0);
    const mime = format==='jpg' ? 'image/jpeg' : 'image/png';
    const ext = format==='jpg' ? '.jpg' : '.png';
    canvas.toBlob((blob)=>{ downloadBlob(blob, currentTitleSlug()+ext); URL.revokeObjectURL(url); }, mime, 0.97);
  };
  img.src = url;
  closeDropdown();
}
document.getElementById('expPng').addEventListener('click', ()=>exportRaster('png'));
document.getElementById('expJpg').addEventListener('click', ()=>exportRaster('jpg'));

/* ---------- auto-load from URL (?carregar=) ---------- */
async function loadFromQueryParam(){
  const params = new URLSearchParams(location.search);
  const url = params.get('carregar');
  if(!url) return false;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    diagram = data.diagram || data;
    document.getElementById('diagramTitle').value = data.title || 'Fluxo carregado';
    undoStack=[]; redoStack=[]; selection=null; selectedIds=new Set(); lastCreatedId=null;
    render();
    markSaved();
    return true;
  }catch(err){
    showAlert('Não foi possível carregar o fluxo do link informado (' + url + '): ' + err.message + '. Foi aberto o exemplo padrão.');
    return false;
  }
}

loadFromQueryParam();

document.getElementById('btnRefOcr').addEventListener('click', async ()=>{
  if(!refImage){ showAlert('Importe uma imagem primeiro.'); return; }
  if(typeof Tesseract === 'undefined'){ showAlert('Não foi possível carregar o mecanismo de OCR (é preciso internet para baixá-lo na primeira vez). Verifique sua conexão e tente novamente.'); return; }
  const btn = document.getElementById('btnRefOcr');
  btn.disabled = true;
  btn.textContent = 'Lendo textos… isso pode levar até 1 minuto';
  try{
    const result = await Tesseract.recognize(refImage.dataUrl, 'por');
    const scaleX = refImage.w / refImage.naturalW;
    const scaleY = refImage.h / refImage.naturalH;
    const lines = (result.data.lines || []).filter(l => l.text && l.text.trim().length > 0);
    if(lines.length === 0){
      showAlert('Não encontrei texto legível na imagem. Tente uma imagem com resolução maior, ou crie as caixas manualmente.');
    } else {
      snapshot();
      lines.forEach(line=>{
        const b = line.bbox;
        const x = refImage.x + b.x0*scaleX;
        const y = refImage.y + b.y0*scaleY;
        const w = Math.max(120, (b.x1-b.x0)*scaleX + 30);
        const h = Math.max(50, (b.y1-b.y0)*scaleY + 20);
        diagram.elements.push({ id:uid('e'), type:'rect', x:snap(x), y:snap(y), w:snap(w), h:snap(h), text: line.text.trim() });
      });
      render();
      showHint(lines.length + ' caixa(s) criada(s) a partir do texto da imagem. Ajuste o formato de cada uma (veja os botões de formato quando seleciona uma caixa) e desenhe as setas.');
      setTimeout(hideHint, 6000);
    }
  }catch(err){
    showAlert('Erro ao ler a imagem: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '📝 Detectar textos (OCR) e criar caixas';
  }
});

document.getElementById('fileRefImage').addEventListener('change', (e)=>{

  const reader = new FileReader();
  reader.onload = (ev)=>{
    const tmpImg = new Image();
    tmpImg.onload = ()=>{
      const maxW = 900;
      const scale = tmpImg.width > maxW ? maxW/tmpImg.width : 1;
      refImage = {
        dataUrl: ev.target.result,
        x: 40, y: 320,
        w: tmpImg.width*scale, h: tmpImg.height*scale,
        naturalW: tmpImg.width, naturalH: tmpImg.height,
        opacity: 0.3, unlocked: true
      };
      document.getElementById('refControls').style.display = '';
      document.getElementById('refOpacity').value = 30;
      document.getElementById('btnRefLockToggle').textContent = 'Travar posição';
      render();
      closeDropdown();
      showHint('Imagem importada — arraste-a para posicionar, depois clique em "Imagem de referência" para travar.');
      setTimeout(hideHint, 4000);
    };
    tmpImg.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
document.getElementById('refOpacity').addEventListener('input', (e)=>{
  if(!refImage) return;
  refImage.opacity = e.target.value/100;
  render();
});
document.getElementById('btnRefLockToggle').addEventListener('click', ()=>{
  if(!refImage) return;
  refImage.unlocked = !refImage.unlocked;
  document.getElementById('btnRefLockToggle').textContent = refImage.unlocked ? 'Travar posição' : 'Mover / redimensionar';
  render();
});
document.getElementById('btnRefRemove').addEventListener('click', ()=>{
