function copySelectedFlowItems(){
  // Ctrl+C copia somente figuras selecionadas. As ligações cujas duas pontas
  // pertencem à seleção vão junto, preservando rota, rótulo, estilo e sentido.
  const ids = new Set(selectedIds);
  if(ids.size===0 && selection && selection.type==='element') ids.add(selection.id);
  if(ids.size===0) return false;

  const elements = diagram.elements.filter(e=>ids.has(e.id)).map(e=>JSON.parse(JSON.stringify(e)));
  if(!elements.length) return false;
  const connectors = diagram.connectors
    .filter(c=>ids.has(c.from) && ids.has(c.to))
    .map(c=>JSON.parse(JSON.stringify(c)));

  flowClipboard = {elements, connectors, pasteCount:0};
  showHint(`${elements.length} figura(s) copiada(s)${connectors.length?` com ${connectors.length} ligação(ões)`:''}. Use Ctrl+V para colar.`);
  setTimeout(hideHint,2200);
  return true;
}

function pasteFlowItems(){
  if(!flowClipboard || !Array.isArray(flowClipboard.elements) || !flowClipboard.elements.length) return false;
  snapshot();

  flowClipboard.pasteCount = (flowClipboard.pasteCount||0)+1;
  // Mantém a cópia visivelmente separada mesmo quando o fluxograma abre com zoom
  // automático baixo. O deslocamento equivale a ~46 px na tela por colagem.
  const offset = (46 / Math.max(0.12, zoom)) * flowClipboard.pasteCount;
  const idMap = {};
  const newIds = [];

  flowClipboard.elements.forEach(src=>{
    const copy = JSON.parse(JSON.stringify(src));
    const oldId = copy.id;
    copy.id = uid('e');
    copy.x = (+copy.x||0) + offset;
    copy.y = (+copy.y||0) + offset;
    diagram.elements.push(copy);
    idMap[oldId] = copy.id;
    newIds.push(copy.id);
  });

  let pastedLinks = 0;
  (flowClipboard.connectors||[]).forEach(src=>{
    if(!idMap[src.from] || !idMap[src.to]) return;
    const c = JSON.parse(JSON.stringify(src));
    c.id = uid('c');
    c.from = idMap[src.from];
    c.to = idMap[src.to];
    // Rotas importadas e rótulos usam coordenadas absolutas; deslocamos junto
    // com as caixas para a cópia manter exatamente o mesmo desenho e direção.
    if(Array.isArray(c.points)) c.points = c.points.map(p=>({x:(+p.x||0)+offset,y:(+p.y||0)+offset}));
    if(c.labelPos) c.labelPos = {x:(+c.labelPos.x||0)+offset,y:(+c.labelPos.y||0)+offset};
    diagram.connectors.push(c);
    pastedLinks++;
  });

  selectedIds = new Set(newIds);
  selection = newIds.length ? {type:'element', id:newIds[newIds.length-1]} : null;
  lastCreatedId = newIds.length ? newIds[newIds.length-1] : null;
  mode = 'select';
  pendingConnectFrom = null;
  render();
  showHint(`${newIds.length} figura(s) colada(s)${pastedLinks?` com ${pastedLinks} ligação(ões)`:''}.`);
  setTimeout(hideHint,1800);
  return true;
}

function deleteSelection(){
  if(selectedIds.size>0){
    snapshot();
    diagram.elements = diagram.elements.filter(e=>!selectedIds.has(e.id));
    diagram.connectors = diagram.connectors.filter(c=>!selectedIds.has(c.from) && !selectedIds.has(c.to));
    if(selectedIds.has(lastCreatedId)) lastCreatedId = null;
    selectedIds = new Set();
    selection = null;
    render();
    return;
  }
  if(!selection) return;
  snapshot();
  if(selection.type==='element'){
    diagram.elements = diagram.elements.filter(e=>e.id!==selection.id);
    diagram.connectors = diagram.connectors.filter(c=>c.from!==selection.id && c.to!==selection.id);
    if(lastCreatedId===selection.id) lastCreatedId = null;
  } else {
    diagram.connectors = diagram.connectors.filter(c=>c.id!==selection.id);
  }
  selection = null;
  render();
}

function isTextEditingTarget(target){
  const el = target && target.nodeType===1 ? target : document.activeElement;
  if(!el) return false;
  const tag=(el.tagName||'').toUpperCase();
  return tag==='TEXTAREA' || tag==='INPUT' || tag==='SELECT' || !!el.isContentEditable;
}

window.addEventListener('keydown', (e)=>{
  if(isTextEditingTarget(e.target)) return;
  if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSelection(); }
  if(e.key==='Escape'){ mode='select'; pendingConnectFrom=null; hideHint(); render(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c'){
    if(copySelectedFlowItems()){
      e.preventDefault();
      lastClipboardShortcut={type:'copy',time:Date.now()};
    }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='v'){
    if(pasteFlowItems()){
      e.preventDefault();
      lastClipboardShortcut={type:'paste',time:Date.now()};
    }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); redo(); }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    if(selectedIds.size===0) return;
    e.preventDefault();
    const step = (snapEnabled ? GRID : 1) * (e.shiftKey ? 5 : 1);
    if(!e.repeat) snapshot();
    let dx=0, dy=0;
    if(e.key==='ArrowUp') dy=-step;
    if(e.key==='ArrowDown') dy=step;
    if(e.key==='ArrowLeft') dx=-step;
    if(e.key==='ArrowRight') dx=step;
    const startPos={};
    selectedIds.forEach(id=>{ const shape=getElement(id); if(shape) startPos[id]={x:shape.x,y:shape.y}; });
    selectedIds.forEach(id=>{
      const shape = getElement(id);
      if(shape){ shape.x += dx; shape.y += dy; }
    });
    rerouteConnectorsAfterShapeMove([...selectedIds],startPos);
    render();
  }
}, true);

// Fallback para navegadores/ambientes que tratam Ctrl+C/Ctrl+V pelo evento de
// clipboard antes/depois do keydown. Usa a mesma área interna do fluxograma.
document.addEventListener('copy', (e)=>{
  if(isTextEditingTarget(e.target)) return;
  if(lastClipboardShortcut.type==='copy' && Date.now()-lastClipboardShortcut.time<120) return;
  if(copySelectedFlowItems()){
    e.preventDefault();
    try{ if(e.clipboardData) e.clipboardData.setData('text/plain','SGQ_FLOW_SELECTION'); }catch(_){}
    lastClipboardShortcut={type:'copy',time:Date.now()};
  }
}, true);
document.addEventListener('paste', (e)=>{
  if(isTextEditingTarget(e.target)) return;
  if(lastClipboardShortcut.type==='paste' && Date.now()-lastClipboardShortcut.time<120) return;
  if(pasteFlowItems()){
    e.preventDefault();
    lastClipboardShortcut={type:'paste',time:Date.now()};
  }
}, true);

window.addEventListener('beforeunload', (e)=>{
  if(!window.__sgqSkipUnloadPrompt && lastSavedJson !== JSON.stringify(diagram)){
    e.preventDefault();
    e.returnValue = 'Existem alterações não salvas neste fluxo. Deseja realmente sair sem salvar?';
    return e.returnValue;
  }
});

function updateSelInfo(){
  const box = document.getElementById('selInfo');
  const typeGroup = document.getElementById('shapeTypeGroup');
  if(selectedIds.size>1){
    box.textContent = selectedIds.size+' caixas selecionadas';
    typeGroup.style.display='none';
    return;
  }
  if(!selection){ box.textContent='Nada selecionado'; typeGroup.style.display='none'; return; }
  if(selection.type==='element'){
    const s = getElement(selection.id);
    box.textContent = (s?('Selecionado: '+(s.text||'(sem texto)').slice(0,28)):'—');
    if(s && s.type!=='text'){
      typeGroup.style.display='flex';
      document.querySelectorAll('#shapeTypeGroup .tbtn').forEach(b=>b.classList.toggle('active', b.dataset.shapetype===s.type));
    } else {
      typeGroup.style.display='none';
    }
  } else {
    const c = getConnector(selection.id);
    box.textContent = 'Seta selecionada'+(c&&c.label?' · rótulo: '+c.label+' (arraste o rótulo para mover)':'');
    typeGroup.style.display='none';
  }
}


function activeWordFlow(){
  if(!wordDocumentState || wordDocumentState.activeIndex<0) return null;
  return wordDocumentState.flows[wordDocumentState.activeIndex]||null;
}
function isDiagramDirty(){
  return !!(diagram && lastSavedJson!==null && JSON.stringify(diagram)!==lastSavedJson);
}
function wordModifiedCount(){
  return wordDocumentState ? wordDocumentState.flows.filter(f=>f._modified).length : 0;
}
function runtimeWordFlowKey(flow){
  if(!flow) return null;
  if(flow._saved && flow.flowId) return 'sgq:'+flow.flowId;
  const key=String(flow.key||'');
  const m=key.match(/^ole:(\d+)$/);
  if(!m || !wordDocumentState) return key;
  const idx=wordDocumentState.flows.indexOf(flow);
  if(idx<0) return key;
  // Cada SmartDraw já salvo deixa de existir como OLE. Portanto o ordinal atual
  // é a quantidade de SmartDraws ainda não salvos até esta posição original.
  let ordinal=0;
  for(let i=0;i<=idx;i++){
    const f=wordDocumentState.flows[i];
    if(/^ole:\d+$/.test(String(f.key||'')) && !f._saved) ordinal++;
  }
  return 'ole:'+Math.max(1,ordinal);
}
function refreshWordUi(){
  const btn=document.getElementById('btnSave'), badge=document.getElementById('wordContextBadge');
  const flowsBtn=document.getElementById('btnWordFlows'), exportBtn=document.getElementById('btnExportWord');
  if(currentWordContext && wordDocumentState){
    const flow=activeWordFlow();
    const total=wordDocumentState.flows.length;
    const pos=Math.max(1,wordDocumentState.activeIndex+1);
    btn.textContent='Salvar fluxo';
    btn.title='Salva somente este fluxograma na cópia de trabalho do Word.';
    flowsBtn.style.display=''; exportBtn.style.display='';
    flowsBtn.textContent=`Fluxogramas ${pos}/${total}`;
    exportBtn.textContent=wordModifiedCount()?`Exportar Word (${wordModifiedCount()} alterado${wordModifiedCount()>1?'s':''})`:'Exportar Word';
    badge.style.display='';
    badge.textContent=(currentWordContext.fileName||'Word')+(flow&&flow._modified?' · fluxo salvo':'');
  }else{
    btn.textContent='Salvar (.json)'; btn.title='';
    flowsBtn.style.display='none'; exportBtn.style.display='none';
    badge.style.display='none'; badge.textContent='';
  }
}
function setWordContext(ctx){
  currentWordContext = ctx || null;
  refreshWordUi();
}
function resetWordDocumentState(){
  wordDocumentState=null;
  currentWordContext=null;
  refreshWordUi();
}
function chooseWordFlow(flows, options={}){
  if(!flows || !flows.length) return Promise.reject(new Error('Nenhum fluxograma encontrado.'));
  if(flows.length===1 && !options.forceList) return Promise.resolve(flows[0]);
  return new Promise((resolve,reject)=>{
    const backdrop=document.getElementById('appModalBackdrop');
    const msg=document.getElementById('appModalMsg');
    const actions=document.getElementById('appModalActions');
    msg.innerHTML='';
    const title=document.createElement('div');
    title.style.fontWeight='700'; title.style.fontSize='15px'; title.textContent=options.title||'Selecione o fluxograma para editar';
    const sub=document.createElement('div');
    sub.style.fontSize='12px';sub.style.marginTop='5px';sub.style.color='var(--steel)';
    sub.textContent=options.subtitle||`Foram encontrados ${flows.length} fluxogramas neste Word. Você pode salvar cada um separadamente.`;
    const list=document.createElement('div');list.className='flow-picker-list';
    flows.forEach((f,i)=>{
      const b=document.createElement('button');b.type='button';b.className='flow-picker-item';
      const left=document.createElement('div');
      const strong=document.createElement('strong'); strong.textContent=(f.title||`Fluxograma ${i+1}`).replace(/\s+/g,' ').trim();
      const status=f._modified?'Salvo nesta sessão ✓':(f._cache?'Carregado':'Não alterado');
      const meta=document.createElement('span');meta.textContent=(f.page?`Página ${f.page} · `:'')+(f.source||'SmartDraw')+` · ${status}`;
      left.appendChild(strong);left.appendChild(meta);
      const arrow=document.createElement('span');
      arrow.textContent=(wordDocumentState&&wordDocumentState.activeIndex===i)?'Atual':'Editar →';
      arrow.style.fontWeight='700';
      b.appendChild(left);b.appendChild(arrow);
      b.onclick=()=>{closeAppModal();resolve(f);};
      list.appendChild(b);
    });
    msg.appendChild(title);msg.appendChild(sub);msg.appendChild(list);
    actions.innerHTML='';
    const cancel=document.createElement('button');cancel.className='btn-outline';cancel.textContent='Fechar';
    cancel.style.background='#fff';cancel.style.border='1px solid var(--line)';cancel.style.color='var(--ink)';
    cancel.onclick=()=>{closeAppModal();reject(new Error('Seleção cancelada.'));};
    actions.appendChild(cancel);
    backdrop.classList.add('show');
  });
}

async function cropReferenceFlowImage(dataUrl){
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=dataUrl;});
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
  if(W<40||H<40)return {dataUrl,x:0,y:0,width:W,height:H,originalWidth:W,originalHeight:H,cropped:false};
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
  const px=ctx.getImageData(0,0,W,H).data,row=new Uint32Array(H),col=new Uint32Array(W);
  // Conta tinta/traço e ignora fundo branco. Amostragem completa porque os previews OLE
  // normalmente têm poucos megapixels e linhas de 1 px são importantes para retornos.
  for(let y=0,p=0;y<H;y++)for(let x=0;x<W;x++,p+=4){
    const r=px[p],g=px[p+1],b=px[p+2],lum=r*.299+g*.587+b*.114;
    const colored=Math.max(255-r,255-g,255-b)>18;
    if(lum<242||colored){row[y]++;col[x]++;}
  }
  const rMin=Math.max(2,Math.floor(W*.0015)),cMin=Math.max(2,Math.floor(H*.0015));
  let y0=0,y1=H-1,x0=0,x1=W-1;
  while(y0<H&&row[y0]<rMin)y0++;while(y1>=0&&row[y1]<rMin)y1--;
  while(x0<W&&col[x0]<cMin)x0++;while(x1>=0&&col[x1]<cMin)x1--;
  if(x1<=x0||y1<=y0)return {dataUrl,x:0,y:0,width:W,height:H,originalWidth:W,originalHeight:H,cropped:false};
  const mx=Math.max(8,Math.round((x1-x0+1)*.025)),my=Math.max(8,Math.round((y1-y0+1)*.018));
  x0=Math.max(0,x0-mx);x1=Math.min(W-1,x1+mx);y0=Math.max(0,y0-my);y1=Math.min(H-1,y1+my);
  const cw=x1-x0+1,ch=y1-y0+1;
  // Evita reamostrar quando a imagem já veio recortada corretamente.
  if(cw>W*.96&&ch>H*.96)return {dataUrl,x:0,y:0,width:W,height:H,originalWidth:W,originalHeight:H,cropped:false};
  const out=document.createElement('canvas');out.width=cw;out.height=ch;out.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,cw,ch);
  return {dataUrl:out.toDataURL('image/png'),x:x0,y:y0,width:cw,height:ch,originalWidth:W,originalHeight:H,cropped:true};
}

function adjustTextItemsForCrop(items,crop){
  if(!Array.isArray(items)||!crop||!crop.cropped)return items||[];
  return items.map(it=>({text:it.text,h:it.h,bbox:{x0:it.bbox.x0-crop.x,y0:it.bbox.y0-crop.y,x1:it.bbox.x1-crop.x,y1:it.bbox.y1-crop.y}}))
    .filter(it=>it.bbox.x1>=-10&&it.bbox.y1>=-10&&it.bbox.x0<=crop.width+10&&it.bbox.y0<=crop.height+10);
}

function expectedGeometryCount(texts){
  return (Array.isArray(texts)?texts:[]).filter(t=>{
    const z=(t||'').trim();return z&&!/^(sim|não|nao)$/i.test(z)&&!/^\d{1,3}$/.test(z);
  }).length;
}
function geometryReconstructionScore(result,expected){
  if(!result||!result.elements)return -999;
  const n=result.elements.length,c=(result.connectors||[]).length;
  if(!expected)return n?Math.min(1,n/8)+Math.min(.4,c/20):0;
  const ratio=Math.min(n,expected)/Math.max(n,expected);
  const over=n>expected*1.45?(n/expected-1.45)*.8:0;
  const under=n<expected*.42?(.42-n/expected)*1.4:0;
  return ratio+Math.min(.32,c/Math.max(1,expected-1)*.30)-over-under;
}
function importedGraphStats(result){
  if(!result||!Array.isArray(result.elements)||!result.elements.length)return {nodeCount:0,edgeCount:0,largestComponent:0,largestRatio:0,componentCount:0};
  const ids=result.elements.map(e=>e.id), idx=new Map(ids.map((id,i)=>[id,i]));
  const adj=Array.from({length:ids.length},()=>[]);
  for(const c of (result.connectors||[])){
    const a=idx.get(c.from), b=idx.get(c.to); if(a==null||b==null) continue;
    adj[a].push(b); adj[b].push(a);
  }
  const seen=new Uint8Array(ids.length); let largest=0, comps=0;
  for(let i=0;i<ids.length;i++) if(!seen[i]){
    comps++; let n=0; const q=[i]; seen[i]=1;
    while(q.length){ const v=q.pop(); n++; for(const u of adj[v]) if(!seen[u]){seen[u]=1; q.push(u);} }
    if(n>largest) largest=n;
  }
  return {nodeCount:ids.length,edgeCount:(result.connectors||[]).length,largestComponent:largest,largestRatio:largest/Math.max(1,ids.length),componentCount:comps};
}
function isLikelyIncompleteImportedLayout(result,expectedTexts){
  const stats=importedGraphStats(result);
  const expected=expectedGeometryCount(expectedTexts||[]);
  if(!stats.nodeCount) return true;
  const hasDecision=(expectedTexts||[]).some(t=>/\?$/.test((t||'').trim()));
  const minEdges=hasDecision ? Math.max(3, Math.floor((stats.nodeCount-1)*0.55)) : Math.max(2, stats.nodeCount-2);
  if(stats.edgeCount<minEdges) return true;
  if(stats.largestRatio<0.78) return true;
  if(expected && stats.nodeCount<Math.max(2,Math.floor(expected*0.50))) return true;
  return false;
}

async function detectFlowFromImage(dataUrl, options={}){
  const img = await new Promise((resolve,reject)=>{ const i=new Image(); i.onload=()=>resolve(i); i.onerror=reject; i.src=dataUrl; });
  const cv=document.createElement('canvas'); cv.width=img.naturalWidth||img.width; cv.height=img.naturalHeight||img.height;
  const ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0);
  const id=ctx.getImageData(0,0,cv.width,cv.height), d=id.data, W=cv.width,H=cv.height;
  const black=new Uint8Array(W*H);
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const g=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
    black[p]=g<190?1:0;
  }
  // V49: o número de textos nativos funciona apenas como um indicador de sanidade.
  // Não inventamos formas por quantidade, mas se um fluxo com 15-20 etapas produzir
  // somente 0/1 caixas, executamos uma segunda leitura do MESMO raster com bordas
  // fechadas de forma conservadora. Isso corrige previews OLE com linhas antialiasadas.
  const expectedShapeHint=(Array.isArray(options.expectedTexts)?options.expectedTexts:[])
    .map(t=>(t||'').trim()).filter(t=>t && !/^(sim|não|nao)$/i.test(t) && !/^\d{1,3}$/.test(t)).length;
  // White connected regions enclosed by black strokes approximate interiors of SmartDraw shapes.
  const seen=new Uint8Array(W*H), qx=new Int32Array(W*H), qy=new Int32Array(W*H), boxes=[];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=1;y<H-1;y+=2){ for(let x=1;x<W-1;x+=2){
    let idx=y*W+x; if(seen[idx]||black[idx]) continue;
    let head=0,tail=0,minx=x,maxx=x,miny=y,maxy=y,count=0,touch=false;
    qx[tail]=x;qy[tail++]=y; seen[idx]=1;
    while(head<tail){
      const cx=qx[head],cy=qy[head++]; count++; if(cx<minx)minx=cx;if(cx>maxx)maxx=cx;if(cy<miny)miny=cy;if(cy>maxy)maxy=cy;
      if(cx<=1||cy<=1||cx>=W-2||cy>=H-2) touch=true;
      for(const [dx,dy] of dirs){ const nx=cx+dx,ny=cy+dy,ni=ny*W+nx; if(nx<0||ny<0||nx>=W||ny>=H||seen[ni]||black[ni])continue; seen[ni]=1;qx[tail]=nx;qy[tail++]=ny; }
    }
    const bw=maxx-minx+1,bh=maxy-miny+1,fill=count/(bw*bh);
    const hugeLoop = (bw>W*0.20 && bh>H*0.12 && (bw/bh)>0.72 && (bw/bh)<1.55);
    const minBW=Math.max(24,Math.min(45,W*.010)),minBH=Math.max(10,Math.min(18,H*.0035));
    if(!touch && !hugeLoop && bw>minBW && bh>minBH && bw<W*0.62 && bh<H*0.22 && fill>0.34){ boxes.push({x:minx,y:miny,w:bw,h:bh,fill}); }
  }}

  // Segunda leitura geométrica (V45): fecha microfrestas de 1 px no contorno do OLE.
  // Alguns SmartDraws mais altos/estreitos são rasterizados pelo Word com pequenos
  // espaços claros na borda. O flood-fill antigo vazava para o fundo da página e a
  // caixa inteira desaparecia. A dilatação abaixo serve SOMENTE para localizar formas;
  // as linhas/conectores continuam sendo conferidas na imagem original `black`.
  (function recoverAntialiasedShapeBorders(){
    const need=Math.max(3,Math.floor(expectedShapeHint*.52));
    if(boxes.length>=need && boxes.length>=3) return;
    const base=new Uint8Array(W*H);
    for(let p=0,pi=0;p<base.length;p++,pi+=4){
      const g=d[pi]*.299+d[pi+1]*.587+d[pi+2]*.114;
      base[p]=g<222?1:0;
    }
    const closed=new Uint8Array(W*H);
    for(let y=0;y<H;y++){
      const off=y*W;
      for(let x=0;x<W;x++){
        const idx=off+x;if(!base[idx])continue;
        closed[idx]=1;
        if(x>0)closed[idx-1]=1;if(x<W-1)closed[idx+1]=1;
        if(y>0)closed[idx-W]=1;if(y<H-1)closed[idx+W]=1;
      }
    }
    const seen2=new Uint8Array(W*H);
    const minW=Math.max(22,Math.min(45,W*.012));
    const minH=Math.max(10,Math.min(18,H*.004));
    for(let y=1;y<H-1;y+=2){ for(let x=1;x<W-1;x+=2){
      const idx=y*W+x;if(seen2[idx]||closed[idx])continue;
      let head=0,tail=0,minx=x,maxx=x,miny=y,maxy=y,count=0,touch=false;
      qx[tail]=x;qy[tail++]=y;seen2[idx]=1;
      while(head<tail){
        const cx=qx[head],cy=qy[head++];count++;if(cx<minx)minx=cx;if(cx>maxx)maxx=cx;if(cy<miny)miny=cy;if(cy>maxy)maxy=cy;
        if(cx<=1||cy<=1||cx>=W-2||cy>=H-2)touch=true;
        const n1=cy*W+cx-1,n2=cy*W+cx+1,n3=(cy-1)*W+cx,n4=(cy+1)*W+cx;
        if(cx>0&&!seen2[n1]&&!closed[n1]){seen2[n1]=1;qx[tail]=cx-1;qy[tail++]=cy;}

    // visível no raster, vence o sentido que aponta para ela. Se a evidência for
    // inconclusiva, preservamos o primeiro sentido encontrado (ordem visual superior→inferior).
    const ri=connectors.findIndex(x=>x.from===toId&&x.to===fromId);
    if(ri>=0){
      const old=connectors[ri];
      const newDir=Number(fresh._arrowDelta)||0,oldDir=Number(old._arrowDelta)||0;
      if(newDir>oldDir+2.5){
        fresh.id=old.id;
        connectors[ri]=fresh;
      }
      return;
    }
    connectors.push(fresh);
  }

  for(let si=0;si<elements.length;si++){
    const list=pairCandidates.filter(c=>c.si===si).sort((a,b)=>{
      const natural=c=>c.dy>8?2:(Math.abs(c.dy)<=8&&c.dx>8?1:0);
      const arrow=c=>c._arrowDelta>3?1:0;
      return (natural(b)+arrow(b))-(natural(a)+arrow(a)) || b.adjusted-a.adjusted || a.len-b.len;
    });
    if(!list.length) continue;
    const src=elements[si];
    const srcCenter=rawCenter(rawBoxes[si]);
    const strong=list.filter(c=>c.raw>=0.88);
    if(src.type==='diamond'){
      // Decisões precisam preservar até dois ramos. Retornos laterais longos podem ter
      // confiança um pouco menor que uma seta vertical curta, mesmo quando são reais.
      // A continuidade do traço já foi validada em bestWireRoute, então usamos um
      // limiar moderado e exigimos destinos distintos.
      const diamondCandidates=list.filter(c=>c.raw>=0.62);
      const chosen=[];
      for(const c of diamondCandidates){
        if(chosen.length>=2)break;
        if(!chosen.some(x=>x.ti===c.ti))chosen.push(c);
      }
      chosen.forEach(c=>addWire(c));
      continue;
    }
    // Rótulos/ramificações como "Com Câmara" e "Sem Câmara" possuem duas saídas
    // descendentes, uma para cada caminho. Quando a imagem mostra claramente dois
    // filhos abaixo do mesmo quadro, preservamos ambos os conectores.
    const forkCandidates=list.filter(c=>
      c.dy>10 && c.raw>=0.57 && c.sourceAnchor==='B' && c.targetAnchor==='T' &&
      Array.isArray(c.route) && c.route.length>=4
    );
    if(forkCandidates.length>=2){
      let forkPair=null,forkScore=-1e9;
      for(let ai=0;ai<forkCandidates.length;ai++){
        for(let bi=ai+1;bi<forkCandidates.length;bi++){
          const a=forkCandidates[ai],b=forkCandidates[bi];
          if(a.ti===b.ti) continue;
          const ac=rawCenter(rawBoxes[a.ti]),bc=rawCenter(rawBoxes[b.ti]);
          const sameRow=Math.abs(ac.y-bc.y)<=Math.max(30,(rawBoxes[a.ti].h+rawBoxes[b.ti].h)*0.72);
          const separated=Math.abs(ac.x-bc.x)>=Math.max(45,Math.min(rawBoxes[a.ti].w,rawBoxes[b.ti].w)*0.45);
          if(!sameRow||!separated) continue;
          // Para ser uma bifurcação verdadeira, as duas rotas precisam compartilhar
          // a MESMA haste vertical e a MESMA barra horizontal (mesmo primeiro ponto
          // de dobra). Isso evita criar ligações entre caixas vizinhas que apenas
          // cruzam linhas existentes em alturas diferentes.
          const ar=a.route||[],br=b.route||[];
          const aBend=ar[1], bBend=br[1];
          const sameTrunk = aBend && bBend &&
            Math.abs(aBend.x-bBend.x)<=4 && Math.abs(aBend.y-bBend.y)<=4;
          if(!sameTrunk) continue;
          // O ponto de dobra também deve ficar abaixo da origem e acima dos dois filhos.
          const sy=rawBoxes[si].y+rawBoxes[si].h;
          const branchY=(aBend.y+bBend.y)/2;
          if(branchY<sy+3 || branchY>Math.min(rawBoxes[a.ti].y,rawBoxes[b.ti].y)-3) continue;
          const score=a.raw+b.raw+0.18-Math.abs(ac.y-bc.y)*0.002;
          if(score>forkScore){forkScore=score;forkPair=[a,b];}
        }
      }
      if(forkPair){ addWire(forkPair[0]); addWire(forkPair[1]); continue; }
    }
    if(strong.length){
      addWire(strong[0]);
      continue;
    }
    // Decisão implícita sem losango (como "Testar equipamento/ferramenta"):
    // dois ramos visíveis, um para baixo e outro para a direita.
    if(list.length>=2){
      const a=list[0],b=list[1],ca=dirClass(a),cb=dirClass(b);
      const horizontalRight=(ca==='H'&&a.dx>0)||(cb==='H'&&b.dx>0);
      const verticalDown=(ca==='V'&&a.dy>0)||(cb==='V'&&b.dy>0);
      if(a.raw>=0.60&&b.raw>=0.60&&Math.abs(a.raw-b.raw)<=0.16&&ca!==cb&&horizontalRight&&verticalDown){
        addWire(a);addWire(b);continue;
      }
    }
    if(list[0].raw>=0.84)addWire(list[0]);
  }
  // Recuperação conservadora de fios retos entre vizinhos alinhados.
  // Alguns traços finos do Word ficam interrompidos por antialiasing/cabeça de seta
  // e não atingem o limiar alto da primeira passagem. Só recuperamos quando:
  // 1) as caixas são vizinhas/alinhadas; 2) não há outra caixa bloqueando; e
  // 3) existe evidência real de tinta ao longo do segmento no SmartDraw renderizado.
  function unorderedConnected(a,b){
    const A=elements[a].id,B=elements[b].id;
    return connectors.some(c=>(c.from===A&&c.to===B)||(c.from===B&&c.to===A));
  }
  function routeBlocked(route,si,ti){
    for(let k=0;k<rawBoxes.length;k++){
      if(k===si||k===ti) continue;
      for(let q=0;q<route.length-1;q++) if(segHitsBox(route[q],route[q+1],rawBoxes[k],1)) return true;
    }
    return false;
  }
  function addRecovered(si,ti,route,rawScore){
    if(unorderedConnected(si,ti)||routeBlocked(route,si,ti)) return;
    const sc=rawCenter(rawBoxes[si]),tc=rawCenter(rawBoxes[ti]);
    const de=directionEvidence(route);
    // Para fios retos comuns, o fluxo é normalmente de cima para baixo ou esquerda→direita.
    // Só invertemos quando a cabeça de seta no raster dá evidência clara do contrário.
    let from=si,to=ti,r=route,delta=de.delta;
    if(delta<-3.0){from=ti;to=si;r=route.slice().reverse();delta=-delta;}
    addWire({si:from,ti:to,dx:rawCenter(rawBoxes[to]).x-rawCenter(rawBoxes[from]).x,dy:rawCenter(rawBoxes[to]).y-rawCenter(rawBoxes[from]).y,route:r,raw:rawScore,_arrowDelta:delta});
  }
  for(let i=0;i<rawBoxes.length;i++){
    const ci=rawCenter(rawBoxes[i]);
    // vizinho vertical mais próximo abaixo
    let vj=-1,vd=Infinity;
    for(let j=0;j<rawBoxes.length;j++){
      if(i===j)continue;const cj=rawCenter(rawBoxes[j]);
      const tol=Math.max(10,Math.min(rawBoxes[i].w,rawBoxes[j].w)*0.16);
      if(cj.y<=ci.y+6||Math.abs(cj.x-ci.x)>tol)continue;
      const dY=cj.y-ci.y;if(dY<vd){vd=dY;vj=j;}
    }
    if(vj>=0&&!unorderedConnected(i,vj)){
      const a=anchors(rawBoxes[i]).B,b=anchors(rawBoxes[vj]).T;
      const x=(a.x+b.x)/2,route=[{x,y:a.y},{x,y:b.y}];
      const ev=segmentEvidence(route[0],route[1]);
      if(ev.len>=7&&ev.ratio>=0.38&&ev.maxMiss<=12) addRecovered(i,vj,route,ev.ratio);
    }
    // vizinho horizontal mais próximo à direita (decisões/ramificações simples)
    let hj=-1,hd=Infinity;
    for(let j=0;j<rawBoxes.length;j++){
      if(i===j)continue;const cj=rawCenter(rawBoxes[j]);
      const tol=Math.max(10,Math.min(rawBoxes[i].h,rawBoxes[j].h)*0.24);
      if(cj.x<=ci.x+8||Math.abs(cj.y-ci.y)>tol)continue;
      const dX=cj.x-ci.x;if(dX<hd){hd=dX;hj=j;}
    }
    if(hj>=0&&!unorderedConnected(i,hj)){
      const a=anchors(rawBoxes[i]).R,b=anchors(rawBoxes[hj]).L;
      const y=(a.y+b.y)/2,route=[{x:a.x,y},{x:b.x,y}];
      const ev=segmentEvidence(route[0],route[1]);
      if(ev.len>=7&&ev.ratio>=0.42&&ev.maxMiss<=10) addRecovered(i,hj,route,ev.ratio);
    }
  }


  // V49: recuperação de bifurcações com haste + barra horizontal compartilhada.
  // É o padrão usado em fluxos como "Com Câmara" / "Sem Câmara". Em rasterizações
  // finas, uma das duas pernas pode perder pixels e a heurística normal enxergar só um ramo.
  (function recoverSharedForks(){
    for(let si=0;si<rawBoxes.length;si++){
      const sb=rawBoxes[si],sp=anchors(sb).B;
      const candidates=[];
      for(let ti=0;ti<rawBoxes.length;ti++){
        if(ti===si||unorderedConnected(si,ti))continue;
        const tb=rawBoxes[ti],tp=anchors(tb).T;
        if(tp.y<=sp.y+10)continue;
        if(tp.y-sp.y>Math.max(260,H*.26))continue;
        if(Math.abs(tp.x-sp.x)<24)continue;
        candidates.push({ti,tp,tb});
      }
      for(let a=0;a<candidates.length;a++)for(let b=a+1;b<candidates.length;b++){
        const A=candidates[a],B=candidates[b];
        if(Math.abs(A.tp.y-B.tp.y)>Math.max(24,(A.tb.h+B.tb.h)*.55))continue;
        if(Math.abs(A.tp.x-B.tp.x)<50)continue;
        const top=Math.min(A.tp.y,B.tp.y), y0=sp.y+5, y1=top-5;
        if(y1<=y0)continue;
        let bestY=null,bestScore=-1;
        const step=Math.max(2,Math.floor((y1-y0)/40));
        for(let yy=y0;yy<=y1;yy+=step){
          const trunk=segmentEvidence(sp,{x:sp.x,y:yy});
          if(trunk.ratio<.34||trunk.maxMiss>13)continue;
          const evalChild=C=>{
            const h=segmentEvidence({x:sp.x,y:yy},{x:C.tp.x,y:yy});
            const v=segmentEvidence({x:C.tp.x,y:yy},C.tp);
            return {score:(h.ratio+v.ratio)/2,min:Math.min(h.ratio,v.ratio),miss:Math.max(h.maxMiss,v.maxMiss)};
          };
          const ea=evalChild(A),eb=evalChild(B);
          if(ea.min<.30||eb.min<.30||ea.miss>14||eb.miss>14)continue;
          const score=trunk.ratio+ea.score+eb.score;
          if(score>bestScore){bestScore=score;bestY=yy;}
        }
        if(bestY==null||bestScore<1.28)continue;
        const rA=[sp,{x:sp.x,y:bestY},{x:A.tp.x,y:bestY},A.tp];
        const rB=[sp,{x:sp.x,y:bestY},{x:B.tp.x,y:bestY},B.tp];
        if(!routeBlocked(rA,si,A.ti))addRecovered(si,A.ti,rA,Math.min(.79,bestScore/3));
        if(!routeBlocked(rB,si,B.ti))addRecovered(si,B.ti,rB,Math.min(.79,bestScore/3));
      }
    }
  })();

  // V49: recuperação estrutural de sequências verticais. Para caixas que se sobrepõem
  // horizontalmente e são vizinhas imediatas, a própria geometria do desenho é evidência
  // suficiente de sequência. Isto cobre linhas muito finas que somem no raster/antialiasing,
  // sem criar atalhos: só liga o vizinho imediatamente abaixo e nunca atravessa outra caixa.
  (function recoverVerticalAdjacency(){
    function overlapX(a,b){
      const lo=Math.max(a.x,b.x),hi=Math.min(a.x+a.w,b.x+b.w);
      return Math.max(0,hi-lo)/Math.max(1,Math.min(a.w,b.w));
    }
    for(let si=0;si<rawBoxes.length;si++){
      const sb=rawBoxes[si],sc=rawCenter(sb);let best=null;
      for(let ti=0;ti<rawBoxes.length;ti++){
        if(ti===si||unorderedConnected(si,ti))continue;
        const tb=rawBoxes[ti],tc=rawCenter(tb);if(tc.y<=sc.y+5)continue;
        const ov=overlapX(sb,tb),centerDx=Math.abs(tc.x-sc.x);
        const aligned=ov>=.42 || centerDx<=Math.max(12,Math.min(sb.w,tb.w)*.18);
        if(!aligned)continue;
        const gap=tb.y-(sb.y+sb.h);if(gap<0)continue;
        const maxGap=Math.max(28,Math.min(H*.085,(sb.h+tb.h)*2.6));
        if(gap>maxGap)continue;
        // nenhum terceiro símbolo pode existir entre os dois no mesmo corredor vertical
        let blocked=false;
        for(let k=0;k<rawBoxes.length;k++){
          if(k===si||k===ti)continue;const kb=rawBoxes[k],kc=rawCenter(kb);
          if(kc.y<=sc.y||kc.y>=tc.y)continue;
          if(overlapX(sb,kb)>=.28 && overlapX(tb,kb)>=.28){blocked=true;break;}
        }
        if(blocked)continue;
        const score=gap+centerDx*.45-(ov*18);
        if(!best||score<best.score)best={ti,gap,ov,centerDx,score};
      }
      if(!best)continue;
      const ti=best.ti,sb2=rawBoxes[si],tb2=rawBoxes[ti];
      const lo=Math.max(sb2.x,tb2.x),hi=Math.min(sb2.x+sb2.w,tb2.x+tb2.w);
      const x=hi>lo?(lo+hi)/2:(rawCenter(sb2).x+rawCenter(tb2).x)/2;
      const a={x,y:sb2.y+sb2.h+1},b={x,y:tb2.y-1};
      const route=[a,b];
      if(!routeBlocked(route,si,ti)) addRecovered(si,ti,route,.52);
    }
  })();

  // Garantia de integridade: uma ligação física = um único conector/seta.
  // Mesmo que duas heurísticas encontrem a mesma linha em sentidos opostos, apenas
  // uma delas sobrevive antes da renderização.
  (function removeReciprocalConnectors(){
    function q(v){return Math.round((+v||0)/7)*7;}
    function physicalKey(c){
      const pts=(c.points||[]);if(pts.length<2)return [c.from,c.to].sort().join('::');
      const a=pts[0],b=pts[pts.length-1];
      const ends=[`${q(a.x)},${q(a.y)}`,`${q(b.x)},${q(b.y)}`].sort();
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      pts.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);});
      return ends.join('|')+`|${q(minX)},${q(minY)},${q(maxX)},${q(maxY)}`;
    }
    const out=[],byPair=new Map(),byPhysical=new Map();
    for(const c of connectors){
      const pair=[c.from,c.to].sort().join('::');
      const pk=physicalKey(c);
      let idx=byPair.has(pair)?byPair.get(pair):(byPhysical.has(pk)?byPhysical.get(pk):-1);
      if(idx<0){idx=out.length;out.push(c);byPair.set(pair,idx);byPhysical.set(pk,idx);continue;}
      const old=out[idx],os=Number(old._arrowDelta)||0,ns=Number(c._arrowDelta)||0;
      // Um único fio recebe uma única seta. Vence o sentido cuja cabeça foi realmente
      // encontrada no raster; empate preserva o fluxo visual natural cima→baixo/esq→dir.
      if(ns>os+2.0){out[idx]=c;byPair.set(pair,idx);byPhysical.set(pk,idx);}
    }
    connectors.length=0;connectors.push(...out);
  })();

  // As colunas do SmartDraw não têm a mesma largura. Inferimos 3 centros de fluxo
  // pelas posições das formas e usamos os pontos médios como divisórias.
  function kmeans3(values){
    if(values.length<6) return null;
    const v=[...values].sort((a,b)=>a-b);
    let c=[v[Math.floor(v.length*.15)],v[Math.floor(v.length*.50)],v[Math.floor(v.length*.85)]];
    for(let it=0;it<20;it++){
      const g=[[],[],[]];
      v.forEach(x=>{let bi=0,bd=Math.abs(x-c[0]);for(let i=1;i<3;i++){const d=Math.abs(x-c[i]);if(d<bd){bd=d;bi=i;}}g[bi].push(x);});
      const n=c.map((old,i)=>g[i].length?g[i].reduce((a,b)=>a+b,0)/g[i].length:old).sort((a,b)=>a-b);
      if(n.every((x,i)=>Math.abs(x-c[i])<.5)){c=n;break;} c=n;
    }
    return c;
  }
  const clusterXs=elements.filter(e=>e.w>120 || e.h>72).map(e=>e.x+e.w/2);
  const centers=kmeans3(clusterXs);
  let widths=[467,466,467];
  if(centers){
    const start=30,end=1430;
    let b1=(centers[0]+centers[1])/2, b2=(centers[1]+centers[2])/2;
    b1=Math.max(start+260,Math.min(start+620,b1));
    b2=Math.max(b1+240,Math.min(end-360,b2));
    widths=[Math.round(b1-start),Math.round(b2-b1),Math.round(end-b2)];
  }
  const lanes=[
    {id:'l1',title:'RESPONSÁVEL 1',width:widths[0]},
    {id:'l2',title:'RESPONSÁVEL 2',width:widths[1]},
    {id:'l3',title:'RESPONSÁVEL 3',width:widths[2]}
  ];
  return {elements,connectors,lanes,imageWidth:W,imageHeight:H};
}

async function importWordSmartDraw(file){
  showHint('Analisando o Word e localizando os fluxogramas…');
  let res;
  try{
    res = await fetch('/api/import-smartdraw-word', {
      method:'POST',
      headers:{'X-File-Name':encodeURIComponent(file.name),'Content-Type':'application/octet-stream'},
      body:file
    });
  }catch(err){
    throw new Error('O conversor local não está ativo. Abra o sistema pelo INICIAR_SISTEMA.bat.');
  }
  if(!res.ok){
    let msg='Falha ao importar Word.';
    try{ const j=await res.json(); msg=j.detail||j.error||msg; }catch(_){ }
    throw new Error(msg);
  }
  const packageData = await res.json();
  hideHint();
  const flows=(packageData.flows||[]).map((f,i)=>Object.assign({},f,{_originalIndex:i,_sourceTitle:f.title||`Fluxograma ${i+1}`,_saved:!!f.diagramJson,_modified:false,_cache:null}));
  packageData.flows=flows;
  wordDocumentState={packageData,file,fileHandle:pendingWordFileHandle||null,flows,activeIndex:-1};
  const selectedFlow = await chooseWordFlow(flows);
  await openWordFlow(selectedFlow);
}

async function openWordFlow(selectedFlow){
  if(!wordDocumentState) throw new Error('Nenhum documento Word está ativo.');
  const packageData=wordDocumentState.packageData;
  const file=wordDocumentState.file;
  const idx=wordDocumentState.flows.indexOf(selectedFlow);
  if(idx<0) throw new Error('Fluxograma não pertence ao documento atual.');
  wordDocumentState.activeIndex=idx;
  const runtimeKey=runtimeWordFlowKey(selectedFlow);
  const data = Object.assign({}, packageData, selectedFlow);
  const wordCtx={
    sessionId:packageData.sessionId,
    fileName:packageData.fileName||file.name,
    flowKey:selectedFlow.key,
    runtimeFlowKey:runtimeKey,
    flowIndex:idx,
    flowId:selectedFlow.flowId||null,
    page:selectedFlow.page,
    source:selectedFlow.source||'SmartDraw',
    fileHandle:wordDocumentState.fileHandle||null
  };
  setWordContext(wordCtx);

  if(selectedFlow._cache){
    diagram=JSON.parse(JSON.stringify(selectedFlow._cache.diagram));
    document.getElementById('diagramTitle').value=selectedFlow._cache.title||selectedFlow.title||file.name.replace(/\.[^.]+$/,'');
    selection=null;selectedIds=new Set();lastCreatedId=null;undoStack=[];redoStack=[];zoom=1;
    render();markSaved();refreshWordUi();
    showHint('Fluxograma carregado da sessão atual.');setTimeout(hideHint,2200);
    return;
  }


  if(selectedFlow.nativeGeometryVersion===50 && !selectedFlow.diagramJson){
    showHint('Recuperando conexões, dimensões e tipografia do Word…');
    let preview=null;
    try{
      const response=await fetch('/api/render-word-flow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:packageData.sessionId,flowKey:runtimeKey,originalFlowKey:selectedFlow.key,expectedTitle:selectedFlow._sourceTitle||selectedFlow.title,expectedNativeTexts:selectedFlow.nativeShapes.map(s=>s.text)})});
      if(!response.ok)throw new Error((await response.json()).error||'Prévia indisponível');
      preview=await response.json();
    }catch(error){console.warn('Tipografia original indisponível:',error);}
    diagram=buildNativeDiagram(selectedFlow,preview?.emfText);
    document.getElementById('diagramTitle').value=selectedFlow.title||file.name.replace(/\.[^.]+$/,'');
    selection=null;selectedIds=new Set();lastCreatedId=null;undoStack=[];redoStack=[];zoom=1;
    fitImportedFlowView();render();markSaved();
    selectedFlow._cache={diagram:JSON.parse(JSON.stringify(diagram)),title:document.getElementById('diagramTitle').value};
    refreshWordUi();showHint(preview?'Fluxograma importado com as conexões e a tipografia do Word.':'Conexões importadas. A tipografia original não pôde ser recuperada; confira os textos.');setTimeout(hideHint,6500);
    return;
  }

  // Fluxos já salvos pelo SGQ carregam o JSON nativo embutido no próprio Word:
  // a partir da segunda edição não há OCR nem reconstrução visual.
  if(selectedFlow.diagramJson){
    try{
      const saved=typeof selectedFlow.diagramJson==='string'?JSON.parse(selectedFlow.diagramJson):selectedFlow.diagramJson;
      diagram=saved.diagram||saved;
      document.getElementById('diagramTitle').value=saved.title||selectedFlow.title||file.name.replace(/\.[^.]+$/,'');
      selection=null;selectedIds=new Set();lastCreatedId=null;undoStack=[];redoStack=[];zoom=1;
      fitImportedFlowView();render();markSaved();
      selectedFlow._cache={diagram:JSON.parse(JSON.stringify(diagram)),title:document.getElementById('diagramTitle').value};
      refreshWordUi();
      showHint('Fluxograma SGQ carregado diretamente do Word.');
      setTimeout(hideHint,3500);
      return;
    }catch(e){ console.warn('Metadados SGQ inválidos; usando reconstrução visual.',e); }
  }

  // Só agora que o usuário escolheu o fluxo pedimos ao Word para renderizar
  // UMA única página. Isso evita travar documentos grandes com vários SmartDraw.
  showHint('Fluxograma selecionado. Abrindo somente esse objeto SmartDraw…');
  let renderRes;
  try{
    renderRes = await fetch('/api/render-word-flow', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId:packageData.sessionId,flowKey:runtimeKey,originalFlowKey:selectedFlow.key,expectedTitle:selectedFlow._sourceTitle||selectedFlow.title||'',expectedNativeTexts:selectedFlow.nativeTexts||[]})
    });
  }catch(err){
    throw new Error('O servidor local perdeu a conexão durante a renderização.');
  }
  if(!renderRes.ok){
    let msg='Falha ao renderizar a página do fluxograma.';
    try{const j=await renderRes.json();msg=j.detail||j.error||msg;}catch(_){ }
    throw new Error(msg);
  }
  const renderData=await renderRes.json();
  data.referencePng=renderData.referencePng||null;
  data.referencePdf=renderData.referencePdf||null;
  data.emfText=renderData.emfText||null;

          const meaningful=common.slice(0,k).filter(x=>x.length>2&&!EDGE_STOPWORDS.has(x)).length;
          if(meaningful<3) continue;
          // Prefere uma versão nativa exatamente igual ao prefixo; caso não exista,
          // usa a grafia/acento da primeira ocorrência reconhecida.
          const prefixNorm=common.slice(0,k).join(' ');
          let canonical=nativeTexts.find(t=>normalizeText(t)===prefixNorm);
          if(!canonical){
            const st=cache.get(seed.id)||[];
            canonical=st.slice(0,k).map(x=>x.raw).join(' ');
          }
          canonical=cleanText(canonical);
          if(canonical.length<10) continue;
          group.forEach(e=>{e.text=canonical;already.add(e.id);});
        }
      }
      repairRepeatedTextConsensus();

      // Fallback estrutural: quando o OCR de uma decisão/número falha completamente,
      // o tipo e o tamanho da forma ainda permitem escolher entre os textos nativos restantes.
      const usedNativeNorm=new Set(diagram.elements.map(e=>normalizeText(e.text)).filter(Boolean));
      const qNative=nativeTexts.filter(t=>/\?$/.test(t.trim())&&!usedNativeNorm.has(normalizeText(t))).sort((a,b)=>b.length-a.length);
      const qElems=diagram.elements.filter(e=>e.type==='diamond' && (!e.text || textQuality(e.text)<4)).sort((a,b)=>(b.w*b.h)-(a.w*a.h));
      qElems.forEach((e,i)=>{if(qNative[i]){e.text=qNative[i];usedNativeNorm.add(normalizeText(qNative[i]));}});
      const digitNative=nativeTexts.filter(t=>/^\d+$/.test(t.trim()));
      diagram.elements.filter(e=>e.w<105&&e.h<105&&(!e.text||textQuality(e.text)<2)).forEach(e=>{
        if(!digitNative.length)return;
        // Não inventa número em círculos vazios. Alguns streams SmartDraw carregam
        // identificadores numéricos internos que não estão visíveis no desenho. Só
        // aceita o número quando PDF/OCR já forneceu evidência local.
        const evidence=cleanText(pdfCandidateById[e.id]||e.text||'').match(/\b(\d{1,3})\b/);
        if(evidence && digitNative.includes(evidence[1])) e.text=evidence[1];
      });

      // Cabeçalhos e SIM/NÃO: OCR global, confrontado com o PDF.
      try{
        await worker.setParameters({tessedit_pageseg_mode:'11'});
        const global=await worker.recognize(referenceImage);
        const words=(global.data.words||[]).filter(w=>w.text&&w.text.trim());
        words.forEach(w=>{
          let txt=cleanText(w.text).toUpperCase().replace(/^NAO$/,'NÃO').replace(/[^A-ZÃÕÁÉÍÓÚÇ]/g,'');
          if(txt!=='SIM'&&txt!=='NÃO')return;
          const o={cx:(w.bbox.x0+w.bbox.x1)/2*sx+ox,cy:(w.bbox.y0+w.bbox.y1)/2*sx+oy};
          let best=null,bestD=1e9;diagram.connectors.forEach(c=>{const pts=connectorPoints(c);if(!pts.length)return;const d=pointPolylineDistance({x:o.cx,y:o.cy},pts);if(d<bestD){bestD=d;best=c;}});if(best&&bestD<95){best.label=txt;best.labelPos={x:o.cx,y:o.cy};}
        });
      }catch(_){ }
    }catch(err){console.warn('Falha no confronto OCR/PDF:',err);}
    finally{if(worker){try{await worker.terminate();}catch(_){}}}
  }

  // Cabeçalhos: prefere texto vetorial do PDF; se não houver, usa nomes SmartDraw conhecidos.
  const knownHeads=['AUX. MANUTENÇÃO','TRANSPORTES','EQUIPE DE MANUTENÇÃO'];
  diagram.lanes.forEach((lane,i)=>{
    if(!lane.title||/^RESPONSÁVEL/.test(lane.title)){
      const hit=nativeTexts.find(t=>normalizeText(t)===normalizeText(knownHeads[i]||''));if(hit)lane.title=hit.toUpperCase();
    }
  });

  // Se o Word não possui raias/responsáveis, não inventamos "RESPONSÁVEL 1/2/3".
  const hasRealLaneTitle=diagram.lanes.some(l=>l.title && !/^RESPONSÁVEL\s*\d*$/i.test(l.title.trim()));
  if(!hasRealLaneTitle){
    diagram.hideLaneHeaders=true;
    diagram.lanes=[{id:'l1',title:'',width:1400}];
  }else{
    diagram.hideLaneHeaders=false;
  }

  // Textos livres do desenho que não pertencem a nenhuma forma.
  // Neste modelo são importantes para manter a leitura original do SmartDraw.
  function addFreePdfLabel(predicate,fallbackText){
    const outside=o=>!diagram.elements.some(e=>e.type!=='text'&&o.cx>=e.x-3&&o.cx<=e.x+e.w+3&&o.cy>=e.y-3&&o.cy<=e.y+e.h+3);
    const seeds=textItems.filter(o=>outside(o)&&predicate(normalizeText(o.text)));
    if(!seeds.length)return;
    seeds.sort((a,b)=>a.cy-b.cy||a.x0-b.x0);
    const seed=seeds[0];
    const row=textItems.filter(o=>outside(o)&&Math.abs(o.cy-seed.cy)<11&&Math.abs(o.cx-seed.cx)<260).sort((a,b)=>a.x0-b.x0);
    let txt=cleanText(row.map(x=>x.text).join(' '))||fallbackText;
    if(fallbackText&&normalizeText(txt).length<normalizeText(fallbackText).length*.55)txt=fallbackText;
    if(diagram.elements.some(e=>e.type==='text'&&normalizeText(e.text)===normalizeText(txt)))return;
    const x0=Math.min(...row.map(x=>x.x0)),x1=Math.max(...row.map(x=>x.x1));
    diagram.elements.push({id:uid('e'),type:'text',x:Math.round(x0-6),y:Math.round(seed.cy-17),w:Math.max(100,Math.round(x1-x0+12)),h:30,text:txt});
  }
  addFreePdfLabel(t=>t==='veiculo','VEÍCULO');
  addFreePdfLabel(t=>t.includes('equipamento')&&t.includes('ferramenta'),'EQUIPAMENTO / FERRAMENTA');

  // V49: nenhum fluxograma recebe correção estrutural específica por modelo.
  // A geometria final vem exclusivamente do objeto selecionado e da evidência visual/vetorial.


  diagram.elements.forEach(elm=>{
    if(!elm.text) elm.text = '[texto não reconhecido]';
    delete elm._textSource; delete elm._detectedCircle; delete elm._filledSource;
  });
  diagram.connectors.forEach(c=>{delete c._wireConfidence;delete c._arrowDelta;delete c._dx;delete c._dy;});

  // Ajuste final conservador: preserva posição/direção e normaliza apenas círculos de referência.
  postProcessImportedLayout();
  fitImportedFlowView();
  render(); markSaved();
  selectedFlow._cache={diagram:JSON.parse(JSON.stringify(diagram)),title:document.getElementById('diagramTitle').value};
  refreshWordUi();
  showHint(nativeTexts.length ? 'Importação concluída: texto nativo do SmartDraw confrontado com a imagem (V48).' : 'Importação concluída por imagem/OCR. Revise apenas os campos marcados.');
  setTimeout(hideHint,6000);
}

async function handleImportedFile(file,fileHandle=null){
  if(!file) return;
  const name=file.name.toLowerCase();
  pendingWordFileHandle=fileHandle||null;
  try{
    if(name.endsWith('.json')){
      await importJsonFile(file);
    } else if(name.endsWith('.doc') || name.endsWith('.docx')){
      await importWordSmartDraw(file);
    } else {
      throw new Error('Formato não suportado. Use .json, .doc ou .docx.');
    }
  }catch(err){
    if(err && err.message==='Importação cancelada.') return;
    resetWordDocumentState();
    showAlert('Não foi possível importar: '+err.message);
  }finally{
    pendingWordFileHandle=null;
  }
}

}

function getFlowOnlyBounds(){
  if(!diagram.elements.length) return {x:0,y:0,w:800,h:600};
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  diagram.elements.forEach(e=>{minX=Math.min(minX,e.x);minY=Math.min(minY,e.y);maxX=Math.max(maxX,e.x+e.w);maxY=Math.max(maxY,e.y+e.h);});
  diagram.connectors.forEach(c=>{
    const pts=connectorPoints(c);
    if(pts)pts.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);});
    if(c.labelPos){minX=Math.min(minX,c.labelPos.x-50);minY=Math.min(minY,c.labelPos.y-20);maxX=Math.max(maxX,c.labelPos.x+50);maxY=Math.max(maxY,c.labelPos.y+20);}
  });
  // V51: a imagem salva no Word cobre so o desenho. Incluir o quadro da pagina SmartDraw
  // (sourceFrame) gerava PNG gigante com metade em branco, que leitores fora do Word recortavam.
  const pad=24;
  return {x:Math.floor(minX-pad),y:Math.floor(minY-pad),w:Math.ceil(maxX-minX+pad*2),h:Math.ceil(maxY-minY+pad*2)};
}
function buildFlowOnlySvg(){
  const oldSelection=selection,oldIds=selectedIds,oldPending=pendingConnectFrom;
  selection=null;selectedIds=new Set();pendingConnectFrom=null;render();
  const clone=board.cloneNode(true);
  selection=oldSelection;selectedIds=oldIds;pendingConnectFrom=oldPending;render();
  clone.setAttribute('xmlns',SVGNS);
  clone.querySelectorAll('.lane-layer,#refImageNode,#gridBgNode,.lane-ui-control').forEach(n=>n.remove());
  const b=getFlowOnlyBounds();
  clone.setAttribute('viewBox',`${b.x} ${b.y} ${b.w} ${b.h}`);
  clone.setAttribute('width',b.w);clone.setAttribute('height',b.h);
  return {clone,bounds:b};
}
function flowToPngDataUrl(){
  return new Promise((resolve,reject)=>{
    try{
      const {clone,bounds}=buildFlowOnlySvg();
      const xml=new XMLSerializer().serializeToString(clone);
      const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(blob),img=new Image();
      img.onload=()=>{
        try{
          // V51: limita a 3200 px no maior lado (antes chegava a 4958x9528 = 47 MP).
          const scale=Math.max(1,Math.min(4,3200/Math.max(1,bounds.w,bounds.h))),canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.ceil(bounds.w*scale));canvas.height=Math.max(1,Math.ceil(bounds.h*scale));
          const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.scale(scale,scale);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,bounds.w,bounds.h);
          URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/png',1));
        }catch(e){URL.revokeObjectURL(url);reject(e);}
      };
      img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Falha ao gerar a imagem do fluxo.'));};
      img.src=url;
    }catch(e){reject(e);}
  });
}
async function exportCurrentWordDocument(){
  if(!wordDocumentState) return;
  try{
    showHint('Gerando o Word com os fluxogramas salvos…');
    const res=await fetch('/api/export-word-session',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId:wordDocumentState.packageData.sessionId})
    });
    if(!res.ok){let m='Falha ao exportar o Word.';try{const j=await res.json();m=j.error||m;}catch(_){}throw new Error(m);}
    const blob=await res.blob();
    const base=wordDocumentState.packageData.fileName||'documento.doc';
    const dot=base.lastIndexOf('.');
    const outName=(dot>0?base.slice(0,dot):base)+'_atualizado'+(dot>0?base.slice(dot):'.doc');
    downloadBlob(blob,outName);
    showHint(`Word exportado com ${wordModifiedCount()} fluxograma(s) alterado(s).`);
    setTimeout(hideHint,4500);
  }catch(err){hideHint();showAlert('Não foi possível exportar o Word: '+(err.message||err));}
}

async function saveBackToWord(){
  if(!currentWordContext || !wordDocumentState) return saveJson();
  const flow=activeWordFlow();
  if(!flow) return;
  try{
    showHint('Salvando somente este fluxograma na cópia de trabalho do Word…');
    const pngDataUrl=await flowToPngDataUrl();
    const flowKey=runtimeWordFlowKey(flow);
    const res=await fetch('/api/save-word-flow-session',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sessionId:wordDocumentState.packageData.sessionId,
        flowKey,
        flowId:flow.flowId||null,
        sourceTitle:flow._sourceTitle||flow.title||'',
        pngDataUrl,
        title:document.getElementById('diagramTitle').value,
        diagram
      })
    });
    if(!res.ok){let m='Falha ao salvar este fluxograma.';try{const j=await res.json();m=j.error||m;}catch(_){}throw new Error(m);}
    const data=await res.json();

}

function computeExportSize(){
  const totalLaneW = diagram.lanes.reduce((a,l)=>a+l.width,0);
  let w = diagram.lanes.length ? 30+totalLaneW+30 : 400;
  let h = diagram.lanes.length ? 86 : 300;
  diagram.elements.forEach(e=>{
    w = Math.max(w, e.x+e.w+30);
    h = Math.max(h, e.y+e.h+40);
  });
  return {w: Math.ceil(w), h: Math.ceil(h)};
}

function exportRaster(format){
  const clone = board.cloneNode(true);
  clone.setAttribute('xmlns', SVGNS);
  const size = computeExportSize();
  clone.setAttribute('viewBox', `0 0 ${size.w} ${size.h}`);
  clone.setAttribute('width', size.w); clone.setAttribute('height', size.h);
  stripEditorUiFromClone(clone);
  if(format==='jpg'){
    const bg = document.createElementNS(SVGNS,'rect');
    bg.setAttribute('x',0); bg.setAttribute('y',0); bg.setAttribute('width',size.w); bg.setAttribute('height',size.h); bg.setAttribute('fill','#ffffff');
    clone.insertBefore(bg, clone.firstChild.nextSibling);
  }
  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = ()=>{
    const scale = 4;
    const canvas = document.createElement('canvas');
    canvas.width = size.w*scale; canvas.height = size.h*scale;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(format==='jpg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
    ctx.scale(scale,scale);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img,0,0);
    const mime = format==='jpg' ? 'image/jpeg' : 'image/png';
    const ext = format==='jpg' ? '.jpg' : '.png';
    canvas.toBlob((blob)=>{ downloadBlob(blob, currentTitleSlug()+ext); URL.revokeObjectURL(url); }, mime, 0.97);
  };
  img.src = url;
  closeDropdown();
}

function pGroup(label,node,extra){
  const g=document.createElement('div'); g.className='p-grp';
  if(label!==null){ const l=document.createElement('div'); l.className='p-lbl'; l.innerHTML=`<span>${label}</span>${extra||''}`; g.appendChild(l); }
  if(node) g.appendChild(node);
  propPanel.appendChild(g); return g;
}
function pSwatches(list,cur,apply){
  const w=document.createElement('div'); w.className='sw';
  list.forEach(c=>{const b=document.createElement('button');b.type='button';b.style.background=c;b.title=c;
    if((cur||'').toLowerCase()===c.toLowerCase()) b.classList.add('on');
    b.onclick=()=>v3Change(()=>apply(c)); w.appendChild(b);});
  const lab=document.createElement('label'); lab.title='Outra cor'; lab.textContent='+';
  const inp=document.createElement('input'); inp.type='color'; inp.value=/^#[0-9a-f]{6}$/i.test(cur||'')?cur:'#0B4A44';
  let snap=false;
  inp.addEventListener('input',()=>{ if(!snap){snapshot();snap=true;} apply(inp.value); render(); });
  inp.addEventListener('change',()=>{ snap=false; });
  lab.appendChild(inp); w.appendChild(lab);
  return w;
}
function pSeg(opts,cur,apply){
  const w=document.createElement('div'); w.className='seg';
  opts.forEach(([v,l,t])=>{const b=document.createElement('button');b.type='button';b.innerHTML=l;if(t)b.title=t;if(v===cur)b.classList.add('on');
    b.onclick=()=>v3Change(()=>apply(v)); w.appendChild(b);});
  return w;
}
function panelHead(title,sub){ propPanel.innerHTML=''; const h=document.createElement('h3'); h.textContent=title; const s=document.createElement('div'); s.className='p-sub'; s.textContent=sub||''; propPanel.append(h,s); }
let lastPanelKey='';
function renderPropPanel(force){
  if(!propPanel || document.getElementById('workArea').classList.contains('panel-hidden')) return;
  if(!force && propPanel.contains(document.activeElement) && document.activeElement.matches('input,textarea')) return;
  const ids=[...selectedIds].filter(id=>getElement(id));
  const conn=selection&&selection.type==='connector'?getConnector(selection.id):null;
  if(conn) return panelConnector(conn);
  if(ids.length) return panelElements(ids.map(getElement));
  panelFlow();
}
function panelConnector(c){
  const a=getElement(c.from), b=getElement(c.to);
  panelHead('Seta',`${(a&&a.text||'').replace(/\s+/g,' ').slice(0,30)} → ${(b&&b.text||'').replace(/\s+/g,' ').slice(0,30)}`);
  pGroup('Cor da linha',pSwatches(V3_STROKES,c.stroke||COLORS.steel,v=>{c.stroke=v;}));
  pGroup('Estilo',pSeg([[false,'Contínua'],[true,'Tracejada']],!!c.dash,v=>{c.dash=v;}));
  const w=+(c.strokeWidth||1.8);
  pGroup('Espessura',pSeg([[1.3,'Fina'],[1.8,'Normal'],[2.8,'Grossa']],w<=1.5?1.3:w>=2.4?2.8:1.8,v=>{c.strokeWidth=v;}));
  const lab=document.createElement('input'); lab.className='p-field'; lab.value=c.label||''; lab.placeholder='SIM, NÃO…';
  lab.addEventListener('change',()=>v3Change(()=>{c.label=lab.value.trim(); if(!c.label) delete c.labelPos;}));
  const lg=pGroup('Rótulo',lab);
  if(c.label){
    const st=document.createElement('div'); st.style.marginTop='8px';
    st.appendChild(pSeg([['text','Texto ao lado'],['box','Caixinha']],c.labelStyle==='box'?'box':'text',v=>{if(v==='box')c.labelStyle='box';else delete c.labelStyle;}));
    lg.appendChild(st);
    const rp=document.createElement('button'); rp.className='p-btn'; rp.style.marginTop='8px'; rp.textContent='Recolocar rótulo junto da saída';
    rp.onclick=()=>v3Change(()=>{delete c.labelPos;}); lg.appendChild(rp);
  }
  const route=document.createElement('div');
  route.innerHTML=`<div class="p-toggle"><span>Manter como ajustei</span><span class="tg ${c.manual?'on':''}"></span></div>
    <div class="p-hint">Arraste as bolinhas brancas para mover cada trecho da linha. Arraste as pontas verdes para escolher o ponto de saída ou de chegada na caixa.</div>`;
  route.querySelector('.p-toggle').onclick=()=>v3Change(()=>{ if(c.manual){ delete c.manual; delete c.points; } else convertConnectorToManual(c); });
  const rb=document.createElement('button'); rb.className='p-btn'; rb.style.marginTop='10px'; rb.textContent='Refazer rota automática';
  rb.onclick=()=>v3Change(()=>resetConnectorRoute(c)); route.appendChild(rb);
  pGroup('Rota',route);
  const del=document.createElement('button'); del.className='p-btn danger'; del.textContent='Excluir seta'; del.onclick=deleteSelection;
  pGroup(null,del);
}
function panelElements(shapes){
  const s=shapes[0], multi=shapes.length>1;
  const names={oval:'Início/Fim',rect:'Processo',diamond:'Decisão',text:'Texto'};
  panelHead(multi?`${shapes.length} itens selecionados`:(names[s.type]||'Forma'), multi?'Cores e alinhamento valem para todos':(s.text||'').replace(/\s+/g,' '));
  const each=fn=>shapes.forEach(fn);
  if(!multi && s.type!=='text') pGroup('Tipo',pSeg([['oval','Oval'],['rect','Retângulo'],['diamond','Losango']],s.type,v=>{s.type=v;}));
  if(multi){
    const row=document.createElement('div'); row.className='align-row';
    const al=(k)=>v3Change(()=>{
      const minX=Math.min(...shapes.map(e=>e.x)),maxX=Math.max(...shapes.map(e=>e.x+e.w)),minY=Math.min(...shapes.map(e=>e.y)),maxY=Math.max(...shapes.map(e=>e.y+e.h));
      const ref=getElement(selection&&selection.id)||s, cx=ref.x+ref.w/2, cy=ref.y+ref.h/2;
      const start={}; shapes.forEach(e=>start[e.id]={x:e.x,y:e.y});
      shapes.forEach(e=>{ if(k==='L')e.x=minX; if(k==='R')e.x=maxX-e.w; if(k==='C')e.x=Math.round(cx-e.w/2);
        if(k==='T')e.y=minY; if(k==='B')e.y=maxY-e.h; if(k==='M')e.y=Math.round(cy-e.h/2); });
      rerouteConnectorsAfterShapeMove(shapes.map(e=>e.id),start);
    });
    [['L','alL','Alinhar à esquerda'],['C','alC','Centralizar na vertical'],['R','alR','Alinhar à direita'],['T','alT','Alinhar ao topo'],['M','alM','Centralizar na horizontal'],['B','alB','Alinhar à base']].forEach(([k,ic,t])=>{
      const b=document.createElement('button'); b.type='button'; b.title=t; b.innerHTML=icon(ICON[ic]); b.onclick=()=>al(k); row.appendChild(b);});
    pGroup('Alinhar',row);
  }
  if(s.type!=='text') pGroup('Preenchimento',pSwatches(V3_FILLS,defaultFill(s),v=>each(e=>{if(e.type!=='text')e.fill=v;})));
  if(s.type!=='text') pGroup('Borda',pSwatches(V3_STROKES,s.stroke||COLORS.ink,v=>each(e=>{if(e.type!=='text')e.stroke=v;})));
  pGroup('Cor do texto',pSwatches(V3_STROKES,s.textColor||COLORS.ink,v=>each(e=>{e.textColor=v;})));
  if(s.type!=='text'){
    const sw=+(s.strokeWidth||1.6);
    pGroup('Espessura da borda',pSeg([[1.2,'Fina'],[1.6,'Normal'],[2.6,'Grossa']],sw<=1.3?1.2:sw>=2.2?2.6:1.6,v=>each(e=>{e.strokeWidth=v;})));
  }
  if(!multi){
    const cur=s.fontSize||Math.round(shapeTextLayout(s).fontSize*10)/10;
    const fs=document.createElement('div'); fs.className='seg';
    [['−',-1,'Diminuir'],['+',1,'Aumentar']].forEach(([l,d,t])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.title=t;
      b.onclick=()=>v3Change(()=>{s.fontSize=Math.max(7,Math.round(((s.fontSize||cur)+d)*10)/10);}); fs.appendChild(b);});
    const auto=document.createElement('button'); auto.type='button'; auto.textContent='Auto'; auto.title='Ajustar ao tamanho da caixa';
    if(!s.fontSize) auto.classList.add('on');
    auto.onclick=()=>v3Change(()=>{delete s.fontSize;}); fs.appendChild(auto);
    pGroup('Tamanho do texto',fs,`<em>${cur} pt</em>`);
    const xy=document.createElement('div'); xy.className='xy';
    [['X','x'],['Y','y'],['L','w'],['A','h']].forEach(([l,k])=>{
      const lb=document.createElement('label'); lb.title={x:'Posição horizontal',y:'Posição vertical',w:'Largura',h:'Altura'}[k];
      lb.innerHTML=`${l}<input type="number" step="${snapEnabled?GRID:1}" value="${Math.round(s[k])}">`;
      const inp=lb.querySelector('input');
      inp.addEventListener('change',()=>v3Change(()=>{const start={[s.id]:{x:s.x,y:s.y}};let v=+inp.value||0;if(k==='w')v=Math.max(40,v);if(k==='h')v=Math.max(24,v);s[k]=v;if(k==='x'||k==='y')rerouteConnectorsAfterShapeMove([s.id],start);}));
      xy.appendChild(lb);});
    pGroup('Posição e tamanho',xy);
    const ta=document.createElement('textarea'); ta.className='p-field'; ta.rows=3; ta.value=s.text||'';
    ta.addEventListener('change',()=>v3Change(()=>{s.text=ta.value;}));
    pGroup('Texto',ta);
  }
}
function panelFlow(){
  panelHead('Fluxo',document.getElementById('diagramTitle').value||'');
  const box=document.createElement('div');
  Object.entries(V3_THEMES).forEach(([name,th])=>{
    const b=document.createElement('button'); b.type='button'; b.className='theme-btn';
    b.innerHTML=`<span>${name}</span><span class="theme-dots">${[th.oval[0],th.oval[1],th.line].map(c=>`<i style="background:${c}"></i>`).join('')}</span>`;
    b.onclick=()=>v3Change(()=>{
      diagram.elements.forEach(e=>{const p=th[e.type]; if(Array.isArray(p)){e.fill=p[0];e.stroke=p[1];e.textColor=th.text;} else if(e.type==='text'){e.textColor=th.text;}});
      diagram.connectors.forEach(c=>{c.stroke=th.line;});
      showHint(`Tema “${name}” aplicado ao fluxo todo. Ctrl+Z desfaz.`); setTimeout(hideHint,2600);
    });
    box.appendChild(b);
  });
  pGroup('Tema de cores do fluxo',box);
  const lines=document.createElement('div');
  const sep=document.createElement('button'); sep.className='p-btn'; sep.textContent='Separar linhas que saem juntas';
  sep.title='Refaz as rotas automáticas para que setas que saem do mesmo lado de uma caixa não se sobreponham';
  sep.onclick=()=>v3Change(()=>{ let n=0; diagram.connectors.forEach(c=>{ if(!c.manual && hasFixedRoute(c)){ const k=c.from; const same=diagram.connectors.filter(o=>o.from===k).length; if(same>1){ resetConnectorRoute(c); n++; } } });
    showHint(n?`${n} seta(s) refeitas com saídas separadas.`:'Nenhuma seta sobreposta encontrada.'); setTimeout(hideHint,2600); });
  lines.appendChild(sep);
  const h=document.createElement('div'); h.className='p-hint'; h.textContent='Setas ajustadas à mão não são alteradas.';
  lines.appendChild(h);
  pGroup('Linhas',lines);
  const sc=document.createElement('div'); sc.className='shortcuts';
  [['V','Selecionar'],['C','Conectar'],['F2','Editar texto'],['Del','Excluir'],['Ctrl+D','Duplicar'],['Ctrl+Z','Desfazer'],['Setas','Mover a seleção'],['Ctrl+roda','Zoom']].forEach(([k,t])=>{sc.insertAdjacentHTML('beforeend',`<span class="kbd">${k}</span><span>${t}</span>`);});
  pGroup('Atalhos',sc);
  const tip=document.createElement('div'); tip.className='p-hint'; tip.textContent='Clique numa caixa ou seta para editar cores, posição e rota.';
  pGroup(null,tip);
}

/* ---------- réguas, coordenadas e status ---------- */
const rulerX=document.getElementById('rulerX'), rulerY=document.getElementById('rulerY');
function drawRulers(){
  if(!rulerX||!rulerY||!board.viewBox||!board.viewBox.baseVal) return;
  const br=board.getBoundingClientRect(), vb=board.viewBox.baseVal;
  if(!vb.width||!br.width) return;
  const k=br.width/vb.width;
  const step=k>=.9?50:k>=.45?100:k>=.22?200:500;
  [[rulerX,'x'],[rulerY,'y']].forEach(([cv,ax])=>{
    const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    const W=Math.max(1,Math.round(r.width)), H=Math.max(1,Math.round(r.height));
    if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr;}
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    g.strokeStyle='#B9C1BE'; g.fillStyle='#8A9390'; g.font='9px "IBM Plex Mono", Consolas, monospace'; g.lineWidth=1;
    const origin=ax==='x'?br.left-r.left:br.top-r.top;
    const len=ax==='x'?W:H, start=ax==='x'?vb.x:vb.y;
    const u0=Math.floor((start+(-origin)/k)/(step/5))*(step/5);
    for(let u=Math.max(0,u0);;u+=step/5){
      const p=origin+(u-start)*k; if(p>len) break; if(p<0) continue;
      const major=Math.abs(u%step)<.01, mid=Math.abs(u%(step/2))<.01, L=major?9:mid?6:3;
      g.beginPath();
      if(ax==='x'){g.moveTo(Math.round(p)+.5,22);g.lineTo(Math.round(p)+.5,22-L);}else{g.moveTo(22,Math.round(p)+.5);g.lineTo(22-L,Math.round(p)+.5);}
      g.stroke();
      if(major){ if(ax==='x') g.fillText(String(u),p+3,9); else { g.save(); g.translate(9,p-3); g.rotate(-Math.PI/2); g.fillText(String(u),0,0); g.restore(); } }
    }
  });
}
function updateStatusBits(){
  const dirty=isDiagramDirty();
  const ss=document.getElementById('saveState');
  if(ss){ ss.textContent=dirty?'Alterações não salvas':'Salvo'; ss.classList.toggle('dirty',dirty); }
  const ci=document.getElementById('countInfo');
  if(ci) ci.textContent=`${diagram.elements.length} formas, ${diagram.connectors.length} setas`;
  const zr=document.getElementById('btnZoomReset'); if(zr) zr.textContent=Math.round(zoom*100)+'%';
  const ids=[...selectedIds].filter(id=>getElement(id));
  const hasSel=!!(selection||ids.length);
  ['btnEditText','btnDuplicate','btnDelete'].forEach(id=>{const b=document.getElementById(id); if(b) b.disabled=!hasSel;});
  const u=document.getElementById('btnUndo'), r=document.getElementById('btnRedo');
  if(u) u.disabled=!undoStack.length; if(r) r.disabled=!redoStack.length;
}
function afterRenderHooks(){
  try{ updateStatusBits(); }catch(e){ reportRuntimeError(e); }
  try{ renderPropPanel(); }catch(e){ reportRuntimeError(e); }
  try{ requestAnimationFrame(drawRulers); }catch(e){}
}
board.addEventListener('mousemove',ev=>{
  try{ const p=toSvgPoint(ev); document.getElementById('coordInfo').textContent=`X ${Math.round(p.x)}   Y ${Math.round(p.y)}`; }catch(_){}
});
canvasWrap.addEventListener('scroll',()=>requestAnimationFrame(drawRulers));
window.addEventListener('resize',()=>requestAnimationFrame(drawRulers));
document.getElementById('diagramTitle').addEventListener('input',()=>{ if(!selection&&!selectedIds.size) renderPropPanel(); });
canvasWrap.addEventListener('wheel',ev=>{
  if(!ev.ctrlKey) return; ev.preventDefault();
  const r=canvasWrap.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const fx=(canvasWrap.scrollLeft+mx)/Math.max(1,canvasWrap.scrollWidth), fy=(canvasWrap.scrollTop+my)/Math.max(1,canvasWrap.scrollHeight);
  zoom=Math.max(.12,Math.min(2,zoom*(ev.deltaY<0?1.1:1/1.1))); render();
  canvasWrap.scrollLeft=fx*canvasWrap.scrollWidth-mx; canvasWrap.scrollTop=fy*canvasWrap.scrollHeight-my;
},{passive:false});
document.getElementById('btnZoomFit').addEventListener('click',()=>{
  const vb=board.viewBox.baseVal; if(!vb||!vb.width) return;
  zoom=Math.max(.12,Math.min(2,Math.min((canvasWrap.clientWidth-60)/vb.width,(canvasWrap.clientHeight-72)/vb.height)));
  render(); canvasWrap.scrollTop=0; canvasWrap.scrollLeft=Math.max(0,(canvasWrap.scrollWidth-canvasWrap.clientWidth)/2);
});
document.getElementById('btnPanelToggle').addEventListener('click',e=>{
  const wa=document.getElementById('workArea'); const hidden=wa.classList.toggle('panel-hidden');
  e.currentTarget.classList.toggle('active',!hidden); if(!hidden) renderPropPanel(true); requestAnimationFrame(drawRulers);
});

/* ---------- atalhos extras ---------- */
window.addEventListener('keydown',e=>{
  if(isTextEditingTarget(e.target)) return;
  if(document.getElementById('appModalBackdrop').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='d'){ e.preventDefault(); document.getElementById('btnDuplicate').click(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(k==='v'){ mode='select'; pendingConnectFrom=null; hideHint(); render(); }
  else if(k==='c'){ mode='connect'; pendingConnectFrom=null; showHint('Clique na caixa de origem, depois na caixa de destino.'); render(); }
  else if(e.key==='F2'){ e.preventDefault(); document.getElementById('btnEditText').click(); }
});

/* ---------- menu Manutenção ---------- */
document.getElementById('btnMaintToggle').addEventListener('click',e=>{
  e.stopPropagation(); const m=document.getElementById('maintDropdown'); const was=m.classList.contains('open'); closeDropdown(); if(!was) m.classList.add('open');
});
document.addEventListener('click',()=>document.getElementById('maintDropdown').classList.remove('open'));
function maintModal(title,html,actions){
  const msg=document.getElementById('appModalMsg'), act=document.getElementById('appModalActions');
  msg.innerHTML=`<div style="font-weight:600;font-size:14px;margin-bottom:6px">${title}</div>${html}`;
  act.innerHTML='';
  (actions||[]).forEach(([label,fn,primary])=>{const b=document.createElement('button');b.textContent=label;b.className=primary?'btn-primary':'btn-outline';b.onclick=()=>{if(fn)fn();else closeAppModal();};act.appendChild(b);});
  document.getElementById('appModalBackdrop').classList.add('show');
}
async function waitForEngine(maxMs){
  const t0=Date.now();
  while(Date.now()-t0<maxMs){
    try{ const r=await fetch('/health?t='+Date.now(),{cache:'no-store'}); if(r.ok) return await r.json(); }catch(_){}
    await new Promise(r=>setTimeout(r,600));
  }
  return null;
}
document.getElementById('mntClear').addEventListener('click',()=>{
  document.getElementById('maintDropdown').classList.remove('open');
  const dirty=isDiagramDirty();
  maintModal('Limpar cache e reiniciar',
    `<div style="color:var(--text-2);font-size:12.5px">${dirty?'<b style="color:var(--rust)">Este fluxo tem alterações não salvas. Salve antes de continuar.</b><br><br>':''}O editor vai:</div>
     <ul class="steps" id="mntSteps"><li><span class="ck"></span>Fechar o Word oculto usado pelo editor</li><li><span class="ck"></span>Apagar sessões temporárias e versões antigas</li><li><span class="ck"></span>Reiniciar o motor e recarregar a tela</li></ul>`,
    [['Cancelar'],['Limpar agora',runClear,true]]);
  async function runClear(){
    const lis=[...document.querySelectorAll('#mntSteps li')];
    document.getElementById('appModalActions').innerHTML='';
    try{
      const r=await fetch('/api/maintenance/clear-cache',{method:'POST'});
      const data=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
      lis[0]&&lis[0].classList.add('done'); lis[1]&&lis[1].classList.add('done');
      try{ sessionStorage.clear(); }catch(_){}
      try{ localStorage.clear(); }catch(_){}
      try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(_){}
      await new Promise(r=>setTimeout(r,1200));
      const h=await waitForEngine(30000);
      if(!h) throw new Error('O motor não voltou a responder. Feche e abra o editor de novo.');
      lis[2]&&lis[2].classList.add('done');
      window.__sgqSkipUnloadPrompt=true;
      setTimeout(()=>location.replace('/?r='+Date.now()),500);
    }catch(err){
      maintModal('Não foi possível limpar o cache',`<div style="color:var(--text-2);font-size:12.5px">${String(err.message||err)}</div>`,[['Fechar']]);
    }
  }
});
document.getElementById('mntWord').addEventListener('click',async()=>{
  document.getElementById('maintDropdown').classList.remove('open');
  try{
    const r=await fetch('/api/maintenance/kill-hidden-word',{method:'POST'}); const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Falha');
    showHint(d.killed?`${d.killed} processo(s) do Word oculto encerrado(s).`:'Nenhum Word oculto encontrado.'); setTimeout(hideHint,2800);
  }catch(err){ showAlert('Não foi possível fechar o Word oculto: '+(err.message||err)); }
});
document.getElementById('mntAbout').addEventListener('click',async()=>{
  document.getElementById('maintDropdown').classList.remove('open');
  const h=await waitForEngine(1500);
  maintModal('SGQ Editor de Fluxogramas',
    `<div style="color:var(--text-2);font-size:12.5px;line-height:1.7">Versão do editor: <b>${APP_VERSION}</b><br>Motor: ${h?(h.version||'?')+' · '+(h.mode||''):'<span style="color:var(--rust)">sem resposta</span>'}<br>Mantém todas as correções da V2.5 (motor V51).</div>`,
    [['Fechar',null,true]]);
});
let engineOk=true;
async function heartbeat(){
  let ok=false;
  try{ const r=await fetch('/api/heartbeat',{method:'POST',cache:'no-store'}); ok=r.ok; }catch(_){ ok=false; }
  if(ok!==engineOk){ engineOk=ok; const e=document.getElementById('engineInfo'); e.classList.toggle('off',!ok); e.querySelector('span').textContent=ok?'Motor conectado':'Motor desconectado'; }
}
if(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)){ heartbeat(); setInterval(heartbeat,20000); }
else { const e=document.getElementById('engineInfo'); e.classList.add('off'); e.querySelector('span').textContent='Modo navegador (sem Word)'; }
document.getElementById('mntVersion').textContent='Versão '+APP_VERSION;

diagram = blankDiagram();
render();
markSaved();
loadFromQueryParam();
