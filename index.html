<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGQ Editor de Fluxogramas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --ink:#0B4A44; --ink-deep:#062E2A; --steel:#2F6E67; --amber:#00A29B; --moss:#3F7A56; --rust:#A8402E;
    --teal-soft:#E6F4F2; --teal-text:#0B4A44;
    --text:#2F3433; --text-2:#68706E; --text-3:#9AA19F;
    --paper:#F5F6F4; --panel:#FFFFFF; --panel-2:#FAFBFA; --line:#E7E9E6; --line-2:#D9DDD9;
    --hover:rgba(11,74,68,.055); --press:rgba(11,74,68,.1);
    --font-display:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
    --font-body:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--panel);color:var(--text);font-family:var(--font-body);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{display:grid;grid-template-rows:46px 40px minmax(0,1fr) 26px;height:100vh;}
  button{font-family:var(--font-body);cursor:pointer;border:none;border-radius:6px;font-weight:500;background:none;color:inherit;transition:background .12s ease,color .12s ease;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  /* ===== TOPO ===== */
  .topbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-top:3px solid var(--ink);border-bottom:1px solid var(--line);min-width:0;}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;}
  .brand .mark{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;background:var(--ink);color:#fff;padding:3px 7px;border-radius:4px;font-weight:500;flex:none;}
  .title-input{font-family:var(--font-display);font-weight:600;font-size:14.5px;background:transparent;border:none;color:var(--text);padding:5px 7px;border-radius:6px;min-width:120px;width:340px;max-width:40vw;}
  .title-input:hover{background:var(--hover);}
  .title-input:focus{background:var(--panel-2);outline:none;box-shadow:0 0 0 1px var(--line-2);}
  .save-state{font-size:12px;color:var(--text-3);white-space:nowrap;}
  .save-state.dirty{color:var(--rust);}
  .topbar-actions{display:flex;gap:2px;align-items:center;flex:none;}
  .btn-ghost{background:transparent;color:var(--text-2);padding:6px 10px;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .btn-ghost:hover{background:var(--hover);color:var(--text);}
  .btn-primary{background:var(--ink);color:#fff;padding:7px 14px;font-size:12.5px;margin-left:6px;}
  .btn-primary:hover{background:var(--ink-deep);}
  .top-sep{width:1px;height:18px;background:var(--line-2);margin:0 6px;}
  .dropdown{position:relative;display:inline-block;}
  .dropdown-menu{display:none;position:absolute;right:0;top:calc(100% + 5px);background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 10px 28px rgba(6,46,42,.12),0 1px 3px rgba(6,46,42,.06);min-width:220px;z-index:40;padding:4px;}
  .dropdown.open .dropdown-menu{display:block;}
  .dropdown-menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#fff;color:var(--text);border:none;padding:7px 9px;font-size:12.5px;font-weight:400;border-radius:5px;}
  .dropdown-menu button:hover{background:var(--hover);}
  .dropdown-menu hr{border:0;border-top:1px solid var(--line);margin:4px 3px;}
  .dropdown-menu .menu-note{font-size:11px;color:var(--text-3);padding:5px 9px 3px;}
  .word-context-badge{font-size:11.5px;background:var(--teal-soft);color:var(--teal-text);padding:4px 9px;border-radius:5px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none;margin-right:4px;}

  /* ===== FERRAMENTAS ===== */
  .toolbar{display:flex;align-items:center;gap:1px;padding:0 10px;background:var(--panel-2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
  .toolbar::-webkit-scrollbar{display:none;}
  .tool-group{display:flex;gap:1px;align-items:center;flex:none;}
  .tool-sep{width:1px;height:18px;background:var(--line-2);margin:0 7px;flex:none;}
  .tbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--text-2);padding:5px 8px;font-size:12px;white-space:nowrap;flex:none;}
  .tbtn svg{width:16px;height:16px;}
  .tbtn:hover{background:var(--hover);color:var(--text);}
  .tbtn.active{background:var(--teal-soft);color:var(--teal-text);}
  .tbtn:disabled{opacity:.35;cursor:default;background:none;}
  .tbtn.icon-only{padding:5px 6px;}
  .zoom-lbl{font-family:var(--font-mono);font-size:11.5px;min-width:44px;justify-content:center;}
  .sel-info{margin-left:auto;padding-left:14px;font-size:11.5px;color:var(--text-3);white-space:nowrap;flex:none;max-width:320px;overflow:hidden;text-overflow:ellipsis;}

  /* ===== ÁREA DE TRABALHO ===== */
  .work{display:grid;grid-template-columns:minmax(0,1fr) 256px;min-height:0;}
  .work.panel-hidden{grid-template-columns:minmax(0,1fr) 0;}
  .stage{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:22px minmax(0,1fr);min-height:0;min-width:0;}
  .ruler-corner{background:var(--panel-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  canvas.ruler{display:block;background:var(--panel-2);}
  #rulerX{width:100%;height:22px;border-bottom:1px solid var(--line);}
  #rulerY{width:22px;height:100%;border-right:1px solid var(--line);}
  .canvas-wrap{position:relative;overflow:auto;background:var(--paper);
    background-image:radial-gradient(circle,#DCE1DE 1px,transparent 1.2px);background-size:24px 24px;}
  svg#board{display:block;background:#fff;cursor:default;margin:28px auto 40px;box-shadow:0 0 0 1px var(--line-2),0 2px 10px rgba(6,46,42,.05);}
  svg#board.mode-place{cursor:crosshair;}
  svg#board.mode-connect{cursor:alias;}

  /* ===== PAINEL DE PROPRIEDADES ===== */
  .props{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;min-width:0;}
  .props h3{margin:0;font-size:13px;font-weight:600;color:var(--text);}
  .props .p-sub{font-size:11.5px;color:var(--text-3);margin:3px 0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-grp{padding:13px 0;border-top:1px solid var(--line);}
  .p-grp:first-of-type{border-top:0;padding-top:2px;}
  .p-lbl{font-size:11.5px;color:var(--text-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .p-lbl em{font-style:normal;font-family:var(--font-mono);color:var(--text-3);font-size:11px;}
  .sw{display:flex;flex-wrap:wrap;gap:7px;}
  .sw button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.14);padding:0;}
  .sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--amber);}
  .sw label{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:13px;cursor:pointer;position:relative;overflow:hidden;}
  .sw label input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .seg{display:flex;background:rgba(11,74,68,.06);border-radius:7px;padding:2px;gap:2px;}
  .seg button{flex:1;padding:5px 6px;font-size:11.5px;color:var(--text-2);font-weight:500;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:4px;}
  .seg button:hover{color:var(--text);}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(6,46,42,.12);}
  .xy{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .xy label{display:flex;align-items:center;gap:6px;background:rgba(11,74,68,.05);border-radius:6px;padding:0 8px;font:500 10.5px var(--font-mono);color:var(--text-3);}
  .xy input{width:100%;min-width:0;border:0;background:none;color:var(--text);font:12px var(--font-mono);padding:6px 0;}
  .xy input:focus{outline:none;}
  .xy label:focus-within{box-shadow:0 0 0 1px var(--amber);}
  .p-field{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font:12.5px var(--font-body);padding:7px 9px;resize:vertical;}
  .p-field:focus{outline:none;border-color:var(--amber);}
  .p-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);padding:7px;font-size:12px;color:var(--text-2);background:#fff;}
  .p-btn:hover{background:var(--hover);color:var(--text);}
  .p-btn.danger{color:var(--rust);}
  .p-btn + .p-btn{margin-top:6px;}
  .p-toggle{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0;cursor:pointer;color:var(--text);}
  .tg{width:28px;height:16px;border-radius:9px;background:var(--line-2);position:relative;flex:none;transition:background .12s;}
  .tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .12s;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .tg.on{background:var(--amber);}
  .tg.on::after{left:14px;}
  .p-hint{font-size:11.5px;color:var(--text-3);line-height:1.5;margin-top:7px;}
  .kbd{font:500 10.5px var(--font-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--text-2);background:#fff;}
  .theme-btn{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:7px 9px;font-size:12px;color:var(--text);background:#fff;font-weight:400;}
  .theme-btn + .theme-btn{margin-top:6px;}
  .theme-btn:hover{background:var(--hover);}
  .theme-dots{display:flex;gap:3px;}
  .theme-dots i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12);}
  .align-row{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;}
  .align-row button{padding:6px 0;color:var(--text-2);display:flex;justify-content:center;border-radius:5px;background:rgba(11,74,68,.05);}
  .align-row button:hover{background:var(--press);color:var(--text);}
  .shortcuts .kbd{justify-self:start;}
  .shortcuts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:11.5px;color:var(--text-2);align-items:center;}

  /* ===== STATUS (estilo CAD) ===== */
  .statusbar{display:flex;align-items:center;gap:3px;padding:0 10px;background:var(--panel-2);border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;}
  .coord{font:11.5px var(--font-mono);min-width:150px;color:var(--text-2);}
  .st-btn{padding:2px 8px;font:500 10.5px var(--font-mono);letter-spacing:.04em;color:var(--text-3);border-radius:4px;}
  .st-btn:hover{background:var(--hover);color:var(--text-2);}
  .st-btn.active{color:var(--teal-text);background:var(--teal-soft);}
  .st-spacer{flex:1;}
  .engine{display:inline-flex;align-items:center;gap:6px;margin-left:14px;}
  .engine i{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;}
  .engine.off i{background:var(--rust);}

  /* ===== EDITOR E AVISOS ===== */
  .inline-editor{position:fixed;z-index:60;font-family:var(--font-body);font-size:13px;color:var(--ink);text-align:center;
    border:2px solid var(--amber);border-radius:5px;background:#fff;resize:none;padding:4px;outline:none;box-shadow:0 6px 18px rgba(6,46,42,.14);}
  .hint-bar{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--ink-deep);color:#fff;
    padding:8px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 22px rgba(6,46,42,.22);z-index:30;display:none;max-width:80vw;}
  .hint-bar.show{display:block;}
  input[type=file]{display:none;}
  .app-modal-backdrop{position:fixed;inset:0;background:rgba(6,46,42,.28);display:none;align-items:center;justify-content:center;z-index:100;}
  .app-modal-backdrop.show{display:flex;}
  .app-modal-box{background:#fff;border-radius:10px;padding:20px 22px;width:400px;max-width:92vw;box-shadow:0 18px 48px rgba(6,46,42,.22);}
  .app-modal-msg{font-size:13.5px;color:var(--text);line-height:1.55;margin-bottom:18px;}
  .app-modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .app-modal-actions button{padding:7px 14px;font-size:12.5px;border-radius:6px;}
  .btn-outline{background:#fff;border:1px solid var(--line)!important;color:var(--text)!important;}
  .btn-outline:hover{background:var(--hover)!important;}
  .flow-picker-list{display:grid;gap:6px;max-height:55vh;overflow:auto;margin-top:12px;}
  .flow-picker-item{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font-weight:400;}
  .flow-picker-item:hover{border-color:var(--line-2);background:var(--hover);}
  .flow-picker-item strong{display:block;font-size:13px;color:var(--text);margin-bottom:3px;font-weight:600;}
  .flow-picker-item span{font-size:11.5px;color:var(--text-3);}
  .steps{margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;}
  .steps li{display:flex;gap:9px;align-items:center;padding:4px 0;color:var(--text-3);}
  .steps li.done{color:var(--text);}
  .steps li .ck{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;}
  .steps li.done .ck{background:var(--amber);border-color:var(--amber);}
  @media (max-width:1100px){.tbtn span{display:none;}.tbtn{padding:5px 6px;}}
  @media (max-width:900px){.work{grid-template-columns:minmax(0,1fr) 0;}.props{display:none;}}
  @media print{
    .topbar,.toolbar,.statusbar,.props,.ruler-corner,canvas.ruler{display:none!important;}
    .app{display:block;height:auto;}.stage{display:block;}.canvas-wrap{overflow:visible;background:#fff;}
    svg#board{box-shadow:none;margin:0;}body{overflow:visible;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="mark">SGQ</span>
      <input class="title-input" id="diagramTitle" value="Novo Fluxo de Processo" aria-label="Título do fluxo">
      <span class="save-state" id="saveState">Salvo</span>
    </div>
    <div class="topbar-actions">
      <span class="word-context-badge" id="wordContextBadge"></span>
      <button class="btn-ghost" id="btnExample">Carregar exemplo</button>
      <button class="btn-ghost" id="btnNewDiagram">Novo</button>
      <button class="btn-ghost" id="btnImport">Importar</button>
      <input type="file" id="fileImport" accept="application/json,.json,.doc,.docx">
      <div class="dropdown" id="exportDropdown">
        <button class="btn-ghost" id="btnExportToggle">Exportar <svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="dropdown-menu">
          <button id="expPng">Imagem PNG</button>
          <button id="expJpg">Imagem JPG</button>
          <button id="expSvg">Vetor SVG</button>
          <button id="expJson">Arquivo do fluxo (.json)</button>
          <hr>
          <button id="expPrint">Imprimir ou PDF</button>
        </div>
      </div>
      <button class="btn-ghost" id="btnWordFlows" style="display:none">Fluxogramas</button>
      <button class="btn-ghost" id="btnExportWord" style="display:none">Exportar Word</button>
      <span class="top-sep"></span>
      <div class="dropdown" id="maintDropdown">
        <button class="btn-ghost" id="btnMaintToggle" title="Manutenção"><svg class="i" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Manutenção</button>
        <div class="dropdown-menu">
          <button id="mntClear"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>Limpar cache e reiniciar</button>
          <button id="mntWord"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Fechar Word oculto</button>
          <hr>
          <button id="mntAbout"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>Sobre esta versão</button>
          <div class="menu-note" id="mntVersion">Versão 3.0</div>
        </div>
      </div>
      <button class="btn-primary" id="btnSave">Salvar (.json)</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="tool-group">
      <button class="tbtn active" data-mode="select" title="Selecionar (V)"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span>Selecionar</span></button>
      <button class="tbtn" data-mode="connect" title="Conectar duas caixas com seta (C)"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h14M13 7l5 5-5 5"/></svg><span>Conectar</span></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <button class="tbtn" data-place="oval" title="Início / Fim"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5"/></svg><span>Início/Fim</span></button>
      <button class="tbtn" data-place="rect" title="Etapa do processo"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="17" height="11" rx="2"/></svg><span>Processo</span></button>
      <button class="tbtn" data-place="diamond" title="Decisão"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg><span>Decisão</span></button>
      <button class="tbtn" data-place="text" title="Texto livre / nota"><svg class="i" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg><span>Texto</span></button>
      <button class="tbtn" id="btnAddLane" title="Adicionar coluna (papel / responsável)"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M9.5 4.5v15M14.5 4.5v15"/></svg><span>Coluna</span></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <button class="tbtn" id="btnEditText" title="Editar texto do item selecionado (F2)"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span>Editar</span></button>
      <button class="tbtn" id="btnDuplicate" title="Duplicar item selecionado (Ctrl+D)"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>Duplicar</span></button>
      <button class="tbtn" id="btnDelete" title="Excluir item selecionado (Delete)"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Excluir</span></button>
    </div>
    <div class="tool-group" id="shapeTypeGroup" style="display:none;">
      <span class="tool-sep"></span>
      <button class="tbtn" id="btnTypeOval" title="Trocar para Início/Fim (oval)" data-shapetype="oval"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5"/></svg><span>Oval</span></button>
      <button class="tbtn" id="btnTypeRect" title="Trocar para Processo (retângulo)" data-shapetype="rect"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="17" height="11" rx="2"/></svg><span>Retângulo</span></button>
      <button class="tbtn" id="btnTypeDiamond" title="Trocar para Decisão (losango)" data-shapetype="diamond"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg><span>Losango</span></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <button class="tbtn" id="btnUndo" title="Desfazer (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Desfazer</span></button>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const COLORS = {
  ink:'#0B4A44', steel:'#2F6E67', amber:'#00A29B', moss:'#3F7A56', rust:'#A8402E',
  laneA:'#FBFCFC', laneB:'#F4F8F7', laneHeader:'#E6F1EF', laneHeaderText:'#0B4A44', line:'#D6E2DF',
  ovalFill:'#E3F5F3', diamondFill:'#DFF4F2', rectFill:'#FFFFFF'
};

let diagram = null;
let mode = 'select'; // select | place-<type> | connect
let selection = null; // {type:'element'|'connector', id} — the "primary" item
let selectedIds = new Set(); // ids of elements included in a multi-selection (always includes selection.id when it's an element)
let suppressNextClick = false;
let pendingConnectFrom = null;
let autoLinkEnabled = true;
let lastCreatedId = null;
let refImage = null; // {dataUrl, x, y, w, h, opacity, unlocked}
let snapEnabled = true;
const GRID = 20;
let nodeMap = {};
let zoom = 1;
let undoStack = [], redoStack = [];
let lastSavedJson = null;
let lastTap = {key:null, time:0};
// Área de transferência interna do editor: copia caixas + ligações entre elas sem
// depender da permissão de clipboard do navegador. Ctrl+C/Ctrl+V continuam
// funcionando normalmente dentro dos campos de texto.
let flowClipboard = null; // {elements, connectors, pasteCount}
let currentWordContext = null; // contexto do fluxograma ativo
let wordDocumentState = null; // {packageData,file,fileHandle,flows,activeIndex}
let pendingWordFileHandle = null;

const board = document.getElementById('board');
const canvasWrap = document.getElementById('canvasWrap');
const VBW = 1500, VBH = 1200;
// Mantém o foco do teclado no quadro após clicar em uma figura. Isso evita que
// atalhos como Ctrl+C/Ctrl+V fiquem presos em algum campo usado antes da importação.
board.setAttribute('tabindex','0');
board.style.outline='none';
function focusBoardForShortcuts(){
  try{ board.focus({preventScroll:true}); }catch(_){ try{ board.focus(); }catch(__){} }
}

function snap(v){ return snapEnabled ? Math.round(v/GRID)*GRID : v; }
function isDoubleTap(key){
  const now = Date.now();
  const wasDouble = (lastTap.key===key) && (now-lastTap.time < 400);
  lastTap = {key, time: wasDouble ? 0 : now};
  return wasDouble;
}
function markSaved(){ lastSavedJson = JSON.stringify(diagram); }

function blankDiagram(){
  return {
    lanes: [ {id:'l'+Date.now(), title:'RESPONSÁVEL', width:1400} ],
    elements: [],
    connectors: []
  };
}

function uid(p){ return p+Math.random().toString(36).slice(2,8); }

/* ---------- history ---------- */
function snapshot(){
  undoStack.push(JSON.stringify(diagram));
  if(undoStack.length>60) undoStack.shift();
  redoStack = [];
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(diagram));
  diagram = JSON.parse(undoStack.pop());
  selection = null; selectedIds = new Set();
  render();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(diagram));
  diagram = JSON.parse(redoStack.pop());
  selection = null; selectedIds = new Set();
  render();
}

/* ---------- geometry ---------- */
function laneX(index){
  let x = 30;
  for(let i=0;i<index;i++) x += diagram.lanes[i].width;
  return x;
}
function totalLaneWidth(){ return diagram.lanes.reduce((a,l)=>a+l.width,0)+60; }

function boundaryPoint(shape, dx, dy){
  const cx = shape.x+shape.w/2, cy = shape.y+shape.h/2;
  if(dx===0 && dy===0) return {x:cx,y:cy};
  let t;
  if(shape.type==='oval'){
    const rx=shape.w/2, ry=shape.h/2;
    t = 1/Math.sqrt((dx/rx)*(dx/rx)+(dy/ry)*(dy/ry));
  } else if(shape.type==='diamond'){
    const hw=shape.w/2, hh=shape.h/2;
    t = 1/((Math.abs(dx)/hw)+(Math.abs(dy)/hh));
  } else {
    const hw=shape.w/2, hh=shape.h/2;
    const tx = dx!==0 ? hw/Math.abs(dx) : Infinity;
    const ty = dy!==0 ? hh/Math.abs(dy) : Infinity;
    t = Math.min(tx,ty);
  }
  return {x:cx+dx*t, y:cy+dy*t};
}

function getElement(id){ return diagram.elements.find(e=>e.id===id); }
function getConnector(id){ return diagram.connectors.find(c=>c.id===id); }

function boundaryPointAtX(shape, x, towardY){
  const cx=shape.x+shape.w/2, cy=shape.y+shape.h/2;
  const hw=Math.max(.001,shape.w/2), hh=Math.max(.001,shape.h/2);
  const clampedX=Math.max(shape.x,Math.min(shape.x+shape.w,x));
  const dir=towardY>=cy?1:-1;
  if(shape.type==='oval'){
    const nx=Math.max(-1,Math.min(1,(clampedX-cx)/hw));
    return {x:clampedX,y:cy+dir*hh*Math.sqrt(Math.max(0,1-nx*nx))};
  }
  if(shape.type==='diamond'){
    const yoff=hh*Math.max(0,1-Math.abs(clampedX-cx)/hw);
    return {x:clampedX,y:cy+dir*yoff};
  }
  return {x:clampedX,y:dir>0?shape.y+shape.h:shape.y};
}

function boundaryPointAtY(shape, y, towardX){
  const cx=shape.x+shape.w/2, cy=shape.y+shape.h/2;
  const hw=Math.max(.001,shape.w/2), hh=Math.max(.001,shape.h/2);
  const clampedY=Math.max(shape.y,Math.min(shape.y+shape.h,y));
  const dir=towardX>=cx?1:-1;
  if(shape.type==='oval'){
    const ny=Math.max(-1,Math.min(1,(clampedY-cy)/hh));
    return {x:cx+dir*hw*Math.sqrt(Math.max(0,1-ny*ny)),y:clampedY};
  }
  if(shape.type==='diamond'){
    const xoff=hw*Math.max(0,1-Math.abs(clampedY-cy)/hh);
    return {x:cx+dir*xoff,y:clampedY};
  }
  return {x:dir>0?shape.x+shape.w:shape.x,y:clampedY};
}

function orthogonalPath(from, to){
  const sx=from.x+from.w/2, sy=from.y+from.h/2;
  const tx=to.x+to.w/2, ty=to.y+to.h/2;
  const dx = tx-sx, dy = ty-sy;
  const ALIGN_TOL = 24;

  // Ao mover uma figura, se as duas formas continuam praticamente alinhadas,
  // usa uma única linha reta dentro da área de sobreposição. Assim o conector
  // não cria aquele pequeno "degrau"/ângulo só porque os centros diferem alguns px.
  if(Math.abs(dy) >= Math.abs(dx)){
    const overlapL=Math.max(from.x,to.x), overlapR=Math.min(from.x+from.w,to.x+to.w);
    const closeEnough=Math.abs(dx)<=Math.min(from.w,to.w)*0.38;
    if(overlapR-overlapL>=12 && closeEnough){
      const x=Math.max(overlapL+4,Math.min(overlapR-4,(sx+tx)/2));
      return [boundaryPointAtX(from,x,ty),boundaryPointAtX(to,x,sy)];
    }
  }else{
    const overlapT=Math.max(from.y,to.y), overlapB=Math.min(from.y+from.h,to.y+to.h);
    const closeEnough=Math.abs(dy)<=Math.min(from.h,to.h)*0.38;
    if(overlapB-overlapT>=12 && closeEnough){
      const y=Math.max(overlapT+4,Math.min(overlapB-4,(sy+ty)/2));
      return [boundaryPointAtY(from,y,tx),boundaryPointAtY(to,y,sx)];
    }
  }

  let exit, entry, mid1, mid2;
  if(Math.abs(dy) >= Math.abs(dx)){
    const dir = dy>=0 ? 1 : -1;
    exit = boundaryPoint(from, 0, dir);
    entry = boundaryPoint(to, 0, -dir);
    if(Math.abs(exit.x-entry.x) < ALIGN_TOL) entry.x = exit.x;
    const midY = (exit.y+entry.y)/2;
    mid1 = {x:exit.x, y:midY};
    mid2 = {x:entry.x, y:midY};
  } else {
    const dir = dx>=0 ? 1 : -1;
    exit = boundaryPoint(from, dir, 0);
    entry = boundaryPoint(to, -dir, 0);
    if(Math.abs(exit.y-entry.y) < ALIGN_TOL) entry.y = exit.y;
    const midX = (exit.x+entry.x)/2;
    mid1 = {x:midX, y:exit.y};
    mid2 = {x:midX, y:entry.y};
  }
  return [exit, mid1, mid2, entry];
}

function dominantAxis(a,b){
  return Math.abs((b.x||0)-(a.x||0)) >= Math.abs((b.y||0)-(a.y||0)) ? 'h' : 'v';
}

function axisBoundaryPoint(shape, axis, toward){
  const cx=shape.x+shape.w/2, cy=shape.y+shape.h/2;
  if(axis==='v') return boundaryPoint(shape, 0, (toward.y>=cy)?1:-1);
  return boundaryPoint(shape, (toward.x>=cx)?1:-1, 0);
}

function compactOrthogonalPoints(pts){
  const out=[];
  for(const p of pts){
    if(!out.length || Math.abs(out[out.length-1].x-p.x)>.2 || Math.abs(out[out.length-1].y-p.y)>.2) out.push({x:p.x,y:p.y});
  }
  let changed=true;
  while(changed && out.length>2){
    changed=false;
    for(let i=1;i<out.length-1;i++){
      const a=out[i-1],b=out[i],c=out[i+1];
      const sameX=Math.abs(a.x-b.x)<.2 && Math.abs(b.x-c.x)<.2;
      const sameY=Math.abs(a.y-b.y)<.2 && Math.abs(b.y-c.y)<.2;
      if(sameX||sameY){ out.splice(i,1); changed=true; break; }
    }
  }
  return out;
}

/* ---------- V3: portas por lado e rotas ajustáveis ----------
   Campos opcionais no conector (compatíveis com arquivos antigos):
   fromSide/toSide: 'top'|'bottom'|'left'|'right'  — lado escolhido pelo usuário
   fromT/toT: 0..1 — posição da porta ao longo do lado
   manual: true — a rota em c.points foi ajustada à mão e não é recalculada
   dash: true — linha tracejada
   Conectores sem esses campos seguem exatamente o comportamento da V2.5. */
const SIDE_DIR={top:{x:0,y:-1},bottom:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const PORT_STUB=18;
function isVerticalSide(side){ return side==='top'||side==='bottom'; }
function autoSidesFor(a,b){
  const ac={x:a.x+a.w/2,y:a.y+a.h/2}, bc={x:b.x+b.w/2,y:b.y+b.h/2};
  const dx=bc.x-ac.x, dy=bc.y-ac.y;
  if(Math.abs(dy)>=Math.abs(dx)) return dy>=0?['bottom','top']:['top','bottom'];
  return dx>=0?['right','left']:['left','right'];
}
function hasFixedRoute(c){ return Array.isArray(c.points) && c.points.length>=2; }
function rankedSides(a,b){
  const dx=(b.x+b.w/2)-(a.x+a.w/2), dy=(b.y+b.h/2)-(a.y+a.h/2), L=Math.hypot(dx,dy)||1;
  return [['right',dx/L],['left',-dx/L],['bottom',dy/L],['top',-dy/L]].sort((p,q)=>q[1]-p[1]);
}
function isAutoEnd(c,end){ return !c[end==='from'?'fromSide':'toSide'] && !c.native && !hasFixedRoute(c); }
// Losangos e ovais têm um único ponto bom por lado: se o lado preferido já estiver
// ocupado por outra seta, a seguinte usa o segundo melhor lado livre.
function roundShapeSide(shape,c,end){
  const used=new Set(), ends=[];
  diagram.connectors.forEach(o=>{
    ['from','to'].forEach(e=>{
      if(o[e]!==shape.id) return;
      const k=e==='from'?'fromSide':'toSide';
      if(o[k]) { used.add(o[k]); return; }
      if(!isAutoEnd(o,e)) return;
      const other=getElement(e==='from'?o.to:o.from); if(!other) return;
      const r=rankedSides(shape,other);
      ends.push({o,e,r,strength:r[0][1]-r[1][1]});
    });
  });
  ends.sort((p,q)=>q.strength-p.strength);
  for(const it of ends){
    let side=it.r[0][0];
    if(used.has(side) && it.r[1][1]>-0.2 && !used.has(it.r[1][0])) side=it.r[1][0];
    used.add(side);
    if(it.o===c && it.e===end) return side;
  }
  return null;
}
function effectiveSide(c,end){
  const key=end==='from'?'fromSide':'toSide';
  if(c[key]) return c[key];
  if(c.native || hasFixedRoute(c)) return null;
  const a=getElement(c.from), b=getElement(c.to);
  if(!a||!b) return null;
  const shape=end==='from'?a:b;
  if(shape.type==='diamond'||shape.type==='oval'){ const s=roundShapeSide(shape,c,end); if(s) return s; }
  const s=autoSidesFor(a,b);
  return end==='from'?s[0]:s[1];
}
function sideUsersOf(shapeId,side){
  if(!side) return [];
  const list=[];
  diagram.connectors.forEach(c=>{
    if(c.from===shapeId && effectiveSide(c,'from')===side) list.push({c,end:'from'});
    if(c.to===shapeId && effectiveSide(c,'to')===side) list.push({c,end:'to'});
  });
  const key=u=>{const o=getElement(u.end==='from'?u.c.to:u.c.from);if(!o)return 0;return isVerticalSide(side)?o.x+o.w/2:o.y+o.h/2;};
  return list.sort((p,q)=>key(p)-key(q));
}
function sidePort(shape,side,t){
  t=Math.max(0,Math.min(1,t));
  if(isVerticalSide(side)){
    const x=shape.x+shape.w*t;
    return boundaryPointAtX(shape,x,side==='top'?shape.y-1e5:shape.y+shape.h+1e5);
  }
  const y=shape.y+shape.h*t;
  return boundaryPointAtY(shape,y,side==='left'?shape.x-1e5:shape.x+shape.w+1e5);
}
function portFor(c,end){
  const shape=getElement(end==='from'?c.from:c.to);
  const side=effectiveSide(c,end);
  const tKey=end==='from'?'fromT':'toT';
  if(typeof c[tKey]==='number') return sidePort(shape,side,c[tKey]);
  const users=sideUsersOf(shape.id,side);
  const n=users.length, idx=Math.max(0,users.findIndex(u=>u.c===c&&u.end===end));
  let t=.5;
  if(n>1){
    // Losango/oval: saem do mesmo vértice e se separam logo depois (como no SmartDraw).
    if(shape.type==='oval'||shape.type==='diamond') t=.5;
    else t=(idx+1)/(n+1);
  }
  return sidePort(shape,side,t);
}
function routeBetween(s,side1,e,side2,elbowAtStart){
  const d1=SIDE_DIR[side1]||{x:0,y:1}, d2=SIDE_DIR[side2]||{x:0,y:-1};
  const p1={x:s.x+d1.x*PORT_STUB,y:s.y+d1.y*PORT_STUB}, p2={x:e.x+d2.x*PORT_STUB,y:e.y+d2.y*PORT_STUB};
  const v1=d1.x===0, v2=d2.x===0, mid=[];
  if(v1&&v2){
    if(Math.abs(s.x-e.x)<1) return compactOrthogonalPoints([s,e]);
    if(elbowAtStart){ mid.push({x:p2.x,y:p1.y}); return compactOrthogonalPoints([s,p1,...mid,p2,e]); }
    const y=(side1==='bottom'&&p2.y>p1.y)||(side1==='top'&&p2.y<p1.y)?(p1.y+p2.y)/2:(side1==='bottom'?Math.max(p1.y,p2.y):Math.min(p1.y,p2.y));
    mid.push({x:p1.x,y},{x:p2.x,y});
  }else if(!v1&&!v2){
    if(Math.abs(s.y-e.y)<1) return compactOrthogonalPoints([s,e]);
    if(elbowAtStart){ mid.push({x:p1.x,y:p2.y}); return compactOrthogonalPoints([s,p1,...mid,p2,e]); }
    const x=(side1==='right'&&p2.x>p1.x)||(side1==='left'&&p2.x<p1.x)?(p1.x+p2.x)/2:(side1==='right'?Math.max(p1.x,p2.x):Math.min(p1.x,p2.x));
    mid.push({x,y:p1.y},{x,y:p2.y});
  }else if(v1){ mid.push({x:p1.x,y:p2.y}); }
  else { mid.push({x:p2.x,y:p1.y}); }
  return compactOrthogonalPoints([s,p1,...mid,p2,e]);
}
function manualRoutePoints(c){
  const s=portFor(c,'from'), e=portFor(c,'to');
  const p=c.points.map(q=>({x:+q.x,y:+q.y}));
  p[0]=s; p[p.length-1]=e;
  if(p.length===2){
    if(Math.abs(s.x-e.x)>.5 && Math.abs(s.y-e.y)>.5) return routeBetween(s,c.fromSide,e,c.toSide);
    return [s,e];
  }
  if(isVerticalSide(c.fromSide)) p[1].x=s.x; else p[1].y=s.y;
  if(isVerticalSide(c.toSide)) p[p.length-2].x=e.x; else p[p.length-2].y=e.y;
  return compactOrthogonalPoints(p);
}
function connectorPoints(c){
  const from=getElement(c.from), to=getElement(c.to);
  if(!from || !to) return [];
  if(c.manual && hasFixedRoute(c) && c.fromSide && c.toSide) return manualRoutePoints(c);
  if(c.fromSide && c.toSide) return routeBetween(portFor(c,'from'),c.fromSide,portFor(c,'to'),c.toSide);
  if(!c.native && !hasFixedRoute(c)){
    const fs=effectiveSide(c,'from'), ts=effectiveSide(c,'to');
    const auto=autoSidesFor(from,to);
    const sharedFrom=sideUsersOf(from.id,fs).length>1, sharedTo=sideUsersOf(to.id,ts).length>1;
    if(fs!==auto[0] || ts!==auto[1] || sharedFrom || sharedTo){
      const s=portFor(c,'from'); let e=portFor(c,'to');
      // Alinha em linha reta quando a saída cai dentro da altura/largura do destino.
      const opp={left:'right',right:'left',top:'bottom',bottom:'top'};
      if(ts===opp[fs] && (to.type==='rect'||to.type==='text') && !sharedTo){
        if(!isVerticalSide(fs) && s.y>=to.y+6 && s.y<=to.y+to.h-6) e={x:ts==='left'?to.x:to.x+to.w,y:s.y};
        if(isVerticalSide(fs) && s.x>=to.x+6 && s.x<=to.x+to.w-6) e={x:s.x,y:ts==='top'?to.y:to.y+to.h};
      }
      const round=from.type==='diamond'||from.type==='oval';
      return routeBetween(s,fs,e,ts,round&&sharedFrom);
    }
  }
  return connectorPointsLegacy(c);
}
// Lado e posição de uma ponta a partir da rota visível (usado ao converter para rota manual).
function sideFromRoute(shape,pts,end){
  const a=end==='from'?pts[0]:pts[pts.length-1];
  const b=end==='from'?pts[1]:pts[pts.length-2];
  let side=null;
  if(b && Math.abs(a.x-b.x)<.5 && Math.abs(a.y-b.y)>.5){

function startSegmentDrag(ev,c,segIndex){

function defaultLabelPos(c,pts,noAvoid){
  if(!pts||pts.length<2) return {x:0,y:0,anchor:'middle'};
  let i=0; while(i<pts.length-2 && Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y)<=PORT_STUB+1) i++;
  const a=pts[i], b=pts[i+1], len=Math.hypot(b.x-a.x,b.y-a.y);
  if(Math.abs(a.x-b.x)<.5) return {x:a.x+8,y:a.y+(b.y>a.y?1:-1)*Math.min(30,Math.max(12,len/2)),anchor:'start'};
  const above={x:a.x+(b.x>a.x?1:-1)*Math.min(34,Math.max(14,len/2)),y:a.y-9,anchor:'middle'};
  if(noAvoid) return above;
  // Evita encostar no rótulo de outra seta que sai da mesma caixa.
  const clash=diagram.connectors.some(o=>{
    if(o===c||!o.label||o.from!==c.from||o.labelPos||o.labelStyle==='box') return false;
    const op=defaultLabelPos(o,connectorPoints(o),true);
    return Math.abs(op.x-above.x)<48 && Math.abs(op.y-above.y)<26;
  });

}

function connectorPointsLegacy(c){
  const from=getElement(c.from), to=getElement(c.to);
  if(!from || !to) return [];
  if(!Array.isArray(c.points) || c.points.length<2) return orthogonalPath(from,to);

  const raw=c.points.map(p=>({x:+p.x,y:+p.y}));
  if(c.native&&c.fromPort&&c.toPort){
    const start={x:from.x+from.w*c.fromPort.x,y:from.y+from.h*c.fromPort.y};
    const end={x:to.x+to.w*c.toPort.x,y:to.y+to.h*c.toPort.y};
    if(raw.length>2&&c.fromPort.x===c.toPort.x&&(c.fromPort.x===0||c.fromPort.x===1)&&c.fromPort.y>0&&c.fromPort.y<1&&c.toPort.y>0&&c.toPort.y<1){
      const xs=raw.map(p=>p.x).concat(start.x,end.x);
      const x=c.fromPort.x===1?Math.max(...xs):Math.min(...xs);
      return compactOrthogonalPoints([start,{x,y:start.y},{x,y:end.y},end]);
    }
    if(raw.length===2){if(Math.abs(start.x-end.x)<.5||Math.abs(start.y-end.y)<.5)return[start,end];
      if(Math.abs(raw[0].x-raw[1].x)<Math.abs(raw[0].y-raw[1].y)){const y=(start.y+end.y)/2;return[start,{x:start.x,y},{x:end.x,y},end];}
      const x=(start.x+end.x)/2;return[start,{x,y:start.y},{x,y:end.y},end];}
    const firstV=Math.abs(raw[1].x-raw[0].x)<Math.abs(raw[1].y-raw[0].y);
    const lastV=Math.abs(raw.at(-1).x-raw.at(-2).x)<Math.abs(raw.at(-1).y-raw.at(-2).y);
    raw[0]=start;raw[raw.length-1]=end;
    if(firstV)raw[1].x=start.x;else raw[1].y=start.y;
    if(lastV)raw[raw.length-2].x=end.x;else raw[raw.length-2].y=end.y;
    return compactOrthogonalPoints(raw);
  }
  const fc={x:from.x+from.w/2,y:from.y+from.h/2};
  const tc={x:to.x+to.w/2,y:to.y+to.h/2};
  const firstAxis=dominantAxis(raw[0],raw[1]);
  const lastAxis=dominantAxis(raw[raw.length-2],raw[raw.length-1]);
  const start=axisBoundaryPoint(from,firstAxis,raw[1]);
  const end=axisBoundaryPoint(to,lastAxis,raw[raw.length-2]);

  // If the original connector is essentially straight and the symbols are aligned,
  // keep it truly straight instead of preserving tiny imported offsets.
  if(firstAxis==='v' && lastAxis==='v' && Math.abs(fc.x-tc.x)<=16){
    const maxDev=Math.max(...raw.map(p=>Math.abs(p.x-(fc.x+tc.x)/2)));
    if(maxDev<=34) return compactOrthogonalPoints([start,end]);
  }
  if(firstAxis==='h' && lastAxis==='h' && Math.abs(fc.y-tc.y)<=16){
    const maxDev=Math.max(...raw.map(p=>Math.abs(p.y-(fc.y+tc.y)/2)));
    if(maxDev<=34) return compactOrthogonalPoints([start,end]);
  }

  // Rebuild the imported route as a Manhattan path. This preserves the original
  // direction/bends but guarantees every visible segment is exactly horizontal or vertical.
  const out=[start];
  let cur=start;
  for(let i=1;i<raw.length-1;i++){
    const target=raw[i];
    const axis=dominantAxis(raw[i-1],raw[i]);
    const next=axis==='v' ? {x:cur.x,y:target.y} : {x:target.x,y:cur.y};
    if(Math.abs(next.x-cur.x)>.2 || Math.abs(next.y-cur.y)>.2){ out.push(next); cur=next; }
  }
  if(lastAxis==='v'){
    const pre={x:end.x,y:cur.y};
    if(Math.abs(pre.x-cur.x)>.2 || Math.abs(pre.y-cur.y)>.2){ out.push(pre); cur=pre; }
  }else{
    const pre={x:cur.x,y:end.y};
    if(Math.abs(pre.x-cur.x)>.2 || Math.abs(pre.y-cur.y)>.2){ out.push(pre); cur=pre; }
  }
  out.push(end);
  return compactOrthogonalPoints(out);
}

function rerouteConnectorsAfterShapeMove(movedIds, startPos){
  const moved=new Set(movedIds||[]);
  diagram.connectors.forEach(c=>{
    const fromMoved=moved.has(c.from), toMoved=moved.has(c.to);
    if(!fromMoved && !toMoved) return;

    // Se as duas pontas foram arrastadas juntas, preserva o desenho original da seta
    // deslocando seus pontos pela mesma distância. Se só uma ponta mudou, abandona
    // a rota fixa importada para que ela seja recalculada limpa, sem pequenos ângulos.
    if(fromMoved && toMoved && Array.isArray(c.points) && c.points.length>=2){
      const from=getElement(c.from), to=getElement(c.to);
      const sf=startPos&&startPos[c.from], st=startPos&&startPos[c.to];
      if(from&&to&&sf&&st){
        const dfx=from.x-sf.x, dfy=from.y-sf.y, dtx=to.x-st.x, dty=to.y-st.y;
        if(Math.abs(dfx-dtx)<.5 && Math.abs(dfy-dty)<.5){
          c.points=c.points.map(p=>({x:+p.x+dfx,y:+p.y+dfy}));
          return;
        }
      }
    }
    // V3: rota ajustada à mão é mantida; só as pontas acompanham a caixa.
    if(c.manual) return;
    if(Array.isArray(c.points)) delete c.points;
  });

const CENTER_ALIGN_TOL = 14;
function magneticPositionForShape(shape, proposedX, proposedY, movingIds){
  let x=snap(proposedX), y=snap(proposedY);
  if(movingIds && movingIds.size>1) return {x,y};

  let cx=x+shape.w/2, cy=y+shape.h/2;
  const candidates=[];
  diagram.connectors.forEach(c=>{
    if(c.from===shape.id){ const t=getElement(c.to); if(t && !(movingIds&&movingIds.has(t.id))) candidates.push(t); }
    if(c.to===shape.id){ const f=getElement(c.from); if(f && !(movingIds&&movingIds.has(f.id))) candidates.push(f); }
  });

  let bestDx=CENTER_ALIGN_TOL+1, bestDy=CENTER_ALIGN_TOL+1, snapCx=null, snapCy=null;
  candidates.forEach(t=>{
    const tx=t.x+t.w/2, ty=t.y+t.h/2;
    const dx=Math.abs(cx-tx), dy=Math.abs(cy-ty);
    if(dx<bestDx && dx<=CENTER_ALIGN_TOL){ bestDx=dx; snapCx=tx; }
    if(dy<bestDy && dy<=CENTER_ALIGN_TOL){ bestDy=dy; snapCy=ty; }
  });

  // Imported connectors may contain a fixed bend. Snap to that bend too, so a user can
  // easily restore a perfectly straight first/last segment after editing a symbol.
  diagram.connectors.forEach(c=>{
    if(!Array.isArray(c.points)||c.points.length<2) return;
    if(c.from===shape.id){
      const axis=dominantAxis(c.points[0],c.points[1]), p=c.points[1];
      if(axis==='v' && Math.abs(cx-p.x)<=CENTER_ALIGN_TOL){ snapCx=p.x; }
      if(axis==='h' && Math.abs(cy-p.y)<=CENTER_ALIGN_TOL){ snapCy=p.y; }
    }else if(c.to===shape.id){
      const n=c.points.length, axis=dominantAxis(c.points[n-2],c.points[n-1]), p=c.points[n-2];
      if(axis==='v' && Math.abs(cx-p.x)<=CENTER_ALIGN_TOL){ snapCx=p.x; }
      if(axis==='h' && Math.abs(cy-p.y)<=CENTER_ALIGN_TOL){ snapCy=p.y; }
    }
  });

  if(snapCx!==null) x=snapCx-shape.w/2;
  if(snapCy!==null) y=snapCy-shape.h/2;
  return {x,y};
}

function polylineMidpoint(pts){
  if(!pts || pts.length<2) return {x:0,y:0};
  let total=0, lens=[];
  for(let i=0;i<pts.length-1;i++){
    const l=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);
    lens.push(l); total+=l;
  }
  if(total<=0) return {x:pts[0].x,y:pts[0].y};
  let target=total/2, acc=0;
  for(let i=0;i<lens.length;i++){
    if(acc+lens[i]>=target){
      const t=(target-acc)/(lens[i]||1);
      return {x:pts[i].x+(pts[i+1].x-pts[i].x)*t,y:pts[i].y+(pts[i+1].y-pts[i].y)*t};
    }
    acc+=lens[i];
  }
  return {x:pts[pts.length-1].x,y:pts[pts.length-1].y};
}
function pointSegmentDistance(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
  if(l2<=1e-9) return Math.hypot(p.x-a.x,p.y-a.y);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
}
function pointPolylineDistance(p,pts){
  if(!pts||pts.length<2)return Infinity;
  let best=Infinity;for(let i=0;i<pts.length-1;i++)best=Math.min(best,pointSegmentDistance(p,pts[i],pts[i+1]));
  return best;
}

/* ---------- coordinate helpers (mouse + touch) ---------- */
function clientXY(evt){
  if(evt.touches && evt.touches.length) return {clientX:evt.touches[0].clientX, clientY:evt.touches[0].clientY};
  if(evt.changedTouches && evt.changedTouches.length) return {clientX:evt.changedTouches[0].clientX, clientY:evt.changedTouches[0].clientY};
  return {clientX:evt.clientX, clientY:evt.clientY};

function toSvgPoint(evt){

}
function svgToScreen(x,y){

}
function bindDragStart(el, handler){

/* ---------- SVG element factory ---------- */
function el(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function wrapText(text, maxCharsPerLine){
  const words = (text||'').split(/\s+/);
  const lines = []; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length > maxCharsPerLine && cur){ lines.push(cur.trim()); cur=w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur);
  return lines;
}

// Quebra de texto adaptativa: preserva o tamanho/posição original da forma.
// Em vez de aumentar a caixa e deslocar o fluxo, reduz a fonte até o texto caber.
function shapeTextLayout(shape){
  const text=(shape.text||'').trim();
  const isRef=/^\d+$/.test(text) && shape.w<120 && shape.h<120;
  const widthFactor = shape.type==='diamond' ? 0.50 : shape.type==='oval' ? 0.72 : shape.type==='text' ? 0.94 : 0.86;
  const heightFactor = shape.type==='diamond' ? 0.54 : shape.type==='oval' ? 0.70 : 0.82;
  let fontSize=shape.fontSize||(isRef ? 13 : 12.5);
  const minFont=shape.fontSize?shape.fontSize*.55:(isRef ? 11.5 : 7.8);
  let best=null;
  while(fontSize>=minFont-0.01){
    const charPx=Math.max(4.1,fontSize*0.53);
    const maxChars=Math.max(5,Math.floor((shape.w*widthFactor)/charPx));
    const lines=wrapText(text,maxChars);
    const lineH=Math.max(9.6,fontSize*1.18);
    const usableH=Math.max(16,shape.h*heightFactor);
    best={fontSize,lineH,lines,maxChars};
    if(lines.length*lineH<=usableH) break;
    fontSize-=0.45;
  }
  return best||{fontSize:10,lineH:12,lines:[text],maxChars:20};
}

function laneBounds(index){
  let x=30;
  for(let i=0;i<index;i++) x+=diagram.lanes[i].width;
  return {x0:x,x1:x+diagram.lanes[index].width,width:diagram.lanes[index].width};
}
function laneIndexForElement(e){
  const cx=e.x+e.w/2;
  let x=30;
  for(let i=0;i<diagram.lanes.length;i++){
    const x1=x+diagram.lanes[i].width;
    if(cx>=x && cx<=x1) return i;
    x=x1;
  }
  return Math.max(0,diagram.lanes.length-1);
}

// Pós-processamento conservador: NÃO reorganiza, NÃO empurra e NÃO redimensiona o fluxo.
// Apenas garante que referências numéricas 1/2/3 permaneçam círculos perfeitos.
function postProcessImportedLayout(){
  if(!diagram || !diagram.elements) return;
  diagram.elements.forEach(e=>{
    const txt=(e.text||'').trim();
    if(/^\d+$/.test(txt) && e.w<125 && e.h<125){
      const cx=e.x+e.w/2, cy=e.y+e.h/2;
      const d=Math.max(48,Math.min(78,Math.round((e.w+e.h)/2)));
      e.type='oval'; e.w=d; e.h=d; e.x=Math.round(cx-d/2); e.y=Math.round(cy-d/2);
      e._referenceCircle=true;
    }
  });

  // A prioridade é fidelidade geométrica ao SmartDraw original; espaçamento só muda
  // quando o usuário editar/mover os elementos manualmente.
}
function fitImportedFlowView(){
  if(!diagram||!diagram.elements||!diagram.elements.length)return;
  // Ajuste apenas visual: privilegia a largura disponível para o fluxograma abrir
  // maior e centralizado. Fluxos altos continuam com rolagem vertical, sem alterar
  // nenhuma coordenada, dimensão, ligação ou ordem do desenho importado.
  const boardW=Math.max(VBW,totalLaneWidth()+40);
  const availW=Math.max(760,(canvasWrap&&canvasWrap.clientWidth?canvasWrap.clientWidth:1450)-64);
  const fit=Math.min(1,availW/Math.max(1,boardW));
  zoom=Math.max(.35,Math.min(1,fit));
  requestAnimationFrame(()=>{
    canvasWrap.scrollTop=0;
    const renderedW=board.getBoundingClientRect().width;
    canvasWrap.scrollLeft=Math.max(0,(renderedW-canvasWrap.clientWidth)/2);
  });
}


/* ---------- render ---------- */
function reportRuntimeError(err){
  console.error('Erro interno:', err);
}
function render(){
  try{
    while(board.childNodes.length>1) board.removeChild(board.lastChild); // keep defs
    nodeMap = {};

    const w = Math.max(VBW, totalLaneWidth()+40);
    let maxY = VBH;
    diagram.elements.forEach(e=>{ maxY = Math.max(maxY, e.y+e.h+80); });
    board.setAttribute('viewBox', `0 0 ${w} ${maxY}`);
    board.style.width = (w*zoom)+'px';
    board.style.height = (maxY*zoom)+'px';

    renderGrid(w, maxY);
    renderLanes();
    renderRefImage();
    renderConnectors();
    renderElements();
    renderConnectorHandles();
    updateSelInfo();
    board.className = mode.startsWith('place') ? 'mode-place' : mode==='connect' ? 'mode-connect' : '';
    document.querySelectorAll('.tbtn[data-mode]').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
    document.querySelectorAll('.tbtn[data-place]').forEach(b=>b.classList.toggle('active', mode==='place-'+b.dataset.place));
    afterRenderHooks();
  }catch(err){
    reportRuntimeError(err);
  }
}

function renderRefImage(){
  if(!refImage) return;
  const img = el('image', {
    id:'refImageNode', x:refImage.x, y:refImage.y, width:refImage.w, height:refImage.h,
    href:refImage.dataUrl, opacity:refImage.opacity, preserveAspectRatio:'none'
  });
  img.setAttributeNS('http://www.w3.org/1999/xlink','href', refImage.dataUrl);
  board.appendChild(img);
  if(refImage.unlocked){
    const border = el('rect', {x:refImage.x, y:refImage.y, width:refImage.w, height:refImage.h, fill:'none', stroke:COLORS.amber, 'stroke-width':2, 'stroke-dasharray':'8,5'});
    board.appendChild(border);
    bindDragStart(img, startRefDrag);
    bindDragStart(border, startRefDrag);
    const handle = el('rect', {x:refImage.x+refImage.w-10, y:refImage.y+refImage.h-10, width:18, height:18, fill:COLORS.amber, stroke:'#fff', 'stroke-width':1.5, style:'cursor:nwse-resize; touch-action:none;'});
    bindDragStart(handle, startRefResize);
    board.appendChild(handle);
  } else {
    img.setAttribute('style','pointer-events:none;');
  }
}

function startRefDrag(ev){
  ev.stopPropagation();
  const start = toSvgPoint(ev);
  const x0 = refImage.x, y0 = refImage.y;
  function move(e2){
    const p = toSvgPoint(e2);
    refImage.x = x0 + (p.x-start.x);
    refImage.y = y0 + (p.y-start.y);
    render();
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}
function startRefResize(ev){
  ev.stopPropagation();
  const start = toSvgPoint(ev);
  const w0=refImage.w, h0=refImage.h;
  function move(e2){
    const p = toSvgPoint(e2);
    refImage.w = Math.max(60, w0+(p.x-start.x));
    refImage.h = Math.max(60, h0+(p.y-start.y));
    render();
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}

function renderGrid(w, maxY){
  if(!snapEnabled) return;
  board.appendChild(el('rect', {id:'gridBgNode', x:0, y:0, width:w, height:maxY, fill:'url(#gridPattern)', style:'pointer-events:none;'}));
}

function renderLanes(){
  let x = 30;
  const maxY = parseFloat(board.getAttribute('viewBox').split(' ')[3]);

  // Fluxos que não possuem raias/responsáveis no Word não devem ganhar
  // colunas artificiais no editor. Mantemos somente uma área neutra.
  if(diagram.hideLaneHeaders){
    const total=Math.max(1400, diagram.lanes.reduce((a,l)=>a+(+l.width||0),0));
    const g=el('g',{class:'lane-layer'});
    g.appendChild(el('rect',{x:30,y:20,width:total,height:maxY-40,fill:'#FFFFFF',stroke:'none',class:'lane-bg'}));
    board.appendChild(g);
    return;
  }

  diagram.lanes.forEach((lane, i)=>{
    const g = el('g', {class:'lane-layer'});
    const bg = el('rect', {x, y:20, width:lane.width, height:maxY-40, fill: i%2? COLORS.laneB : COLORS.laneA, stroke:COLORS.line, class:'lane-bg'});
    g.appendChild(bg);
    const header = el('rect', {x, y:20, width:lane.width, height:46, fill:COLORS.laneHeader, class:'lane-bg', style:'cursor:text;'});
    header.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); editLaneTitle(lane); });
    header.addEventListener('mousedown', (ev)=>{ if(isDoubleTap('lane:'+lane.id)){ ev.stopPropagation(); editLaneTitle(lane); } });
    header.addEventListener('touchstart', (ev)=>{ if(isDoubleTap('lane:'+lane.id)){ ev.stopPropagation(); editLaneTitle(lane); } });
    g.appendChild(header);
    const label = el('text', {x:x+lane.width/2, y:48, 'text-anchor':'middle', fill:COLORS.laneHeaderText, 'font-family':"'IBM Plex Sans', sans-serif", 'font-weight':'600', 'font-size':'13.5', style:'letter-spacing:.03em; cursor:text; pointer-events:none;'});
    label.textContent = lane.title;
    g.appendChild(label);

    const editX = diagram.lanes.length>1 ? x+lane.width-34 : x+lane.width-16;
    const editIcon = el('text', {x:editX, y:34, 'text-anchor':'middle', fill:'#2F6E67', 'font-family':'IBM Plex Mono, monospace', 'font-size':'13', style:'cursor:pointer;', class:'lane-ui-control'});
    editIcon.textContent = '✎';
    editIcon.addEventListener('click', (ev)=>{ ev.stopPropagation(); editLaneTitle(lane); });
    g.appendChild(editIcon);

    if(diagram.lanes.length>1){
      const rm = el('text', {x:x+lane.width-14, y:34, 'text-anchor':'middle', fill:'#2F6E67', 'font-family':'IBM Plex Mono, monospace', 'font-size':'13', style:'cursor:pointer;', class:'lane-ui-control'});
      rm.textContent = '✕';
      rm.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        showConfirm('Remover a coluna "'+lane.title+'"?', ()=>{
          snapshot();
          diagram.lanes = diagram.lanes.filter(l=>l.id!==lane.id);
          render();
        });
      });
      g.appendChild(rm);
    }

    const handle = el('rect', {x:x+lane.width-5, y:20, width:10, height:maxY-40, fill:'transparent', style:'cursor:col-resize; touch-action:none;'});
    bindDragStart(handle, (ev)=>startLaneResize(ev, lane));
    g.appendChild(handle);
    const grip = el('rect', {x:x+lane.width-2, y:20, width:2, height:46, fill:'rgba(11,74,68,.18)', style:'pointer-events:none;', class:'lane-ui-control'});
    g.appendChild(grip);

    board.appendChild(g);
    x += lane.width;
  });
}

function startLaneResize(ev, lane){
  ev.stopPropagation();
  snapshot();
  const startX = toSvgPoint(ev).x;
  const w0 = lane.width;
  function move(e2){
    try{
      const p = toSvgPoint(e2);
      lane.width = Math.max(140, w0 + (p.x-startX));
      render();
    }catch(err){ reportRuntimeError(err); }
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}

function startConnectorLabelDrag(ev, c){
  ev.stopPropagation();
  if(mode!=='select') return;

  const pts = connectorPoints(c);
  if(!pts.length) return;
  let initial;
  if(c.labelPos) initial={x:+c.labelPos.x,y:+c.labelPos.y};
  else if(c.labelStyle==='box') initial=polylineMidpoint(pts);
  else { const dp=defaultLabelPos(c,pts); initial={x:dp.x,y:dp.y}; c.labelAnchor=dp.anchor; }
  const start = toSvgPoint(ev);
  let moved = false;

  snapshot();
  selection={type:'connector', id:c.id};
  selectedIds = new Set();

  function move(e2){
    try{
      if(e2.cancelable) e2.preventDefault();
      const p = toSvgPoint(e2);
      let nx = initial.x + (p.x-start.x);
      let ny = initial.y + (p.y-start.y);

      // Rótulos podem ser posicionados livremente; com Grade ligada, só usamos
      // um encaixe suave de 5 px para facilitar alinhamento sem "pular" 20 px.
      if(snapEnabled){ nx=Math.round(nx/5)*5; ny=Math.round(ny/5)*5; }
      c.labelPos={x:nx,y:ny};
      moved = moved || Math.abs(nx-initial.x)>.5 || Math.abs(ny-initial.y)>.5;
      render();
    }catch(err){ reportRuntimeError(err); }
  }
  function up(){
    unbindMove(move); unbindUp(up);
    if(!moved){
      undoStack.pop();
      selection={type:'connector', id:c.id};
      selectedIds=new Set();
      render();
    }
  }
  bindMove(move);
  bindUp(up);
}

function connectorLastRealSegment(pts){
  if(!pts || pts.length<2) return null;
  let bi=pts.length-1, ai=bi-1;
  while(ai>=0 && Math.hypot(pts[bi].x-pts[ai].x,pts[bi].y-pts[ai].y)<0.5) ai--;
  if(ai<0) return null;
  const a=pts[ai], b=pts[bi];
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  if(len<1) return null;
  return {a,b,dx,dy,len,ux:dx/len,uy:dy/len};
}

function expectedTargetAnchor(c,to,end){
  if(/^(T|B|L|R)$/.test(c._targetAnchor||'')) return c._targetAnchor;
  const sides=[
    {anchor:'T',d:Math.abs(end.y-to.y)},
    {anchor:'B',d:Math.abs(end.y-(to.y+to.h))},
    {anchor:'L',d:Math.abs(end.x-to.x)},
    {anchor:'R',d:Math.abs(end.x-(to.x+to.w))}
  ].sort((a,b)=>a.d-b.d);
  return sides[0] && sides[0].d<=4 ? sides[0].anchor : null;
}


function segmentArrowSpec(seg,sizePad=0){
  if(!seg || seg.len<14) return null;
  const preferredSize=(sizePad||0)?11.5:10.5;
  const minSize=6.5;
  // V43: a ponta fica próxima da forma de DESTINO, como no SmartDraw original.
  // Antes ela era desenhada a ~58% do segmento, o que dava a impressão de setas
  // no meio da linha e dificultava perceber o sentido correto.
  const endPad=4.5;
  const startPad=8;
  const available=seg.len-startPad-endPad;
  if(available<minSize+2) return null;
  const size=Math.max(minSize,Math.min(preferredSize,available*0.44));
  const half=size*0.43;
  const t=Math.max(startPad+size*0.7, seg.len-endPad);
  const apex={x:seg.a.x+seg.ux*t,y:seg.a.y+seg.uy*t};
  const bx=apex.x-seg.ux*size, by=apex.y-seg.uy*size;
  const px=-seg.uy, py=seg.ux;
  const v1={x:bx+px*half,y:by+py*half};
  const v2={x:bx-px*half,y:by-py*half};
  return {apex,v1,v2,size};
}
function pointInsideElement(p,e,pad=0.5){
  return p.x>e.x-pad && p.x<e.x+e.w+pad && p.y>e.y-pad && p.y<e.y+e.h+pad;
}
function triangleInsideAnyShape(spec,ignoreIds=[]){
  const pts=[spec.apex,spec.v1,spec.v2];
  return diagram.elements.some(e=>e.type!=='text'&&!ignoreIds.includes(e.id)&&pts.some(p=>pointInsideElement(p,e,0.5)));
}
function safeArrowSpec(c,pts,selected=false){
  const from=getElement(c.from), to=getElement(c.to);
  const raw=(pts||[]).map(p=>({x:+p.x,y:+p.y}));
  if(raw.length<2) return null;
  const segs=[];
  for(let i=0;i<raw.length-1;i++){
    const a=raw[i], b=raw[i+1];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
    if(len<8) continue;
    const ux=dx/len, uy=dy/len;
    const axis=(Math.abs(dx)>=Math.abs(dy))?'h':'v';
    segs.push({a,b,dx,dy,len,ux,uy,axis,index:i});
  }
  if(!segs.length) return null;
  // Prefere o último segmento; se ele não for seguro, recua um segmento.
  const candidates=[];
  for(let i=segs.length-1;i>=0;i--) candidates.push(segs[i]);
  for(const seg of candidates){
    const spec=segmentArrowSpec(seg,selected?1:0);
    if(!spec) continue;
    // Nunca permitir seta dentro da forma de origem/destino ou de qualquer outra forma.
    if(triangleInsideAnyShape(spec,[from&&from.id,to&&to.id].filter(Boolean))) continue;
    if(from && [spec.apex,spec.v1,spec.v2].some(p=>pointInsideElement(p,from,1))) continue;
    if(to && [spec.apex,spec.v1,spec.v2].some(p=>pointInsideElement(p,to,1))) continue;
    // Garantia extra: só aceita seta se o centro estiver claramente no trecho livre da ligação.
    const mid={x:(spec.apex.x+(spec.v1.x+spec.v2.x)/2)/2,y:(spec.apex.y+(spec.v1.y+spec.v2.y)/2)/2};
    if(from && pointInsideElement(mid,from,2)) continue;
    if(to && pointInsideElement(mid,to,2)) continue;
    return spec;
  }
  return null;
}

function arrowVisiblePoints(c,pts,selected=false){
  return (pts||[]).map(p=>({x:+p.x,y:+p.y}));
}

function appendConnectorArrowHead(c,pts,color,selected=false){
  if(c.native){
    const draw=(points)=>{const tip=points.at(-1),prev=points.at(-2);if(!tip||!prev)return;const len=Math.hypot(tip.x-prev.x,tip.y-prev.y);if(len<.1)return;
      const dx=(tip.x-prev.x)/len,dy=(tip.y-prev.y)/len,l=Math.min(c.arrowSize||16,len*.85),w=c.arrowWidth||6;
      const p=[tip,{x:tip.x-dx*l-dy*w,y:tip.y-dy*l+dx*w},{x:tip.x-dx*l*.66,y:tip.y-dy*l*.66},{x:tip.x-dx*l+dy*w,y:tip.y-dy*l-dx*w}];
      board.appendChild(el('polygon',{points:p.map(p=>p.x+','+p.y).join(' '),fill:color,style:'pointer-events:none;'}));};
    if(c.arrowEnd!==false)draw(pts);if(c.arrowStart)draw(pts.slice().reverse());return true;
  }
  const spec=safeArrowSpec(c,pts,selected);
  if(!spec) return false;
  const points=[
    `${spec.apex.x},${spec.apex.y}`,
    `${spec.v1.x},${spec.v1.y}`,
    `${spec.v2.x},${spec.v2.y}`
  ].join(' ');
  board.appendChild(el('polygon',{points,fill:color,stroke:color,'stroke-width':0.75,style:'pointer-events:none;'}));
  return true;
}

function renderConnectors(){
  diagram.connectors.forEach(c=>{
    const from = getElement(c.from), to = getElement(c.to);
    if(!from || !to) return;
    const pts = connectorPoints(c);
    const isSel = selection && selection.type==='connector' && selection.id===c.id;
    const visiblePts = c.native?pts:arrowVisiblePoints(c,pts,isSel);
    const ptStr = visiblePts.map(p=>p.x+','+p.y).join(' ');

    const hit = el('polyline', {points:ptStr, fill:'none', stroke:'transparent', 'stroke-width':16, style:'cursor:pointer; touch-action:none;'});
    const connClick = (ev)=>{
      ev.stopPropagation();
      if(mode!=='select') return;
      if(isDoubleTap('c:'+c.id)){ editConnectorLabel(c); return; }
      if(isSel && (ev.type==='mousedown'||ev.type==='touchstart')){ startSegmentDrag(ev,c,null); return; }
      selection={type:'connector', id:c.id}; selectedIds = new Set(); render();
    };
    hit.addEventListener('mousedown', connClick);
    hit.addEventListener('touchstart', connClick);
    hit.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); editConnectorLabel(c); });
    board.appendChild(hit);

    const connectorColor=c.stroke||COLORS.steel;
    if(isSel) board.appendChild(el('polyline',{points:ptStr,fill:'none',stroke:COLORS.amber,'stroke-opacity':.22,'stroke-width':11,'stroke-linejoin':'round','stroke-linecap':'round',class:'lane-ui-control',style:'pointer-events:none;'}));
    const lineW=+(c.strokeWidth||1.8);
    const line = el('polyline', {points:ptStr, fill:'none', stroke:connectorColor, 'stroke-width':lineW, 'stroke-linejoin':'round'});
    if(c.dash) line.setAttribute('stroke-dasharray', (lineW*4.5)+','+(lineW*3.2));
    board.appendChild(line);
    appendConnectorArrowHead(c,pts,connectorColor,isSel);
    if(isSel) pendingConnectorHandles.push({c,pts:visiblePts});

    if(c.label){
      const boxed=c.labelStyle==='box';
      const dp=boxed?null:defaultLabelPos(c,pts);
      const mp=c.labelPos?{x:+c.labelPos.x,y:+c.labelPos.y}:(boxed?polylineMidpoint(pts):dp);
      const mx=mp.x, my=mp.y;
      const lg = el('g', {style:'cursor:move; touch-action:none;'});
      if(boxed){
        // Estilo antigo (caixinha sobre a linha), disponível como opção no painel.
        const padW = Math.max(30, c.label.length*7+12);
        lg.appendChild(el('rect', {x:mx-padW/2, y:my-11, width:padW, height:22, fill:'#fff', stroke:isSel?COLORS.amber:COLORS.line, 'stroke-width':isSel?1.6:1, rx:3}));
        const t = el('text', {x:mx, y:my+4, 'text-anchor':'middle', 'font-family':'IBM Plex Mono, monospace', 'font-size':'11', 'font-weight':'600',
          fill: c.label.toUpperCase()==='SIM' ? COLORS.moss : c.label.toUpperCase()==='NÃO'||c.label.toUpperCase()==='NAO' ? COLORS.rust : COLORS.ink,
          style:'pointer-events:none; user-select:none;'});
        t.textContent = c.label; lg.appendChild(t);
      }else{
        // V3: rótulo limpo ao lado da linha, sem caixa, com contorno branco para não brigar com a seta.
        const anchor=c.labelPos?(c.labelAnchor||'middle'):dp.anchor;
        const fs=+(c.labelFontSize||12);
        const tw=Math.max(14,c.label.length*fs*.62);
        const rx0=anchor==='start'?mx-3:anchor==='end'?mx-tw-3:mx-tw/2-3;
        lg.appendChild(el('rect',{x:rx0,y:my-fs*.8,width:tw+6,height:fs*1.6,fill:'transparent',stroke:isSel?COLORS.amber:'none','stroke-width':1,'stroke-dasharray':'3,3',rx:3,class:'lane-ui-control'}));
        const t=el('text',{x:mx,y:my+fs*.36,'text-anchor':anchor,'font-family':'IBM Plex Sans, Segoe UI, sans-serif','font-size':fs,'font-weight':'600',
          fill:c.labelColor||COLORS.ink,stroke:'#fff','stroke-width':4,'stroke-linejoin':'round','paint-order':'stroke',style:'pointer-events:none; user-select:none; letter-spacing:.02em;'});
        t.textContent=c.label; lg.appendChild(t);
      }
      bindDragStart(lg, (ev)=>startConnectorLabelDrag(ev,c));
      lg.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); editConnectorLabel(c); });
      board.appendChild(lg);
    }
  });
}

function renderElements(){
  diagram.elements.forEach(shape=>{
    const g = el('g', {'data-shape-id':shape.id});
    const isSel = selectedIds.has(shape.id);
    const isPendingSource = pendingConnectFrom===shape.id;
    const strokeColor = isPendingSource ? COLORS.amber : (shape.stroke||COLORS.ink);
    const strokeW = isPendingSource ? 3 : (shape.strokeWidth||1.6);
    const dash = isPendingSource ? '6,3' : null;

    let shapeNode;
    if(shape.type==='oval'){
      shapeNode = el('ellipse', {cx:shape.x+shape.w/2, cy:shape.y+shape.h/2, rx:shape.w/2, ry:shape.h/2, fill:shape.fill||COLORS.ovalFill, stroke:strokeColor, 'stroke-width':strokeW});
    } else if(shape.type==='diamond'){
      const {x,y,w,h} = shape;
      const pts = `${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`;
      shapeNode = el('polygon', {points:pts, fill:shape.fill||COLORS.diamondFill, stroke:strokeColor, 'stroke-width':strokeW});
    } else if(shape.type==='text'){
      shapeNode = el('rect', {x:shape.x, y:shape.y, width:shape.w, height:shape.h, fill:'transparent', stroke: (isSel||isPendingSource) ? COLORS.amber : 'transparent', 'stroke-dasharray':'4,3', 'stroke-width':strokeW});
    } else {
      shapeNode = el('rect', {x:shape.x, y:shape.y, width:shape.w, height:shape.h, rx:shape.cornerRadius??(shape.rounded?10:3), fill:shape.fill||COLORS.rectFill, stroke:strokeColor, 'stroke-width':strokeW});
    }
    if(dash) shapeNode.setAttribute('stroke-dasharray', dash);
    g.appendChild(shapeNode);

    const canonicalVisualText=(shape.text||'').replace(/\s+/g,' ').trim();
    const nativeRunsVisualText=(shape.textRuns||[]).map(r=>r.text||'').join('').replace(/\s+/g,' ').trim();
    const canUseNativeRuns=shape.textRuns&&shape.text===shape.nativeText&&nativeRunsVisualText===canonicalVisualText;
    if(canUseNativeRuns){
      // Mantém posição, fonte e linhas recuperadas do Word. Alguns arquivos do
      // SmartDraw dividem uma frase em vários runs e deixam o espaço no fim de um run.
      // Em SVG, esse espaço no fim de um <text> separado pode desaparecer visualmente.
      // Unimos SOMENTE runs vizinhos da mesma linha/estilo quando existe espaço na
      // fronteira, sem alterar o texto real nem qualquer dado usado na exportação.
      const visualRuns=[];
      shape.textRuns.forEach(r=>{
        const cur={...r};
        const prev=visualRuns[visualRuns.length-1];
        const sameLine=prev && Math.abs((cur.y-prev.y)*shape.h)<=Math.max(2,(cur.fontSize||12)*0.28);
        const sameStyle=prev && (prev.fontFamily||'')===(cur.fontFamily||'') && Math.abs((prev.fontSize||0)-(cur.fontSize||0))<0.15 && String(prev.fontWeight||'')===String(cur.fontWeight||'');
        const spacedBoundary=prev && (/\s$/.test(prev.text||'') || /^\s/.test(cur.text||''));
        if(sameLine && sameStyle && spacedBoundary){
          prev.text=(prev.text||'')+(cur.text||'');
          prev.width=Math.max(prev.width||0,(cur.x+(cur.width||0))-prev.x);
        }else visualRuns.push(cur);
      });
      visualRuns.forEach(r=>{const attrs={x:shape.x+r.x*shape.w,y:shape.y+r.y*shape.h,'font-family':r.fontFamily,'font-size':r.fontSize,'font-weight':r.fontWeight,fill:shape.textColor||'#000'};
        const t=el('text',attrs);t.setAttribute('xml:space','preserve');t.textContent=r.text;g.appendChild(t);
      });
    }else{
    const tm = shapeTextLayout(shape);
    const lines = tm.lines;
    const lineH = tm.lineH;
    const startY = shape.y+shape.h/2 - (lines.length-1)*lineH/2 + tm.fontSize*0.32;
    lines.forEach((ln,i)=>{
      const t = el('text', {x:shape.x+shape.w/2, y:startY+i*lineH, 'text-anchor':'middle', 'font-family':shape.fontFamily||'IBM Plex Sans, sans-serif', 'font-size':tm.fontSize, 'font-weight': shape.fontWeight||(shape.type==='text'?'600':'500'), fill:shape.textColor||COLORS.ink});
      t.textContent = ln;
      g.appendChild(t);
    });

    }
    g.style.cursor='pointer';
    g.style.touchAction='none';
    bindDragStart(g, (ev)=>onShapeMouseDown(ev, shape));
    g.addEventListener('dblclick', (ev)=>{
      if(ev.button!==0) return; // edição somente com duplo clique do botão esquerdo
      ev.preventDefault(); ev.stopPropagation();
      if(mode!=='select') mode='select';
      selection = {type:'element', id:shape.id};
      selectedIds = new Set([shape.id]);
      lastCreatedId = shape.id;
      openShapeEditor(shape);
    });
    board.appendChild(g);
    nodeMap[shape.id] = g;

    if(isSel && shape.type!=='text'){
      board.appendChild(el('rect',{x:shape.x-6,y:shape.y-6,width:shape.w+12,height:shape.h+12,fill:'none',stroke:COLORS.amber,'stroke-width':1.4,'stroke-dasharray':'6,4',rx:5,class:'lane-ui-control',style:'pointer-events:none;'}));
    }
    if(isSel && mode==='select' && selectedIds.size===1){
      [['nw',shape.x,shape.y],['ne',shape.x+shape.w,shape.y],['sw',shape.x,shape.y+shape.h],['se',shape.x+shape.w,shape.y+shape.h]].forEach(([k,hx,hy])=>{
        const handle = el('rect', {x:hx-6, y:hy-6, width:12, height:12, rx:2, fill:'#fff', stroke:COLORS.amber, 'stroke-width':1.6, class:'lane-ui-control', style:`cursor:${k==='nw'||k==='se'?'nwse':'nesw'}-resize; touch-action:none;`});
        bindDragStart(handle, (ev)=>startResize(ev, shape, k));
        board.appendChild(handle);
      });
    }
  });
}

// Duplo clique persistente no próprio quadro. As figuras SVG são redesenhadas ao
// selecionar/mover, então um listener de dblclick preso à figura pode perder o
// segundo clique. O quadro não é recriado; por isso rastreamos aqui o id lógico.
let shapeMouseClickState = {id:null, time:0};
board.addEventListener('mousedown', (ev)=>{
  if(ev.button!==0 || mode==='connect') return;
  const carrier = ev.target && ev.target.closest ? ev.target.closest('g[data-shape-id]') : null;
  if(!carrier || !board.contains(carrier)) return;
  const id = carrier.getAttribute('data-shape-id');
  if(!id) return;
  const now = performance.now();
  const isDouble = shapeMouseClickState.id===id && (now-shapeMouseClickState.time)<=700;
  shapeMouseClickState = isDouble ? {id:null,time:0} : {id,time:now};
  if(!isDouble) return;

  // Impede o segundo clique de iniciar arraste/seleção antes da abertura do editor.
  ev.preventDefault();
  ev.stopImmediatePropagation();
  const shape = getElement(id);
  if(!shape) return;
  mode='select';
  pendingConnectFrom=null;
  selection={type:'element', id};
  selectedIds=new Set([id]);
  lastCreatedId=id;
  focusBoardForShortcuts();
  requestAnimationFrame(()=>{
    render();
    requestAnimationFrame(()=>{
      const current=getElement(id);
      if(current) openShapeEditor(current);
    });
  });
}, true);

/* ---------- interactions ---------- */
function onShapeMouseDown(ev, shape){
 try{
  ev.stopPropagation();
  if(ev.type==='mousedown') focusBoardForShortcuts();
  if(mode==='connect'){
    if(!pendingConnectFrom){
      pendingConnectFrom = shape.id;
      showHint('Origem selecionada. Agora clique na caixa de destino da seta (Esc para cancelar).');
      render();
    } else if(pendingConnectFrom!==shape.id){
      snapshot();
      diagram.connectors.push({id:uid('c'), from:pendingConnectFrom, to:shape.id, label:''});
      pendingConnectFrom = null; mode='select'; hideHint();
      render();
    } else {
      showHint('Escolha uma caixa diferente da origem, ou pressione Esc para cancelar.');
    }
    return;
  }
  // O primeiro clique redesenha o SVG para atualizar a seleção; por isso alguns
  // navegadores não disparam o `dblclick` nativo no mesmo nó DOM. Detectamos o
  // segundo clique esquerdo pelo id lógico da figura, sem alterar o arraste.
  if(ev.type==='mousedown' && ev.button===0 && isDoubleTap('el:'+shape.id)){
    ev.preventDefault();
    selection = {type:'element', id:shape.id};
    selectedIds = new Set([shape.id]);
    lastCreatedId = shape.id;
    render();
    openShapeEditor(shape);
    return;
  }
  // Em telas touch, mantém o mesmo comportamento com duplo toque.
  if(ev.type==='touchstart' && isDoubleTap('el:'+shape.id)){
    selection = {type:'element', id:shape.id};
    selectedIds = new Set([shape.id]);
    lastCreatedId = shape.id;
    render();
    openShapeEditor(shape);
    return;
  }

  if(ev.shiftKey){
    if(selectedIds.has(shape.id)){
      selectedIds.delete(shape.id);
      selection = selectedIds.size ? {type:'element', id:[...selectedIds][selectedIds.size-1]} : null;
    } else {
      selectedIds.add(shape.id);
      selection = {type:'element', id:shape.id};
    }
    lastCreatedId = shape.id;
    render();
    return;
  }

  if(!selectedIds.has(shape.id)){
    selectedIds = new Set([shape.id]);
  }
  selection = {type:'element', id:shape.id};
  lastCreatedId = shape.id;
  render();
  snapshot();
  const groupIds = [...selectedIds];
  const startPos = {};
  groupIds.forEach(id=>{ const s = getElement(id); if(s) startPos[id] = {x:s.x, y:s.y}; });
  const start = toSvgPoint(ev);
  let dragStarted=false;
  function move(e2){
    try{
      const p = toSvgPoint(e2);
      const dx = p.x-start.x, dy = p.y-start.y;
      // Um simples clique/seleção não pode "encaixar" a figura na grade e criar
      // uma alteração invisível. Só começa a mover depois de um arraste intencional.
      if(!dragStarted && Math.hypot(dx,dy)<4) return;
      if(!dragStarted){
        lastTap = {key:null, time:0}; // arraste não conta como primeiro clique de um duplo clique
        shapeMouseClickState = {id:null,time:0};
      }
      dragStarted=true;
      const movingSet=new Set(groupIds);
      groupIds.forEach(id=>{
        const s = getElement(id);
        if(s && startPos[id]){
          const pos=magneticPositionForShape(s,startPos[id].x+dx,startPos[id].y+dy,movingSet);
          s.x=pos.x; s.y=pos.y;
        }
      });
      render();
    }catch(err){ reportRuntimeError(err); }
  }
  function up(){
    unbindMove(move);
    unbindUp(up);
    const moved = groupIds.some(id=>{ const s=getElement(id); return s && startPos[id] && (s.x!==startPos[id].x || s.y!==startPos[id].y); });
    if(!moved){
      undoStack.pop(); // no actual move, drop useless snapshot
    }else{
      rerouteConnectorsAfterShapeMove(groupIds,startPos);
      render();
    }
  }
  bindMove(move);
  bindUp(up);
 }catch(err){ reportRuntimeError(err); }
}

function startResize(ev, shape, corner){
  corner=corner||'se';
  ev.stopPropagation();
  snapshot();
  const start = toSvgPoint(ev);
  const o={x:shape.x,y:shape.y,w:shape.w,h:shape.h};
  function move(e2){
    try{
      const p = toSvgPoint(e2);
      const dx=p.x-start.x, dy=p.y-start.y;
      let w=o.w, h=o.h;
      if(corner.includes('e')) w=o.w+dx; if(corner.includes('w')) w=o.w-dx;
      if(corner.includes('s')) h=o.h+dy; if(corner.includes('n')) h=o.h-dy;
      w=snap(Math.max(70,w)); h=snap(Math.max(36,h));
      shape.w=w; shape.h=h;
      shape.x=corner.includes('w')?o.x+o.w-w:o.x;
      shape.y=corner.includes('n')?o.y+o.h-h:o.y;
      render();
    }catch(err){ reportRuntimeError(err); }
  }
  function up(){ unbindMove(move); unbindUp(up); }
  bindMove(move);
  bindUp(up);
}

function drawMarquee(x,y,w,h){
  let rect = document.getElementById('marqueeRect');
  if(!rect){
    rect = el('rect', {id:'marqueeRect', fill:'rgba(0,162,155,.12)', stroke:COLORS.amber, 'stroke-width':1.5, 'stroke-dasharray':'5,3'});
    board.appendChild(rect);
  }
  rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',w); rect.setAttribute('height',h);
}
function removeMarquee(){
  const rect = document.getElementById('marqueeRect');

}

function boardPointerDown(ev){
  const isEmptyArea = ev.target===board || (ev.target.classList && ev.target.classList.contains('lane-bg'));
  if(!isEmptyArea || mode!=='select') return;
  const marqueeStart = toSvgPoint(ev);
  const c0 = clientXY(ev);
  let dragged = false;
  function move(e2){
    const p2 = toSvgPoint(e2);
    const c2 = clientXY(e2);
    if(!dragged && (Math.abs(c2.clientX-c0.clientX)>4 || Math.abs(c2.clientY-c0.clientY)>4)) dragged = true;
    if(!dragged) return;
    const x = Math.min(marqueeStart.x, p2.x), y = Math.min(marqueeStart.y, p2.y);
    drawMarquee(x, y, Math.abs(p2.x-marqueeStart.x), Math.abs(p2.y-marqueeStart.y));
  }
  function up(e2){
    unbindMove(move); unbindUp(up);
    removeMarquee();
    if(dragged){
      const p2 = toSvgPoint(e2);
      const rx1=Math.min(marqueeStart.x,p2.x), ry1=Math.min(marqueeStart.y,p2.y);
      const rx2=Math.max(marqueeStart.x,p2.x), ry2=Math.max(marqueeStart.y,p2.y);
      const hit = diagram.elements.filter(el2 => el2.x < rx2 && el2.x+el2.w > rx1 && el2.y < ry2 && el2.y+el2.h > ry1).map(el2=>el2.id);
      if(hit.length){
        if(ev.shiftKey){ hit.forEach(id=>selectedIds.add(id)); } else { selectedIds = new Set(hit); }
        selection = {type:'element', id: hit[hit.length-1]};
      } else if(!ev.shiftKey){
        selectedIds = new Set(); selection = null;
      }
      suppressNextClick = true;
      render();
    }
  }
  bindMove(move);
  bindUp(up);
}

      diagram.elements.push(simBox, naoBox);

      selection = {type:'element', id:naoBox.id};

      lastCreatedId = naoBox.id;
      showHint('Decisão criada com os ramos SIM e NÃO. Dê duplo clique em cada caixa para escrever o texto.');

    }
    render();
    setTimeout(hideHint, 3500);
  } else if(mode==='connect'){
    pendingConnectFrom = null; mode='select'; hideHint(); render();
  } else {
    selection = null; selectedIds = new Set(); render();
  }
});

/* ---------- text editors ---------- */
function openShapeEditor(shape){
  const node = nodeMap[shape.id];
  if(!node) return;
  const rect = node.getBoundingClientRect();
  const oldText = shape.text || '';
  openInlineEditor(rect, oldText, (val)=>{
    if(val !== oldText){ snapshot(); shape.text = val; }
    render();
  });
}
function editLaneTitle(lane){
  // approximate header rect via current viewBox scale
  const x = laneX(diagram.lanes.indexOf(lane));
  const p1 = svgToScreen(x, 20), p2 = svgToScreen(x+lane.width, 66);
  openInlineEditor({left:p1.x, top:p1.y, width:p2.x-p1.x, height:p2.y-p1.y}, lane.title, (val)=>{ lane.title = val || 'RESPONSÁVEL'; render(); }, true);
}
function editConnectorLabel(c){
  const from=getElement(c.from), to=getElement(c.to);
  const pts = connectorPoints(c);
  const mp=c.labelPos?{x:c.labelPos.x,y:c.labelPos.y}:polylineMidpoint(pts);
  const mx=mp.x, my=mp.y;
  const p = svgToScreen(mx,my);
  snapshot();
  openInlineEditor({left:p.x-60, top:p.y-14, width:120, height:28}, c.label, (val)=>{ c.label = val; render(); });
}
function openInlineEditor(rect, value, onCommit, dark){
  const existing = document.querySelector('.inline-editor');
  if(existing) existing.remove();
  const ta = document.createElement('textarea');
  ta.className='inline-editor';
  ta.value = value||'';
  ta.style.left = rect.left+'px';
  ta.style.top = rect.top+'px';
  ta.style.width = Math.max(60,rect.width)+'px';
  ta.style.height = Math.max(24,rect.height)+'px';
  if(dark){ ta.style.background='#062E2A'; ta.style.color='#fff'; ta.style.fontWeight='700'; }
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let done=false;
  function commit(){
    if(done) return; done=true;
    onCommit(ta.value.trim());
    ta.remove();
  }
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ta.blur(); }
    if(e.key==='Escape'){ done=true; ta.remove(); }
  });
}
